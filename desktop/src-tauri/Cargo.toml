[package]
name = "bullpenlm-app"
version = "0.1.0"
description = "BullpenLM desktop wrapper"
authors = ["Beers Labs LLC"]
license = "MIT"
repository = "https://github.com/SipMyBeers/bullpenlm"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
# Default = the open-source self-host build. Steam-specific code is gated
# behind the `steam` feature, which is OFF by default. To produce the
# Steam-ready binary: `tauri build --features steam`.
default = []
steam = ["dep:steamworks"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
url = "2"
tokio = { version = "1", features = ["net", "time", "rt"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

# Optional — wired into src/steam.rs, only compiled with --features steam.
# Until Steam Direct approves our app ID, this stays unbuilt by default.
# Pinned to the latest stable release; bump cautiously since Steamworks
# SDK breaking changes have happened mid-version in the past.
steamworks = { version = "0.11", optional = true }
