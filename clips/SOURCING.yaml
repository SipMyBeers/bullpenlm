# Bumblebee clip sourcing manifest. URLs + target lines pre-filled.
#
# `line:` is what scripts/find_timestamps.py searches for in the YouTube
# auto-captions. When it finds a match it replaces REVIEW with the
# discovered second range (with a small pre/post roll). Re-run as URLs
# change or as you tune lines.
#
# Workflow:
#   python3 scripts/find_timestamps.py            # dry-run: see proposals
#   python3 scripts/find_timestamps.py --apply    # write back into this file
#   python3 scripts/fetch_clip.py --manifest clips/SOURCING.yaml

