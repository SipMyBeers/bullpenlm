# Bumblebee clip sourcing manifest.
#
# URLs are pre-filled. For each entry, the `start:` and `end:` are either:
#   - Fully set when the YouTube clip is already a dedicated short of that
#     exact moment (whole clip = whole short, ~3-6s).
#   - Marked REVIEW when the source is a longer scene/supercut and you
#     need to scrub the actual second range. The fetcher will skip REVIEW
#     entries; flip them to numbers when you've found the moment.
#
# Run:
#   python3 scripts/fetch_clip.py --manifest clips/SOURCING.yaml
#
# Re-run after editing — fetch_clip overwrites existing files of the same
# name so you can iterate on the trim without re-downloading.

