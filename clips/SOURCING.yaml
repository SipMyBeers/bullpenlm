# Bumblebee clip sourcing manifest.
#
# Fill in the `url:` for each entry once you've found a YouTube source, then run:
#   python3 scripts/fetch_clip.py --manifest clips/SOURCING.yaml
#
# Tips:
#   - Search YouTube for "wolf of wall street best scenes" / "glengarry glen ross
#     best of" / "boiler room scenes" — supercuts are gold. One supercut URL can
#     be reused across many rows (just change the start/end).
#   - The `start:` and `end:` accept "12.4" (seconds), "1:24" (mm:ss), or
#     "1:24.5" (mm:ss.fraction).
#   - The `name:` becomes the filename — keep it kebab-case, descriptive.
#   - Anything with `url: TODO` is skipped (you'll see it in the run log).

