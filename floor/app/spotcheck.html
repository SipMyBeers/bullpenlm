<title>Pop Drills · BullpenLM</title>

<style>
:root{--bg-0:#100f0d;--bg-1:#1b1916;--bg-2:#262219;--text:#efe9dd;--muted:#a59c8c;--dim:#6b6357;
  --accent:#6fb38a;--accent-2:#8fcfae;--accent-dim:#234a3a;--gold:#d8a13a;--danger:#e06a5a;--purple:#a78bfa;
  --mono:"Switzer",-apple-system,sans-serif;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Sentient",serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
.top{position:sticky;top:0;z-index:30;padding:14px 28px;display:flex;align-items:center;gap:20px;background:rgba(27,25,22,0.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(239,233,221,0.08)}
.brand{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}.crumb .sep{margin:0 8px;color:var(--dim)}.crumb .here{color:var(--accent)}

.wrap{max-width:1080px;margin:0 auto;padding:24px 28px}

.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{padding:10px 18px;background:transparent;color:var(--muted);border:1px solid rgba(239,233,221,0.10);border-radius:6px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;cursor:pointer}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:rgba(167,139,250,0.10);color:#c4b5fd;border-color:rgba(167,139,250,0.30)}
.tabs button .ct{margin-left:6px;color:var(--gold);font-family:var(--display);font-size:14px;line-height:1}

.drill-strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;margin-bottom:16px;background:linear-gradient(135deg,rgba(216,161,58,0.08),rgba(38,34,25,0.55));border:1px solid rgba(216,161,58,0.30);border-radius:10px}
.drill-strip .ds-streak{font-family:var(--display);font-size:22px;color:var(--gold);line-height:1;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px}
.drill-strip .ds-streak .num{font-size:30px}
.drill-strip .ds-streak .mult{font-family:var(--mono);font-size:10px;letter-spacing:.10em;color:var(--accent-2);text-transform:uppercase}
.drill-strip .ds-nudge{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);flex:1 1 220px;line-height:1.4}
.drill-strip .ds-reps{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 12px;border:1px solid rgba(239,233,221,0.12);border-radius:999px}
.drill-strip .ds-reps b{color:var(--accent);font-family:var(--display);font-size:14px;letter-spacing:0}
.drill-strip .ds-reps.met b{color:var(--gold)}

/* TCS-launch self-drill panel (shown when ?tcs=<id> is in the URL) */
.tcs-launch{padding:22px 24px;margin-bottom:16px;background:linear-gradient(135deg,rgba(111,179,138,0.10),rgba(167,139,250,0.05));border:1px solid rgba(111,179,138,0.35);border-radius:12px}
.tcs-launch .ll{font-family:var(--mono);font-size:10.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px}
.tcs-launch h2{font-family:var(--display);font-size:26px;color:var(--text);margin:0 0 8px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
.tcs-launch .tl-prompt{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#efe9dd;background:rgba(0,0,0,0.20);padding:12px 14px;border-radius:8px;border-left:3px solid var(--gold);line-height:1.55;margin-bottom:14px}
.tcs-launch textarea{width:100%;padding:11px 13px;background:rgba(0,0,0,0.30);border:1px solid rgba(239,233,221,0.15);border-radius:6px;color:var(--text);font-family:var(--serif);font-size:14.5px;line-height:1.5;min-height:140px;resize:vertical}
.tcs-launch .tl-row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tcs-launch .tl-fire{padding:11px 20px;background:var(--accent);color:#0a1a14;border:none;border-radius:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
.tcs-launch .tl-link{font-family:var(--mono);font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid rgba(239,233,221,0.15);padding:11px 16px;border-radius:5px}
.tcs-launch .tl-link:hover{color:var(--text);border-color:var(--text)}
.sc-card{padding:20px 24px;background:rgba(27,25,22,0.55);border:1px solid rgba(239,233,221,0.08);border-radius:12px;margin-bottom:14px}
.sc-card.open{border-color:rgba(216,161,58,0.40);background:linear-gradient(135deg,rgba(216,161,58,0.08),rgba(38,34,25,0.55))}
.sc-card.responded{border-color:rgba(167,139,250,0.40);background:rgba(167,139,250,0.06)}
.sc-card.graded.go{border-color:rgba(111,179,138,0.40);background:rgba(111,179,138,0.05)}
.sc-card.graded.nogo{border-color:rgba(224,106,90,0.30);background:rgba(224,106,90,0.05)}

.sc-hdr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;margin-bottom:12px}
.sc-hdr .phase{font-family:var(--display);font-size:30px;color:var(--gold);line-height:1;width:46px;text-align:center}
.sc-hdr .info h3{font-family:var(--display);font-size:22px;color:var(--text);margin:0 0 4px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
.sc-hdr .info .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
.sc-hdr .info .meta .k{color:var(--accent-2)}
.sc-hdr .status{padding:5px 12px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;align-self:center}
.sc-hdr .status.open{background:var(--gold);color:#0a1a14}
.sc-hdr .status.responded{background:rgba(167,139,250,0.20);color:#c4b5fd}
.sc-hdr .status.graded{background:rgba(165,156,140,0.10);color:var(--muted)}
.sc-hdr .status.GO{background:var(--accent);color:#0a1a14}
.sc-hdr .status.NO_GO{background:rgba(224,106,90,0.20);color:var(--danger)}

.sc-prompt{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#efe9dd;background:rgba(0,0,0,0.20);padding:14px 16px;border-radius:8px;border-left:3px solid var(--gold);line-height:1.55;margin-bottom:12px}
.sc-response{font-family:var(--serif);font-size:14px;color:#efe9dd;background:rgba(0,0,0,0.30);padding:12px 14px;border-radius:6px;border-left:3px solid var(--purple);line-height:1.55;white-space:pre-wrap;margin-top:10px;max-height:240px;overflow-y:auto}
.sc-feedback{font-family:var(--mono);font-size:11px;color:var(--accent-2);background:rgba(111,179,138,0.06);padding:10px 14px;border-radius:6px;margin-top:10px;letter-spacing:.04em;line-height:1.55}
.sc-feedback.bad{color:var(--danger);background:rgba(224,106,90,0.06)}

.compose{margin-top:12px}
.compose textarea{width:100%;padding:11px 13px;background:rgba(0,0,0,0.30);border:1px solid rgba(239,233,221,0.15);border-radius:6px;color:var(--text);font-family:var(--serif);font-size:14.5px;line-height:1.5;min-height:140px;resize:vertical}
.compose .row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}
.compose .timer{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.10em}
.compose .timer.warn{color:var(--danger)}
.compose .submit{padding:10px 18px;background:var(--accent);color:#0a1a14;border:none;border-radius:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}

/* Grade actions for checkers */
.grade-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(239,233,221,0.08)}
.grade-actions button{padding:8px 16px;border:none;border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
.grade-actions .auto{background:rgba(167,139,250,0.15);color:#c4b5fd;border:1px solid rgba(167,139,250,0.30)}
.grade-actions .go{background:var(--accent);color:#0a1a14}
.grade-actions .nogo{background:rgba(224,106,90,0.18);color:var(--danger);border:1px solid rgba(224,106,90,0.30)}

.empty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:24px;letter-spacing:.06em}

.toast{position:fixed;bottom:24px;right:24px;padding:14px 18px;background:rgba(111,179,138,0.95);color:#0a1a14;border-radius:8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;box-shadow:0 4px 20px rgba(0,0,0,0.40);transform:translateY(100px);opacity:0;transition:all .25s;z-index:200}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:rgba(224,106,90,0.95)}
</style>

<!-- tutorial.js intentionally NOT loaded here: this is the "first drill"
     landing page (linked from the tutorial's "Skip to drilling" CTA). The
     office-style WELCOME overlay must not re-fire on top of the drill. -->
<script>
  // Belt-and-suspenders guard: if any earlier-cached include or another
  // page already injected the tutorial overlay, strip it ON THIS PAGE only.
  // Do NOT mark the tour complete globally — that would suppress the real
  // first-run tour on office/studio/arena for a brand-new rep.
  (function(){
    function killTutorial(){
      document.querySelectorAll('.bp-tut-overlay').forEach(function(n){ n.remove(); });
    }
    killTutorial();
    if (document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', killTutorial);
    // Catch the deferred setTimeout(show,200) path too.
    setTimeout(killTutorial, 260);
  })();
</script>

<body>

<header class="top">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>
  <nav class="crumb">
    <a href="/">Floor</a><span class="sep">/</span>
    <a id="back-tcs" href="/app/tcs.html">Plays</a><span class="sep">/</span>
    <span class="here">Pop Drills</span>
  </nav>
</header>

<main class="wrap">
  <div class="drill-strip" id="drill-strip" style="display:none"></div>
  <div class="tcs-launch" id="tcs-launch" style="display:none"></div>
  <div class="tabs">
    <button data-view="incoming" class="active">Incoming <span class="ct" id="ct-incoming">0</span></button>
    <button data-view="sent">Sent <span class="ct" id="ct-sent">0</span></button>
    <button data-view="history">History <span class="ct" id="ct-history">0</span></button>
  </div>

  <div id="list"><div class="empty">Loading…</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
const params  = new URLSearchParams(location.search);
const BULLPEN = params.get('b')   || 'killsesh';
const REP     = params.get('rep') || localStorage.getItem('bullpen-rep') || 'beers';

document.getElementById('back-tcs').href = '/app/tcs.html?b=' + encodeURIComponent(BULLPEN) + '&rep=' + encodeURIComponent(REP);

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast'+(err?' error':''),2600); }
async function fetchJSON(url, opts){
  const r = await fetch(url, opts||{});
  if(!r.ok){ let m=r.statusText; try{m=(await r.json()).error||m;}catch(_){} throw new Error(m); }
  return r.json();
}
function $(id){ return document.getElementById(id); }

let VIEW = 'incoming';
let TIMERS = {};

function renderCard(sc){
  const card = el('div', 'sc-card ' + sc.status
    + (sc.status === 'graded' ? ' ' + (sc.result === 'GO' ? 'go' : 'nogo') : ''));
  const hdr = el('div', 'sc-hdr');
  hdr.appendChild(el('div', 'phase', 'P' + (sc.phase_tier || '?')));
  const info = el('div', 'info');
  info.appendChild(el('h3', null, sc.tcs_name));
  const meta = el('div', 'meta');
  if(sc.target === REP){
    meta.appendChild(document.createTextNode('from '));
    meta.appendChild(el('span', 'k', sc.checker));
    meta.appendChild(document.createTextNode(' · fired ' + (sc.fired_at || '').replace('T',' ').slice(0,16)));
  } else {
    meta.appendChild(document.createTextNode('to '));
    meta.appendChild(el('span', 'k', sc.target));
    meta.appendChild(document.createTextNode(' · fired ' + (sc.fired_at || '').replace('T',' ').slice(0,16)));
  }
  if(sc.self_drill) meta.appendChild(document.createTextNode(' · SELF'));
  info.appendChild(meta);
  hdr.appendChild(info);
  if(sc.status === 'graded'){
    hdr.appendChild(el('span', 'status ' + sc.result, sc.result === 'GO' ? '✓ GO' : '✗ NO-GO'));
  } else {
    hdr.appendChild(el('span', 'status ' + sc.status, sc.status));
  }
  card.appendChild(hdr);

  card.appendChild(el('div', 'sc-prompt', sc.prompt));

  // If I'm the target AND status is open, show compose box
  if(sc.target === REP && sc.status === 'open'){
    const cw = el('div', 'compose');
    const ta = document.createElement('textarea');
    ta.placeholder = 'Type your response — every word you would say. Or hit Record to speak it. Auto-graded by keyword check.';
    cw.appendChild(ta);
    const row = el('div', 'row');
    const t = el('div', 'timer', '');
    row.appendChild(t);

    // Audio recording button — captures opus, transcribes via whisper, fills textarea
    const recBtn = el('button', 'submit', 'Record');
    recBtn.style.background = '#e06a5a';
    recBtn.style.color = '#0a1a14';
    let rec = null, recStream = null, recChunks = [];
    recBtn.onclick = async () => {
      if (rec && rec.state === 'recording') {
        rec.stop();
        return;
      }
      try {
        recStream = await navigator.mediaDevices.getUserMedia({audio:{
          echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
      } catch(e){ toast('Mic permission denied: ' + e.message, true); return; }
      const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus']
        .find(m => MediaRecorder.isTypeSupported(m)) || '';
      try { rec = new MediaRecorder(recStream, mime ? {mimeType: mime} : undefined); }
      catch(e){ toast('Recorder not supported: '+e.message, true); return; }
      recChunks = [];
      rec.ondataavailable = e => { if(e.data && e.data.size>0) recChunks.push(e.data); };
      rec.onstop = async () => {
        recStream.getTracks().forEach(t => t.stop());
        recBtn.textContent = 'Record';
        recBtn.disabled = true;
        toast('Transcribing…');
        const blob = new Blob(recChunks, {type: rec.mimeType || 'audio/webm'});
        try {
          const r = await fetch('/api/transcribe-opus', {
            method:'POST',
            headers:{'Content-Type':'application/octet-stream'},
            body: blob
          });
          const d = await r.json();
          if (r.ok && d.text) {
            ta.value = (ta.value ? ta.value + ' ' : '') + d.text;
            toast('Transcribed — review + submit');
          } else {
            toast('Transcription failed: ' + (d.error || ('HTTP '+r.status)), true);
          }
        } catch(e){ toast('Network error: '+e.message, true); }
        recBtn.disabled = false;
      };
      rec.start();
      recBtn.textContent = 'Stop';
      toast('Recording — hit Stop when done');
    };
    row.appendChild(recBtn);

    const btn = el('button', 'submit', '▶ Submit response');
    btn.onclick = async () => {
      const response = ta.value.trim();
      if(!response){ toast('Type a response', true); return; }
      btn.disabled = true;
      try {
        const graded = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks/${encodeURIComponent(sc.id)}/respond`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({rep: REP, response})
        });
        if(graded.result === 'GO'){ toast('✓ GO — qualified'); }
        else if(graded.result === 'NO_GO'){ toast('NO-GO — ' + (graded.feedback||'Run it back'), true); }
        else { toast('Submitted — awaiting grade'); }
        load();
      } catch(e){ toast(e.message, true); btn.disabled = false; }
    };
    row.appendChild(btn);
    cw.appendChild(row);
    card.appendChild(cw);

    // Live timer
    const fired = new Date(sc.fired_at);
    const duration = (sc.seconds || 90) * 1000;
    if(TIMERS[sc.id]) clearInterval(TIMERS[sc.id]);
    TIMERS[sc.id] = setInterval(() => {
      const left = Math.max(0, duration - (Date.now() - fired));
      const s = Math.ceil(left / 1000);
      t.textContent = s + 's left';
      t.classList.toggle('warn', s < 15);
      if(s <= 0){ clearInterval(TIMERS[sc.id]); }
    }, 500);
  }

  // Existing response
  if(sc.response){
    card.appendChild(el('div', 'sc-response', sc.response));
  }

  // Feedback (if graded)
  if(sc.status === 'graded' && sc.feedback){
    card.appendChild(el('div', 'sc-feedback' + (sc.result === 'NO_GO' ? ' bad' : ''),
                       sc.feedback + ' · score ' + (sc.score || 0)));
  }

  // Grade actions (if I'm the checker + status is responded)
  if(sc.checker === REP && sc.status === 'responded' && !sc.self_drill){
    const actions = el('div', 'grade-actions');
    const auto = el('button', 'auto', 'Auto-grade');
    auto.onclick = () => gradeIt(sc, null, null);
    actions.appendChild(auto);
    const go = el('button', 'go', '✓ GO');
    go.onclick = () => gradeIt(sc, 'GO', 'Looked good — keep running it.');
    actions.appendChild(go);
    const nogo = el('button', 'nogo', '✗ NO-GO');
    nogo.onclick = () => {
      const fb = prompt('Quick coaching note for the rep?');
      if(fb === null) return;
      gradeIt(sc, 'NO_GO', fb || 'Run it back.');
    };
    actions.appendChild(nogo);
    card.appendChild(actions);
  }

  return card;
}

async function gradeIt(sc, result, feedback){
  try {
    await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks/${encodeURIComponent(sc.id)}/grade`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, result, feedback})
    });
    toast('Graded');
    load();
  } catch(e){ toast(e.message, true); }
}

async function loadView(){
  const root = $('list'); clear(root);
  root.appendChild(el('div', 'empty', 'Loading…'));
  // Clear any running timers
  for(const k of Object.keys(TIMERS)){ clearInterval(TIMERS[k]); delete TIMERS[k]; }
  try {
    let url;
    if(VIEW === 'incoming') url = `/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}&role=target`;
    else if(VIEW === 'sent') url = `/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}&role=checker`;
    else url = `/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}`;
    const r = await fetchJSON(url);
    let items = r.spotchecks || [];
    if(VIEW === 'incoming') items = items.filter(s => s.status === 'open');
    if(VIEW === 'history') items = items.filter(s => s.status === 'graded');
    clear(root);
    if(!items.length){
      const msg = VIEW === 'incoming' ? 'No drills waiting. Knock out a self-drill while it\'s quiet.'
                : VIEW === 'sent'     ? 'You haven\'t fired any drills yet. Spot-check a teammate from the Plays page.'
                :                       'No history yet.';
      root.appendChild(el('div', 'empty', msg));
    } else {
      for(const sc of items) root.appendChild(renderCard(sc));
    }
  } catch(e){
    clear(root); root.appendChild(el('div', 'empty', 'Failed: ' + e.message));
  }
}

async function loadCounts(){
  try {
    const all = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}`);
    const xs = all.spotchecks || [];
    $('ct-incoming').textContent = xs.filter(s => s.target === REP && s.status === 'open').length;
    $('ct-sent').textContent     = xs.filter(s => s.checker === REP).length;
    $('ct-history').textContent  = xs.filter(s => s.status === 'graded').length;
  } catch(_){}
}

for(const btn of document.querySelectorAll('.tabs button[data-view]')){
  btn.onclick = () => {
    VIEW = btn.dataset.view;
    for(const x of document.querySelectorAll('.tabs button[data-view]')) x.classList.remove('active');
    btn.classList.add('active');
    loadView();
  };
}

(function(){
  function beat(){
    fetch(`/api/b/${encodeURIComponent(BULLPEN)}/presence/beat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, page: 'spotcheck', status: 'in the drill inbox'}),
    }).catch(()=>{});
  }
  beat(); setInterval(beat, 20000);
})();

let sse = null;
function connectSSE(){
  try {
    sse = new EventSource(`/api/b/${encodeURIComponent(BULLPEN)}/stream`);
    sse.onmessage = (msg) => {
      try {
        const e = JSON.parse(msg.data);
        if(['spotcheck_fired','spotcheck_responded'].includes(e.kind)){
          loadCounts();
          loadView();
          loadDrillStrip();
        }
      } catch(_){}
    };
    sse.onerror = () => { try{sse.close()}catch(_){} setTimeout(connectSSE, 3000); };
  } catch(_){ setTimeout(connectSSE, 3000); }
}

// ── Daily drill quota + streak strip ────────────────────────────────
// Read-only. GET /streaks/<rep> gives day streak + XP tier. Reps today =
// scored drills the rep completed today, counted from the spotchecks the
// page already loads (graded checks where this rep was the target).
const DAILY_QUOTA = 3;
async function loadDrillStrip(){
  const strip = $('drill-strip');
  if(!strip) return;
  let s = {}, repsToday = 0;
  const today = new Date().toISOString().slice(0,10);
  try {
    const [streak, all] = await Promise.all([
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/streaks/${encodeURIComponent(REP)}`).catch(()=>({})),
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}`).catch(()=>({spotchecks:[]})),
    ]);
    s = streak || {};
    repsToday = (all.spotchecks || []).filter(x =>
      x.target === REP && x.status === 'graded' &&
      ((x.graded_at || x.responded_at || x.fired_at || '').slice(0,10) === today)
    ).length;
  } catch(_){}
  const n = (s && s.streak) || 0;
  const mult = (s && s.tier && s.tier.label) || '';
  clear(strip);

  const st = el('div', 'ds-streak');
  st.appendChild(el('span', 'num', String(n)));
  st.appendChild(el('span', null, 'day streak'));
  if(mult) st.appendChild(el('span', 'mult', '(' + mult + ')'));
  strip.appendChild(st);

  const met = repsToday >= DAILY_QUOTA;
  const nudge = el('div', 'ds-nudge',
    met ? 'Quota cleared — every extra drill banks more XP.'
        : n > 0 ? 'One more drill keeps it alive.'
                : 'Knock out a drill today to start a streak.');
  strip.appendChild(nudge);

  const reps = el('div', 'ds-reps' + (met ? ' met' : ''));
  reps.appendChild(document.createTextNode('Reps today '));
  reps.appendChild(el('b', null, repsToday + '/' + DAILY_QUOTA));
  strip.appendChild(reps);

  strip.style.display = 'flex';
}

// ── FIX (b): TCS-launch self-drill ──────────────────────────────────
// A brand-new closer is sent here via /spotcheck.html?...&tcs=<id>. Without
// this, they'd see an empty "No drills waiting" inbox with no way to start.
// We surface a startable self-drill for that TCS: fetch the play, show its
// spot-check prompt + a response box, then create+grade a self-drill using
// the exact same endpoints training.html / tcs.html use:
//   POST /spotchecks {rep,target:rep,tcs_id}  →  POST /spotchecks/<id>/respond
const TCS_PARAM = params.get('tcs');
async function showTcsLaunch(tcsId){
  const panel = $('tcs-launch');
  if(!panel) return;
  clear(panel);
  let tcs = null;
  try { tcs = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/tcs/${encodeURIComponent(tcsId)}`); }
  catch(_){}

  panel.appendChild(el('div', 'll', 'Your first drill'));
  panel.appendChild(el('h2', null, tcs ? (tcs.name || tcsId) : tcsId));
  panel.appendChild(el('div', 'tl-prompt',
    (tcs && tcs.spot_check_prompt) ? tcs.spot_check_prompt
                                   : 'Demonstrate the play — every word you would say.'));
  const ta = document.createElement('textarea');
  ta.placeholder = 'Type your response — every word you\'d say. Auto-graded by keyword check. Pass = GO, +XP, Top Pack updates.';
  panel.appendChild(ta);

  const row = el('div', 'tl-row');
  const fire = el('button', 'tl-fire', '▶ Start self-drill + auto-grade');
  fire.onclick = async () => {
    const response = ta.value.trim();
    if(!response){ toast('Type a response first', true); ta.focus(); return; }
    fire.disabled = true;
    try {
      const sc = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rep: REP, target: REP, tcs_id: tcsId})
      });
      const graded = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks/${encodeURIComponent(sc.id)}/respond`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rep: REP, response})
      });
      if(graded.result === 'GO'){ toast('✓ GO — added to your Top Pack'); }
      else if(graded.result === 'NO_GO'){ toast('NO-GO — ' + (graded.feedback || 'run it back'), true); }
      else { toast('Submitted — awaiting grade'); }
      // Refresh the inbox/history + strip; keep the panel for another rep.
      ta.value = '';
      loadView(); loadCounts(); loadDrillStrip();
    } catch(e){ toast(e.message, true); }
    fire.disabled = false;
  };
  row.appendChild(fire);

  // Fallback path: open the full play in the Studio/Plays view.
  const link = el('a', 'tl-link', 'Open full play →');
  link.href = '/app/tcs.html?b=' + encodeURIComponent(BULLPEN) + '&rep=' + encodeURIComponent(REP) + '#' + encodeURIComponent(tcsId);
  row.appendChild(link);

  panel.appendChild(row);
  panel.style.display = 'block';
  setTimeout(() => ta.focus(), 80);
}

if(TCS_PARAM){ showTcsLaunch(TCS_PARAM); }

loadView(); loadCounts(); loadDrillStrip(); connectSSE();
setInterval(loadCounts, 15000);
setInterval(loadDrillStrip, 30000);
</script>
