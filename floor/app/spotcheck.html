<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pop Drills · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=tanker@400&f%5B%5D=bespoke-serif@400,500,600,700&f%5B%5D=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#1a1208;--bg-1:#2a1d10;--bg-2:#3d2c1a;--text:#f5e8d8;--muted:#a89a87;--dim:#806a4f;
  --accent:#34d399;--accent-2:#6ee7b7;--accent-dim:#064e3b;--gold:#fbbf24;--danger:#f87171;--purple:#a78bfa;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Tanker",serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
.top{position:sticky;top:0;z-index:30;padding:14px 28px;display:flex;align-items:center;gap:20px;background:rgba(26,18,8,0.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(245,232,216,0.08)}
.brand{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}.crumb .sep{margin:0 8px;color:var(--dim)}.crumb .here{color:var(--accent)}

.wrap{max-width:1080px;margin:0 auto;padding:24px 28px}

.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{padding:10px 18px;background:transparent;color:var(--muted);border:1px solid rgba(245,232,216,0.10);border-radius:6px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;cursor:pointer}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:rgba(167,139,250,0.10);color:#c4b5fd;border-color:rgba(167,139,250,0.30)}
.tabs button .ct{margin-left:6px;color:var(--gold);font-family:var(--display);font-size:14px;line-height:1}

.sc-card{padding:20px 24px;background:rgba(26,18,8,0.55);border:1px solid rgba(245,232,216,0.08);border-radius:12px;margin-bottom:14px}
.sc-card.open{border-color:rgba(251,191,36,0.40);background:linear-gradient(135deg,rgba(251,191,36,0.08),rgba(42,29,16,0.55))}
.sc-card.responded{border-color:rgba(167,139,250,0.40);background:rgba(167,139,250,0.06)}
.sc-card.graded.go{border-color:rgba(52,211,153,0.40);background:rgba(52,211,153,0.05)}
.sc-card.graded.nogo{border-color:rgba(248,113,113,0.30);background:rgba(248,113,113,0.05)}

.sc-hdr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;margin-bottom:12px}
.sc-hdr .phase{font-family:var(--display);font-size:30px;color:var(--gold);line-height:1;width:46px;text-align:center}
.sc-hdr .info h3{font-family:var(--display);font-size:22px;color:var(--text);margin:0 0 4px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
.sc-hdr .info .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
.sc-hdr .info .meta .k{color:var(--accent-2)}
.sc-hdr .status{padding:5px 12px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;align-self:center}
.sc-hdr .status.open{background:var(--gold);color:#0a1a14}
.sc-hdr .status.responded{background:rgba(167,139,250,0.20);color:#c4b5fd}
.sc-hdr .status.graded{background:rgba(168,154,135,0.10);color:var(--muted)}
.sc-hdr .status.GO{background:var(--accent);color:#0a1a14}
.sc-hdr .status.NO_GO{background:rgba(248,113,113,0.20);color:var(--danger)}

.sc-prompt{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#e5d8c4;background:rgba(0,0,0,0.20);padding:14px 16px;border-radius:8px;border-left:3px solid var(--gold);line-height:1.55;margin-bottom:12px}
.sc-response{font-family:var(--serif);font-size:14px;color:#e5d8c4;background:rgba(0,0,0,0.30);padding:12px 14px;border-radius:6px;border-left:3px solid var(--purple);line-height:1.55;white-space:pre-wrap;margin-top:10px;max-height:240px;overflow-y:auto}
.sc-feedback{font-family:var(--mono);font-size:11px;color:var(--accent-2);background:rgba(52,211,153,0.06);padding:10px 14px;border-radius:6px;margin-top:10px;letter-spacing:.04em;line-height:1.55}
.sc-feedback.bad{color:var(--danger);background:rgba(248,113,113,0.06)}

.compose{margin-top:12px}
.compose textarea{width:100%;padding:11px 13px;background:rgba(0,0,0,0.30);border:1px solid rgba(245,232,216,0.15);border-radius:6px;color:var(--text);font-family:var(--serif);font-size:14.5px;line-height:1.5;min-height:140px;resize:vertical}
.compose .row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}
.compose .timer{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.10em}
.compose .timer.warn{color:var(--danger)}
.compose .submit{padding:10px 18px;background:var(--accent);color:#0a1a14;border:none;border-radius:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}

/* Grade actions for checkers */
.grade-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(245,232,216,0.08)}
.grade-actions button{padding:8px 16px;border:none;border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
.grade-actions .auto{background:rgba(167,139,250,0.15);color:#c4b5fd;border:1px solid rgba(167,139,250,0.30)}
.grade-actions .go{background:var(--accent);color:#0a1a14}
.grade-actions .nogo{background:rgba(248,113,113,0.18);color:var(--danger);border:1px solid rgba(248,113,113,0.30)}

.empty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:24px;letter-spacing:.06em}

.toast{position:fixed;bottom:24px;right:24px;padding:14px 18px;background:rgba(52,211,153,0.95);color:#0a1a14;border-radius:8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;box-shadow:0 4px 20px rgba(0,0,0,0.40);transform:translateY(100px);opacity:0;transition:all .25s;z-index:200}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:rgba(248,113,113,0.95)}
</style>
<script src="/app/challenge-notif.js" defer></script>
<script src="/app/tutorial.js" defer></script>
</head>
<body>

<header class="top">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>
  <nav class="crumb">
    <a href="/">Floor</a><span class="sep">/</span>
    <a id="back-tcs" href="/app/tcs.html">Plays</a><span class="sep">/</span>
    <span class="here">Pop Drills</span>
  </nav>
</header>

<main class="wrap">
  <div class="tabs">
    <button data-view="incoming" class="active">Incoming <span class="ct" id="ct-incoming">0</span></button>
    <button data-view="sent">Sent <span class="ct" id="ct-sent">0</span></button>
    <button data-view="history">History <span class="ct" id="ct-history">0</span></button>
  </div>

  <div id="list"><div class="empty">Loading…</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
const params  = new URLSearchParams(location.search);
const BULLPEN = params.get('b')   || 'killsesh';
const REP     = params.get('rep') || localStorage.getItem('bullpen-rep') || 'beers';

document.getElementById('back-tcs').href = '/app/tcs.html?b=' + encodeURIComponent(BULLPEN) + '&rep=' + encodeURIComponent(REP);

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast'+(err?' error':''),2600); }
async function fetchJSON(url, opts){
  const r = await fetch(url, opts||{});
  if(!r.ok){ let m=r.statusText; try{m=(await r.json()).error||m;}catch(_){} throw new Error(m); }
  return r.json();
}
function $(id){ return document.getElementById(id); }

let VIEW = 'incoming';
let TIMERS = {};

function renderCard(sc){
  const card = el('div', 'sc-card ' + sc.status
    + (sc.status === 'graded' ? ' ' + (sc.result === 'GO' ? 'go' : 'nogo') : ''));
  const hdr = el('div', 'sc-hdr');
  hdr.appendChild(el('div', 'phase', 'P' + (sc.phase_tier || '?')));
  const info = el('div', 'info');
  info.appendChild(el('h3', null, sc.tcs_name));
  const meta = el('div', 'meta');
  if(sc.target === REP){
    meta.appendChild(document.createTextNode('from '));
    meta.appendChild(el('span', 'k', sc.checker));
    meta.appendChild(document.createTextNode(' · fired ' + (sc.fired_at || '').replace('T',' ').slice(0,16)));
  } else {
    meta.appendChild(document.createTextNode('to '));
    meta.appendChild(el('span', 'k', sc.target));
    meta.appendChild(document.createTextNode(' · fired ' + (sc.fired_at || '').replace('T',' ').slice(0,16)));
  }
  if(sc.self_drill) meta.appendChild(document.createTextNode(' · SELF'));
  info.appendChild(meta);
  hdr.appendChild(info);
  if(sc.status === 'graded'){
    hdr.appendChild(el('span', 'status ' + sc.result, sc.result === 'GO' ? '✓ GO' : '✗ NO-GO'));
  } else {
    hdr.appendChild(el('span', 'status ' + sc.status, sc.status));
  }
  card.appendChild(hdr);

  card.appendChild(el('div', 'sc-prompt', sc.prompt));

  // If I'm the target AND status is open, show compose box
  if(sc.target === REP && sc.status === 'open'){
    const cw = el('div', 'compose');
    const ta = document.createElement('textarea');
    ta.placeholder = 'Type your response — every word you would say. Or hit ⏺ Record to speak it. Auto-graded by keyword check.';
    cw.appendChild(ta);
    const row = el('div', 'row');
    const t = el('div', 'timer', '');
    row.appendChild(t);

    // Audio recording button — captures opus, transcribes via whisper, fills textarea
    const recBtn = el('button', 'submit', '⏺ Record');
    recBtn.style.background = '#f87171';
    recBtn.style.color = '#0a1a14';
    let rec = null, recStream = null, recChunks = [];
    recBtn.onclick = async () => {
      if (rec && rec.state === 'recording') {
        rec.stop();
        return;
      }
      try {
        recStream = await navigator.mediaDevices.getUserMedia({audio:{
          echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
      } catch(e){ toast('Mic permission denied: ' + e.message, true); return; }
      const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus']
        .find(m => MediaRecorder.isTypeSupported(m)) || '';
      try { rec = new MediaRecorder(recStream, mime ? {mimeType: mime} : undefined); }
      catch(e){ toast('Recorder not supported: '+e.message, true); return; }
      recChunks = [];
      rec.ondataavailable = e => { if(e.data && e.data.size>0) recChunks.push(e.data); };
      rec.onstop = async () => {
        recStream.getTracks().forEach(t => t.stop());
        recBtn.textContent = '⏺ Record';
        recBtn.disabled = true;
        toast('Transcribing…');
        const blob = new Blob(recChunks, {type: rec.mimeType || 'audio/webm'});
        try {
          const r = await fetch('/api/transcribe-opus', {
            method:'POST',
            headers:{'Content-Type':'application/octet-stream'},
            body: blob
          });
          const d = await r.json();
          if (r.ok && d.text) {
            ta.value = (ta.value ? ta.value + ' ' : '') + d.text;
            toast('✓ Transcribed — review + submit');
          } else {
            toast('Transcription failed: ' + (d.error || ('HTTP '+r.status)), true);
          }
        } catch(e){ toast('Network error: '+e.message, true); }
        recBtn.disabled = false;
      };
      rec.start();
      recBtn.textContent = '⏹ Stop';
      toast('Recording — hit Stop when done');
    };
    row.appendChild(recBtn);

    const btn = el('button', 'submit', '▶ Submit response');
    btn.onclick = async () => {
      const response = ta.value.trim();
      if(!response){ toast('Type a response', true); return; }
      btn.disabled = true;
      try {
        const graded = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks/${encodeURIComponent(sc.id)}/respond`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({rep: REP, response})
        });
        if(graded.result === 'GO'){ toast('✓ GO — qualified'); }
        else if(graded.result === 'NO_GO'){ toast('NO-GO — ' + (graded.feedback||'Run it back'), true); }
        else { toast('Submitted — awaiting grade'); }
        load();
      } catch(e){ toast(e.message, true); btn.disabled = false; }
    };
    row.appendChild(btn);
    cw.appendChild(row);
    card.appendChild(cw);

    // Live timer
    const fired = new Date(sc.fired_at);
    const duration = (sc.seconds || 90) * 1000;
    if(TIMERS[sc.id]) clearInterval(TIMERS[sc.id]);
    TIMERS[sc.id] = setInterval(() => {
      const left = Math.max(0, duration - (Date.now() - fired));
      const s = Math.ceil(left / 1000);
      t.textContent = s + 's left';
      t.classList.toggle('warn', s < 15);
      if(s <= 0){ clearInterval(TIMERS[sc.id]); }
    }, 500);
  }

  // Existing response
  if(sc.response){
    card.appendChild(el('div', 'sc-response', sc.response));
  }

  // Feedback (if graded)
  if(sc.status === 'graded' && sc.feedback){
    card.appendChild(el('div', 'sc-feedback' + (sc.result === 'NO_GO' ? ' bad' : ''),
                       sc.feedback + ' · score ' + (sc.score || 0)));
  }

  // Grade actions (if I'm the checker + status is responded)
  if(sc.checker === REP && sc.status === 'responded' && !sc.self_drill){
    const actions = el('div', 'grade-actions');
    const auto = el('button', 'auto', '⚙ Auto-grade');
    auto.onclick = () => gradeIt(sc, null, null);
    actions.appendChild(auto);
    const go = el('button', 'go', '✓ GO');
    go.onclick = () => gradeIt(sc, 'GO', 'Looked good — keep running it.');
    actions.appendChild(go);
    const nogo = el('button', 'nogo', '✗ NO-GO');
    nogo.onclick = () => {
      const fb = prompt('Quick coaching note for the rep?');
      if(fb === null) return;
      gradeIt(sc, 'NO_GO', fb || 'Run it back.');
    };
    actions.appendChild(nogo);
    card.appendChild(actions);
  }

  return card;
}

async function gradeIt(sc, result, feedback){
  try {
    await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks/${encodeURIComponent(sc.id)}/grade`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, result, feedback})
    });
    toast('Graded');
    load();
  } catch(e){ toast(e.message, true); }
}

async function loadView(){
  const root = $('list'); clear(root);
  root.appendChild(el('div', 'empty', 'Loading…'));
  // Clear any running timers
  for(const k of Object.keys(TIMERS)){ clearInterval(TIMERS[k]); delete TIMERS[k]; }
  try {
    let url;
    if(VIEW === 'incoming') url = `/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}&role=target`;
    else if(VIEW === 'sent') url = `/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}&role=checker`;
    else url = `/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}`;
    const r = await fetchJSON(url);
    let items = r.spotchecks || [];
    if(VIEW === 'incoming') items = items.filter(s => s.status === 'open');
    if(VIEW === 'history') items = items.filter(s => s.status === 'graded');
    clear(root);
    if(!items.length){
      const msg = VIEW === 'incoming' ? 'No drills waiting. Knock out a self-drill while it\'s quiet.'
                : VIEW === 'sent'     ? 'You haven\'t fired any drills yet. Spot-check a teammate from the Plays page.'
                :                       'No history yet.';
      root.appendChild(el('div', 'empty', msg));
    } else {
      for(const sc of items) root.appendChild(renderCard(sc));
    }
  } catch(e){
    clear(root); root.appendChild(el('div', 'empty', 'Failed: ' + e.message));
  }
}

async function loadCounts(){
  try {
    const all = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/spotchecks?rep=${encodeURIComponent(REP)}`);
    const xs = all.spotchecks || [];
    $('ct-incoming').textContent = xs.filter(s => s.target === REP && s.status === 'open').length;
    $('ct-sent').textContent     = xs.filter(s => s.checker === REP).length;
    $('ct-history').textContent  = xs.filter(s => s.status === 'graded').length;
  } catch(_){}
}

for(const btn of document.querySelectorAll('.tabs button[data-view]')){
  btn.onclick = () => {
    VIEW = btn.dataset.view;
    for(const x of document.querySelectorAll('.tabs button[data-view]')) x.classList.remove('active');
    btn.classList.add('active');
    loadView();
  };
}

(function(){
  function beat(){
    fetch(`/api/b/${encodeURIComponent(BULLPEN)}/presence/beat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, page: 'spotcheck', status: 'in the drill inbox'}),
    }).catch(()=>{});
  }
  beat(); setInterval(beat, 20000);
})();

let sse = null;
function connectSSE(){
  try {
    sse = new EventSource(`/api/b/${encodeURIComponent(BULLPEN)}/stream`);
    sse.onmessage = (msg) => {
      try {
        const e = JSON.parse(msg.data);
        if(['spotcheck_fired','spotcheck_responded'].includes(e.kind)){
          loadCounts();
          loadView();
        }
      } catch(_){}
    };
    sse.onerror = () => { try{sse.close()}catch(_){} setTimeout(connectSSE, 3000); };
  } catch(_){ setTimeout(connectSSE, 3000); }
}

loadView(); loadCounts(); connectSSE();
setInterval(loadCounts, 15000);
</script>

</body>
</html>
