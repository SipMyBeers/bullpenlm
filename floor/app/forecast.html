<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forecast · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100f0d">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=sentient@400,500,700&f%5B%5D=switzer@400,500,600,700&f%5B%5D=bespoke-serif@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/ink.css">
<script src="/app/cash.js"></script>
<style>
:root{--bg-0:#1b1916;--bg-1:#262219;--bg-2:#33301f;--text:#efe9dd;--muted:#a59c8c;--dim:#6b6357;
  --accent:#6fb38a;--accent-2:#8fcfae;--accent-dim:#2f5a45;--gold:#d8a13a;--danger:#e06a5a;
  --mono:"Switzer",-apple-system,sans-serif;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Sentient",Georgia,serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
.top{position:sticky;top:0;z-index:30;padding:14px 28px;display:flex;align-items:center;gap:20px;background:rgba(26,18,8,0.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(239,233,221,0.08)}
.brand{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}.crumb .sep{margin:0 8px;color:var(--dim)}.crumb .here{color:var(--accent)}
.scope-pick{margin-left:auto;display:inline-flex;border:1px solid rgba(239,233,221,0.10);border-radius:5px;overflow:hidden;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.scope-pick button{padding:7px 14px;background:transparent;color:var(--muted);border:none;cursor:pointer;font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit}
.scope-pick button.active{background:var(--accent);color:#100f0d;font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px}

.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:28px}
.tot-card{padding:24px 26px;background:rgba(26,18,8,0.55);border:1px solid rgba(239,233,221,0.08);border-radius:10px}
.tot-card .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tot-card .v{font-family:var(--display);font-size:42px;line-height:1.05;color:var(--accent-2);margin-top:8px;letter-spacing:-.01em}
.tot-card.gold .v{color:var(--gold)}
.tot-card.dim .v{color:var(--muted)}
.tot-card .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);margin-top:6px}

.section{margin-bottom:28px}
.section h3{font-family:var(--mono);font-size:11px;letter-spacing:.20em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}

.stage-rows{display:grid;grid-template-columns:1fr;gap:8px}
.stage-row{display:grid;grid-template-columns:200px 1fr auto auto;gap:14px;align-items:center;padding:13px 16px;background:rgba(26,18,8,0.55);border:1px solid rgba(239,233,221,0.08);border-radius:8px}
.stage-row .name{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.stage-row .name .dot{width:10px;height:10px;border-radius:50%}
.stage-row .name .prob{color:var(--muted);font-size:10px}
.stage-row .bar{height:10px;background:rgba(0,0,0,0.30);border-radius:6px;overflow:hidden}
.stage-row .bar-fill{height:100%;border-radius:6px;transition:width .5s ease-out}
.stage-row .gross{font-family:var(--mono);font-size:12px;color:var(--text);min-width:90px;text-align:right}
.stage-row .weighted{font-family:var(--mono);font-size:12px;color:var(--accent-2);min-width:90px;text-align:right;font-weight:600}

table.dl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;background:rgba(26,18,8,0.55);border:1px solid rgba(239,233,221,0.08);border-radius:8px;overflow:hidden}
table.dl th{text-align:left;padding:10px 14px;color:var(--muted);font-weight:500;letter-spacing:.10em;text-transform:uppercase;font-size:10px;background:rgba(0,0,0,0.20)}
table.dl td{padding:10px 14px;border-top:1px solid rgba(239,233,221,0.05);color:var(--text)}
table.dl td.amt{color:var(--gold);text-align:right;font-weight:600}
table.dl td.wt{color:var(--accent-2);text-align:right;font-weight:600}
table.dl td.pros{font-family:var(--serif);font-size:14px}
table.dl td .stage-chip{display:inline-block;padding:2px 8px;border-radius:3px;font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;background:rgba(239,233,221,0.06);color:var(--muted)}

.empty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:30px;letter-spacing:.08em}

/* Editable goal on the Won card */
.tot-card .goal-row{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim);margin-top:10px}
.tot-card .goal-row .goal-label{text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.tot-card .goal-row input{width:90px;padding:3px 6px;background:rgba(0,0,0,0.30);border:1px solid rgba(239,233,221,0.15);border-radius:4px;color:var(--gold);font-family:var(--mono);font-size:11px;font-weight:600}
.tot-card .goal-row input:focus{outline:none;border-color:var(--gold)}
.tot-card .goal-bar{height:8px;background:rgba(0,0,0,0.30);border-radius:5px;overflow:hidden;margin-top:10px}
.tot-card .goal-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s ease-out}
.tot-card .goal-bar-fill.hit{background:linear-gradient(90deg,var(--gold),#e9c885)}
.tot-card .goal-verdict{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;margin-top:8px}
.tot-card .goal-verdict.onpace{color:var(--accent-2)}
.tot-card .goal-verdict.behind{color:var(--danger)}
.tot-card .goal-verdict.hit{color:var(--gold)}

/* Stale-deal age badge in top-deals table */
.age-badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9.5px;letter-spacing:.08em;font-family:var(--mono);font-weight:600}
.age-badge.fresh{background:rgba(111,179,138,0.14);color:var(--accent-2)}
.age-badge.warm{background:rgba(216,161,58,0.14);color:var(--gold)}
.age-badge.stale{background:rgba(224,106,90,0.16);color:#ec9488}
</style>
</head>
<body>

<header class="top">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>
  <nav class="crumb">
    <a href="/">Floor</a><span class="sep">/</span>
    <span class="here">Forecast</span>
  </nav>
  <div class="scope-pick" id="scope">
    <button data-scope="me" class="active">My deals</button>
    <button data-scope="all">Bullpen-wide</button>
  </div>
</header>

<main class="wrap">
  <div id="content"><div class="empty">Loading…</div></div>
</main>

<script>
const params  = new URLSearchParams(location.search);
const BULLPEN = params.get('b')   || 'killsesh';
const REP     = params.get('rep') || localStorage.getItem('bullpen-rep') || 'beers';
let SCOPE = 'me';

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
async function fetchJSON(url){ const r=await fetch(url); if(!r.ok)throw new Error(r.statusText); return r.json(); }
function fmtMoney(n){ return (window.bpMoney ? window.bpMoney.fmt(n) : ('$' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}))); }
// Cash chip — green currency span; falls back to a text node if cash.js missing.
function cash(n){ return (window.bpMoney && window.bpMoney.cashChip) ? window.bpMoney.cashChip(n) : document.createTextNode(fmtMoney(n)); }

// ---- Monthly goal (localStorage) ----
function goalKey(){ return SCOPE==='all' ? `goal-${BULLPEN}-all` : `goal-${BULLPEN}-${REP}`; }
function getGoal(){ const v = Number(localStorage.getItem(goalKey())||0); return v>0 ? v : 0; }
function setGoal(v){ try{ localStorage.setItem(goalKey(), String(Math.max(0, Math.round(Number(v)||0)))); }catch(e){} }

// Pace verdict from day-of-month. Expected = goal * (daysElapsed / daysInMonth).
function paceVerdict(won, goal){
  if(!goal || goal<=0) return null;
  if(won >= goal) return {kind:'hit', label:'Goal hit'};
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const dayOfMonth = now.getDate();
  const expected = goal * (dayOfMonth / daysInMonth);
  if(won >= expected) return {kind:'onpace', label:'On pace'};
  return {kind:'behind', label:'Behind by ' + fmtMoney(expected - won)};
}

// Days the deal has sat in its current stage, from stage_history ({stage,by,at}).
function dealAgeDays(d){
  const hist = d.stage_history || [];
  let stamp = null;
  // Latest entry matching the current stage; fall back to most-recent entry.
  for(let i=hist.length-1; i>=0; i--){
    if(hist[i].stage === d.stage){ stamp = hist[i].at; break; }
  }
  if(!stamp && hist.length) stamp = hist[hist.length-1].at;
  if(!stamp) stamp = d.created_at || d.updated_at;
  if(!stamp) return null;
  const t = new Date(stamp).getTime();
  if(isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
// green <3d / amber 7-14 / red >14 (non-terminal stages)
function ageBadge(days){
  if(days==null) return null;
  let cls = 'warm';
  if(days < 3) cls = 'fresh';
  else if(days > 14) cls = 'stale';
  else if(days >= 7 && days <= 14) cls = 'warm';
  else cls = 'warm'; // 3-6d: neutral amber-leaning
  const span = el('span', 'age-badge ' + cls, days + 'd');
  return span;
}

async function render(){
  const root = document.getElementById('content'); clear(root);
  root.appendChild(el('div', 'empty', 'Loading forecast…'));
  try {
    const [pipeline, deals] = await Promise.all([
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/pipeline/default`),
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/deals`),
    ]);
    clear(root);

    const stages = pipeline.stages || [];
    const allDeals = (deals.deals || []).filter(d => SCOPE==='all' || d.owner_rep === REP);

    // Compute totals
    let pipelineGross = 0, pipelineWeighted = 0, wonAmount = 0, lostAmount = 0;
    const byStage = {};
    for(const s of stages){ byStage[s.id] = {stage:s, deals:[], gross:0, weighted:0}; }

    for(const d of allDeals){
      const s = stages.find(x => x.id === d.stage);
      if(!s) continue;
      const amt = Number(d.amount || 0);
      const wt  = amt * (s.probability || 0);
      byStage[s.id].deals.push(d);
      byStage[s.id].gross += amt;
      byStage[s.id].weighted += wt;
      if(s.id === 'won') wonAmount += amt;
      else if(s.id === 'lost') lostAmount += amt;
      else { pipelineGross += amt; pipelineWeighted += wt; }
    }

    // Totals cards
    const totals = el('div', 'totals');
    const card = (label, value, sub, kls) => {
      const c = el('div', 'tot-card ' + (kls||''));
      c.appendChild(el('div', 'label', label));
      const v = el('div', 'v');
      if(value && value.nodeType){ v.appendChild(value); } else { v.textContent = value; }
      c.appendChild(v);
      if(sub) c.appendChild(el('div', 'sub', sub));
      return c;
    };
    totals.appendChild(card('Pipeline (gross)', cash(pipelineGross),
      allDeals.filter(d => d.stage !== 'won' && d.stage !== 'lost').length + ' open deals', ''));
    totals.appendChild(card('Weighted forecast', cash(pipelineWeighted),
      'Stage-probability weighted', 'gold'));
    const wonCard = card('Won this period', cash(wonAmount),
      byStage.won?.deals.length + ' closed-won', '');
    // --- Editable monthly goal + progress bar + pace verdict ---
    const goal = getGoal();
    const goalRow = el('div', 'goal-row');
    goalRow.appendChild(el('span', 'goal-label', 'Goal'));
    const gInput = el('input');
    gInput.type = 'number'; gInput.min = '0'; gInput.step = '1000';
    gInput.placeholder = 'set goal';
    if(goal > 0) gInput.value = goal;
    gInput.onchange = () => { setGoal(gInput.value); render(); };
    gInput.onkeydown = (ev) => { if(ev.key === 'Enter') gInput.blur(); };
    goalRow.appendChild(gInput);
    wonCard.appendChild(goalRow);
    if(goal > 0){
      const pct = Math.max(0, Math.min(100, (wonAmount / goal) * 100));
      const gbar = el('div', 'goal-bar');
      const gfill = el('div', 'goal-bar-fill' + (wonAmount >= goal ? ' hit' : ''));
      gfill.style.width = pct + '%';
      gbar.appendChild(gfill);
      wonCard.appendChild(gbar);
      const v = paceVerdict(wonAmount, goal);
      if(v){
        const vEl = el('div', 'goal-verdict ' + v.kind,
          Math.round(pct) + '% of ' + fmtMoney(goal) + ' · ' + v.label);
        wonCard.appendChild(vEl);
      }
    }
    totals.appendChild(wonCard);
    totals.appendChild(card('Lost / disqualified', cash(lostAmount), '', 'dim'));
    root.appendChild(totals);

    // Stage rows
    const sec = el('div', 'section');
    const secH = el('h3'); secH.innerHTML = 'Pipeline by <span class="kw">stage</span>';
    sec.appendChild(secH);
    const list = el('div', 'stage-rows');
    const maxWeighted = Math.max(1, ...stages.map(s => byStage[s.id].weighted));
    for(const s of stages){
      if(s.id === 'lost' && byStage[s.id].deals.length === 0) continue;
      const row = el('div', 'stage-row');
      const name = el('div', 'name');
      const dot = el('span', 'dot'); dot.style.background = s.color || 'var(--accent)';
      name.appendChild(dot);
      name.appendChild(document.createTextNode(s.name));
      const prob = el('span', 'prob', Math.round((s.probability||0)*100) + '%');
      name.appendChild(prob);
      row.appendChild(name);

      const bar = el('div', 'bar');
      const fill = el('div', 'bar-fill');
      fill.style.background = s.color || 'var(--accent)';
      fill.style.width = (byStage[s.id].weighted / maxWeighted * 100) + '%';
      bar.appendChild(fill);
      row.appendChild(bar);

      const grossSpan = el('span', 'gross'); grossSpan.appendChild(cash(byStage[s.id].gross));
      row.appendChild(grossSpan);
      const wtSpan = el('span', 'weighted'); wtSpan.appendChild(cash(byStage[s.id].weighted));
      row.appendChild(wtSpan);
      list.appendChild(row);
    }
    sec.appendChild(list);
    root.appendChild(sec);

    // Top deals (weighted, non-terminal)
    const top = allDeals
      .filter(d => d.stage !== 'won' && d.stage !== 'lost')
      .map(d => {
        const s = stages.find(x => x.id === d.stage) || {};
        return {...d, _w: Number(d.amount||0) * (s.probability||0), _stage_name: s.name};
      })
      .sort((a,b) => b._w - a._w)
      .slice(0, 15);

    const top_sec = el('div', 'section');
    const topH = el('h3'); topH.innerHTML = 'Top open <span class="kw kw-mint">deals</span> (by weighted value)';
    top_sec.appendChild(topH);
    if(!top.length){
      top_sec.appendChild(el('div', 'empty', 'No open deals. Build the pipeline.'));
    } else {
      const tbl = el('table', 'dl');
      const thead = document.createElement('thead');
      const trh = document.createElement('tr');
      for(const h of (SCOPE==='all' ? ['Prospect','Owner','Stage','Age','Gross','Weighted'] : ['Prospect','Stage','Age','Gross','Weighted'])){
        trh.appendChild(el('th', null, h));
      }
      thead.appendChild(trh); tbl.appendChild(thead);
      const tb = document.createElement('tbody');
      for(const d of top){
        const tr = document.createElement('tr');
        tr.appendChild(el('td', 'pros', d.prospect_slug || d.prospect || '—'));
        if(SCOPE==='all'){ tr.appendChild(el('td', null, d.owner_rep || '—')); }
        const sc = el('td');
        sc.appendChild(el('span', 'stage-chip', d._stage_name || d.stage));
        tr.appendChild(sc);
        // Stale-deal age badge (non-terminal stages only — these are all open)
        const ageTd = el('td');
        const days = dealAgeDays(d);
        const badge = ageBadge(days);
        if(badge) ageTd.appendChild(badge); else ageTd.textContent = '—';
        tr.appendChild(ageTd);
        const amtTd = el('td', 'amt'); amtTd.appendChild(cash(d.amount)); tr.appendChild(amtTd);
        const wtTd = el('td', 'wt'); wtTd.appendChild(cash(d._w)); tr.appendChild(wtTd);
        tb.appendChild(tr);
      }
      tbl.appendChild(tb);
      top_sec.appendChild(tbl);
    }
    root.appendChild(top_sec);
  } catch(e){
    clear(root);
    root.appendChild(el('div', 'empty', 'Failed: ' + e.message));
  }
}

for(const b of document.querySelectorAll('#scope button')){
  b.onclick = () => {
    SCOPE = b.dataset.scope;
    for(const x of document.querySelectorAll('#scope button')) x.classList.remove('active');
    b.classList.add('active');
    render();
  };
}

render();
setInterval(render, 30000);
</script>


<script>
(function(){
  const PAGE = "forecast";
  const params  = new URLSearchParams(location.search);
  const BP = params.get('b') || 'killsesh';
  const RP = params.get('rep') || localStorage.getItem('bullpen-rep') || 'beers';
  function beat(){
    fetch('/api/b/' + encodeURIComponent(BP) + '/presence/beat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: RP, page: PAGE})
    }).catch(()=>{});
  }
  beat(); setInterval(beat, 20000);
})();
</script>
</body>
</html>
