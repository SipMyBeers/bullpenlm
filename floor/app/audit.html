<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audit Log · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=tanker@400&f%5B%5D=bespoke-serif@400,500,600,700&f%5B%5D=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#1a1208;--bg-1:#2a1d10;--bg-2:#3d2c1a;--text:#f5e8d8;--muted:#a89a87;--dim:#806a4f;
  --accent:#34d399;--accent-2:#6ee7b7;--accent-dim:#064e3b;--gold:#fbbf24;--danger:#f87171;--purple:#a78bfa;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Tanker",serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
.top{position:sticky;top:0;z-index:30;padding:14px 28px;display:flex;align-items:center;gap:20px;background:rgba(26,18,8,0.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(245,232,216,0.08)}
.brand{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}.crumb .sep{margin:0 8px;color:var(--dim)}.crumb .here{color:var(--accent)}
.controls{margin-left:auto;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px}
.controls select,.controls input{padding:6px 10px;background:rgba(0,0,0,0.30);border:1px solid rgba(245,232,216,0.15);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:11px}
.wrap{max-width:1300px;margin:0 auto;padding:24px 28px}

.chain-banner{padding:14px 22px;border-radius:10px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.05em}
.chain-banner.ok{background:rgba(52,211,153,0.10);border:1px solid rgba(52,211,153,0.30);color:var(--accent-2)}
.chain-banner.broken{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.45);color:#fda4a4;box-shadow:0 0 18px rgba(248,113,113,0.25)}
.chain-banner .v{font-family:var(--display);font-size:18px;letter-spacing:-.01em;text-transform:uppercase}
.chain-banner .meta{color:var(--muted);font-size:11px}

.events-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;background:rgba(26,18,8,0.55);border:1px solid rgba(245,232,216,0.08);border-radius:10px;overflow:hidden}
.events-table th{text-align:left;padding:11px 12px;color:var(--muted);font-weight:500;letter-spacing:.10em;text-transform:uppercase;font-size:10px;background:rgba(0,0,0,0.20);position:sticky;top:0;z-index:1}
.events-table td{padding:9px 12px;border-top:1px solid rgba(245,232,216,0.04);vertical-align:top}
.events-table td.ts{color:var(--dim);white-space:nowrap;font-size:10.5px}
.events-table td.actor{color:var(--accent);font-weight:600}
.events-table td.kind{font-size:10px;letter-spacing:.10em;text-transform:uppercase}
.events-table td.kind .chip{padding:3px 8px;border-radius:3px;background:rgba(245,232,216,0.06);color:var(--text);white-space:nowrap}
.events-table td.kind .chip.call{background:rgba(52,211,153,0.10);color:var(--accent-2)}
.events-table td.kind .chip.claim{background:rgba(251,191,36,0.10);color:var(--gold)}
.events-table td.kind .chip.deal_created,.events-table td.kind .chip.deal_stage_moved{background:rgba(52,211,153,0.10);color:var(--accent-2)}
.events-table td.kind .chip.deal_closed_won{background:var(--accent);color:#0a1a14;font-weight:700}
.events-table td.kind .chip.deal_closed_lost{background:rgba(248,113,113,0.15);color:#fda4a4}
.events-table td.kind .chip.achievement_unlocked{background:var(--purple);color:#0a0a1a;font-weight:700}
.events-table td.kind .chip.doc_signed{background:rgba(110,231,183,0.15);color:var(--accent-2)}
.events-table td.kind .chip.class_picked,.events-table td.kind .chip.bullpen_created{background:var(--gold);color:#0a1a14;font-weight:700}
.events-table td.kind .chip.quest_completed,.events-table td.kind .chip.raid_authored{background:rgba(167,139,250,0.20);color:#c4b5fd}
.events-table td.target{color:var(--text);font-family:var(--serif);font-size:13px}
.events-table td.payload{color:var(--muted);font-size:10.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.events-table td.hash{color:var(--dim);font-size:9.5px;letter-spacing:.05em}
.events-table tr.bad{background:rgba(248,113,113,0.10)}
.events-table tr:hover{background:rgba(245,232,216,0.03)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px}
.sum-card{padding:14px 18px;background:rgba(26,18,8,0.55);border:1px solid rgba(245,232,216,0.08);border-radius:8px}
.sum-card .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sum-card .v{font-family:var(--display);font-size:28px;color:var(--accent-2);margin-top:4px;line-height:1}
.sum-card.gold .v{color:var(--gold)}

.empty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:30px;letter-spacing:.08em}
</style>
</head>
<body>

<header class="top">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>
  <nav class="crumb">
    <a href="/">Floor</a><span class="sep">/</span>
    <span class="here">Audit Log</span>
  </nav>
  <div class="controls">
    <label>Show: <select id="limit">
      <option value="50">50</option><option value="100" selected>100</option>
      <option value="250">250</option><option value="1000">1000</option>
    </select></label>
    <label>Filter: <input id="filter" type="text" placeholder="kind, actor, target…" /></label>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <div id="summary"></div>
  <div id="table"></div>
</main>

<script>
const params  = new URLSearchParams(location.search);
const BULLPEN = params.get('b') || 'killsesh';

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
async function fetchJSON(url){ const r=await fetch(url); if(!r.ok)throw new Error(r.statusText); return r.json(); }

let ALL_EVENTS = [];
let CHAIN_OK = true;
let BROKEN_AT = null;

function fmtPayload(p){
  if(!p || typeof p !== 'object') return '';
  return Object.entries(p)
    .filter(([k]) => !['typed_name','description'].includes(k))
    .slice(0, 4)
    .map(([k,v]) => `${k}=${typeof v==='string' ? v.slice(0,40) : JSON.stringify(v)}`)
    .join(' · ');
}

function renderBanner(){
  const b = document.getElementById('banner'); clear(b);
  const card = el('div', 'chain-banner ' + (CHAIN_OK ? 'ok' : 'broken'));
  const left = el('div');
  left.appendChild(el('div', 'v', CHAIN_OK ? '✓ Hash chain verified' : '⚠ Tamper detected — chain broken'));
  left.appendChild(el('div', 'meta',
    CHAIN_OK
      ? 'Every event references the prior event\'s SHA-256. The full ledger is intact.'
      : 'Chain broken at event #' + BROKEN_AT + '. The audit log has been altered, truncated, or corrupted.'));
  card.appendChild(left);
  card.appendChild(el('div', 'meta', BULLPEN.toUpperCase()));
  b.appendChild(card);
}

function renderSummary(){
  const s = document.getElementById('summary'); clear(s);
  const wrap = el('div', 'summary');
  const counts = {};
  for(const e of ALL_EVENTS){ counts[e.kind] = (counts[e.kind]||0) + 1; }
  const actors = new Set(ALL_EVENTS.map(e=>e.actor).filter(Boolean));
  const card = (label, value, kls) => {
    const c = el('div', 'sum-card ' + (kls||'')); c.appendChild(el('div','l',label)); c.appendChild(el('div','v',value)); return c;
  };
  wrap.appendChild(card('Total events', String(ALL_EVENTS.length), 'gold'));
  wrap.appendChild(card('Distinct actors', String(actors.size)));
  wrap.appendChild(card('Closes',    String(counts.deal_closed_won || 0), 'gold'));
  wrap.appendChild(card('Unlocks',   String(counts.achievement_unlocked || 0)));
  wrap.appendChild(card('Signatures',String(counts.doc_signed || 0)));
  s.appendChild(wrap);
}

function renderTable(filter){
  const root = document.getElementById('table'); clear(root);
  const fl = (filter || '').toLowerCase().trim();
  const filtered = ALL_EVENTS.filter(e =>
    !fl || (e.kind+'\t'+(e.actor||'')+'\t'+(e.target_id||'')+'\t'+JSON.stringify(e.payload||{})).toLowerCase().includes(fl)
  );
  if(!filtered.length){
    root.appendChild(el('div', 'empty', 'No events match.'));
    return;
  }
  const tbl = el('table', 'events-table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  for(const h of ['Time','Actor','Event','Target','Payload','Hash']){
    trh.appendChild(el('th', null, h));
  }
  thead.appendChild(trh); tbl.appendChild(thead);
  const tb = document.createElement('tbody');
  for(const e of filtered.slice().reverse()){
    const tr = document.createElement('tr');
    if(!CHAIN_OK && BROKEN_AT != null && e === ALL_EVENTS[BROKEN_AT]) tr.className = 'bad';
    tr.appendChild(el('td', 'ts', (e.ts||'').replace('T',' ').slice(0,19)));
    tr.appendChild(el('td', 'actor', e.actor || 'system'));
    const k = el('td', 'kind');
    k.appendChild(el('span', 'chip ' + (e.kind||''), e.kind || '?'));
    tr.appendChild(k);
    tr.appendChild(el('td', 'target', e.target_id || ''));
    tr.appendChild(el('td', 'payload', fmtPayload(e.payload)));
    tr.appendChild(el('td', 'hash', (e.hash||'').slice(0,10)));
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  root.appendChild(tbl);
}

async function load(){
  const limit = document.getElementById('limit').value;
  try {
    const d = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/audit?limit=${limit}`);
    ALL_EVENTS = d.events || [];
    CHAIN_OK = d.chain_ok !== false;
    BROKEN_AT = d.broken_at;
    renderBanner();
    renderSummary();
    renderTable(document.getElementById('filter').value);
  } catch(e){
    document.getElementById('table').textContent = 'Failed: ' + e.message;
  }
}

document.getElementById('limit').onchange = load;
document.getElementById('filter').oninput = () => renderTable(document.getElementById('filter').value);

load();
setInterval(load, 20000);
</script>

</body>
</html>
