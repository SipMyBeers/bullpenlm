<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deal · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=tanker@400&f%5B%5D=bespoke-serif@400,500,600,700&f%5B%5D=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#1a1208;--bg-1:#2a1d10;--bg-2:#3d2c1a;--text:#f5e8d8;--muted:#a89a87;--dim:#806a4f;
  --accent:#34d399;--accent-2:#6ee7b7;--accent-dim:#064e3b;--gold:#fbbf24;--danger:#f87171;--purple:#a78bfa;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Tanker",serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
.top{position:sticky;top:0;z-index:30;padding:14px 28px;display:flex;align-items:center;gap:20px;background:rgba(26,18,8,0.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(245,232,216,0.08)}
.brand{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}.crumb .sep{margin:0 8px;color:var(--dim)}.crumb .here{color:var(--accent)}

.wrap{max-width:1280px;margin:0 auto;padding:24px 28px;display:grid;grid-template-columns:1fr 340px;gap:24px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}

.header{padding:24px 28px;background:linear-gradient(135deg,rgba(52,211,153,0.06),rgba(42,29,16,0.55));border:1px solid rgba(245,232,216,0.08);border-radius:12px;margin-bottom:18px}
.header .title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.header h1{font-family:var(--display);font-size:42px;color:var(--text);margin:0;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
.header .amt{font-family:var(--display);font-size:32px;color:var(--gold);line-height:1}
.header .row{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted)}
.header .row .k{color:var(--gold)}
.header .row .stage{padding:4px 11px;border-radius:999px;background:rgba(52,211,153,0.15);color:var(--accent-2);font-weight:600}

.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions button{padding:9px 14px;background:rgba(52,211,153,0.10);color:var(--accent-2);border:1px solid rgba(52,211,153,0.30);border-radius:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer;transition:background .12s}
.actions button:hover{background:rgba(52,211,153,0.20)}
.actions button.gold{background:rgba(251,191,36,0.10);color:var(--gold);border-color:rgba(251,191,36,0.30)}
.actions button.gold:hover{background:rgba(251,191,36,0.20)}
.actions button.purple{background:rgba(167,139,250,0.10);color:#c4b5fd;border-color:rgba(167,139,250,0.30)}
.actions button.purple:hover{background:rgba(167,139,250,0.20)}
.actions button.danger{background:rgba(248,113,113,0.10);color:var(--danger);border-color:rgba(248,113,113,0.30)}
.actions button.danger:hover{background:rgba(248,113,113,0.20)}

.section{background:rgba(26,18,8,0.55);border:1px solid rgba(245,232,216,0.08);border-radius:12px;padding:22px;margin-bottom:18px}
.section h2{font-family:var(--mono);font-size:11px;letter-spacing:.20em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(245,232,216,0.08)}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.tl .ev{display:grid;grid-template-columns:42px 1fr auto;gap:12px;padding:11px 12px;background:rgba(42,29,16,0.55);border:1px solid rgba(245,232,216,0.06);border-radius:8px}
.tl .ev .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.04em;color:var(--accent-2);background:rgba(52,211,153,0.10);border:1px solid rgba(52,211,153,0.20)}
.tl .ev.email .ico{background:rgba(110,231,183,0.12);border-color:rgba(110,231,183,0.25)}
.tl .ev.meeting .ico{background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.30);color:var(--gold)}
.tl .ev.note .ico{background:rgba(167,139,250,0.10);border-color:rgba(167,139,250,0.25);color:#c4b5fd}
.tl .ev.sms .ico{background:rgba(34,211,238,0.10);border-color:rgba(34,211,238,0.25);color:#67e8f9}
.tl .ev .body{font-family:var(--serif);font-size:14px;color:var(--text)}
.tl .ev .body .summary{font-weight:500;line-height:1.4}
.tl .ev .body .notes{font-style:italic;color:var(--muted);margin-top:4px;font-size:13px;white-space:pre-wrap}
.tl .ev .meta{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.tl .ev .meta .o{padding:2px 7px;border-radius:3px;background:rgba(245,232,216,0.06);margin-right:6px}
.tl .ev .meta .o.booked{background:var(--accent);color:#0a1a14;font-weight:700}
.tl .ev .meta .o.voicemail{background:rgba(251,191,36,0.18);color:var(--gold)}
.tl .ev .meta .o.no_answer,.tl .ev .meta .o.gatekeeper{background:rgba(168,154,135,0.10);color:var(--muted)}
.tl .ev .meta .o.not_interested,.tl .ev .meta .o.bad_number{background:rgba(248,113,113,0.15);color:var(--danger)}
.tl .ev .ts{font-family:var(--mono);font-size:10px;color:var(--dim);align-self:start;text-align:right;min-width:80px}

/* Contacts */
.contacts a{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:9px 11px;background:rgba(42,29,16,0.55);border:1px solid rgba(245,232,216,0.06);border-radius:8px;margin-bottom:6px;text-decoration:none;color:inherit;transition:border-color .12s}
.contacts a:hover{border-color:var(--accent-dim)}
.contacts .av{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent-2),var(--accent-dim));display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#0a1a14;letter-spacing:-.02em}
.contacts .info .name{font-family:var(--serif);font-size:14px;font-weight:600}
.contacts .info .role{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.05em;margin-top:2px}

/* Follow-up tile */
.fu-tile{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.25);border-radius:8px;margin-bottom:6px}
.fu-tile.overdue{background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.30)}
.fu-tile .t{font-family:var(--serif);font-size:14px;font-weight:500}
.fu-tile .meta{font-family:var(--mono);font-size:10px;color:var(--gold);margin-top:2px;letter-spacing:.05em}
.fu-tile.overdue .meta{color:var(--danger)}
.fu-tile button{padding:5px 10px;background:var(--accent);color:#0a1a14;border:none;border-radius:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;cursor:pointer;font-weight:700;align-self:center}

/* Stage history */
.sh{display:flex;flex-direction:column;gap:4px}
.sh .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:6px 10px;background:rgba(42,29,16,0.40);border-radius:5px;font-family:var(--mono);font-size:10.5px}
.sh .row .stage{color:var(--accent-2);text-transform:uppercase;letter-spacing:.06em}
.sh .row .by{color:var(--muted)}
.sh .row .at{color:var(--dim)}

.empty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:14px;letter-spacing:.06em}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:none;align-items:center;justify-content:center;z-index:100}
.modal.open{display:flex}
.modal-card{background:var(--bg-1);border:1px solid rgba(245,232,216,0.20);border-radius:12px;padding:26px;max-width:560px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.7)}
.modal-card h2{font-family:var(--display);font-size:26px;color:var(--accent-2);margin:0 0 14px;text-transform:uppercase;letter-spacing:-.01em}
.modal-card label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.modal-card input,.modal-card select,.modal-card textarea{width:100%;padding:10px 12px;background:rgba(0,0,0,0.30);border:1px solid rgba(245,232,216,0.15);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px}
.modal-card textarea{font-family:var(--serif);font-size:14px;min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.modal-actions button{padding:10px 20px;border-radius:5px;border:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
.modal-actions .cancel{background:transparent;color:var(--muted);border:1px solid rgba(245,232,216,0.15)}
.modal-actions .confirm{background:var(--accent);color:#0a1a14}

.toast{position:fixed;bottom:24px;right:24px;padding:14px 18px;background:rgba(52,211,153,0.95);color:#0a1a14;border-radius:8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;box-shadow:0 4px 20px rgba(0,0,0,0.40);transform:translateY(100px);opacity:0;transition:all .25s;z-index:50}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:rgba(248,113,113,0.95)}
</style>
<script src="/app/gate-banner.js" defer></script>
<script src="/app/dnc-check.js" defer></script>
<script src="/app/embed-mode.js"></script>
<script src="/app/challenge-notif.js" defer></script>
<script src="/app/sfx.js" defer></script>
<script src="/app/loss-modal.js" defer></script>
</head>
<body>

<header class="top">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>
  <nav class="crumb">
    <a href="/">Floor</a><span class="sep">/</span>
    <a href="/app/deals.html" id="kanban-back">Deals</a><span class="sep">/</span>
    <span class="here" id="deal-title">Loading…</span>
  </nav>
</header>

<main class="wrap">
  <section>
    <div class="header" id="header"><div class="empty">Loading…</div></div>

    <div class="section">
      <h2>Activity timeline</h2>
      <div class="tl" id="timeline"><div class="empty">No activity yet</div></div>
    </div>

    <div class="section">
      <h2>Stage history</h2>
      <div class="sh" id="stage-hist"><div class="empty">No moves yet</div></div>
    </div>
  </section>

  <aside>
    <div class="section">
      <h2>Open follow-ups <span id="fu-ct" style="color:var(--gold);font-family:var(--display);font-size:18px"></span></h2>
      <div id="fu-list"><div class="empty">No follow-ups</div></div>
      <button id="add-fu" style="margin-top:8px;width:100%;padding:9px;background:rgba(251,191,36,0.10);color:var(--gold);border:1px dashed rgba(251,191,36,0.30);border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer">+ Schedule a follow-up</button>
    </div>

    <div class="section">
      <h2>Contacts on this account</h2>
      <div class="contacts" id="contacts"><div class="empty">No contacts</div></div>
      <button id="add-contact" style="margin-top:8px;width:100%;padding:9px;background:rgba(52,211,153,0.10);color:var(--accent-2);border:1px dashed rgba(52,211,153,0.30);border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer">+ Add contact</button>
    </div>
  </aside>
</main>

<div class="modal" id="modal">
  <div class="modal-card" id="modal-card"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const params  = new URLSearchParams(location.search);
const BULLPENS_PARAM = params.get('b') || 'killsesh';
const BULLPEN = BULLPENS_PARAM;
const REP     = params.get('rep') || localStorage.getItem('bullpen-rep') || 'beers';
const DEAL_ID = params.get('id') || '';

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast'+(err?' error':''),2400); }
async function fetchJSON(url, opts){
  const r = await fetch(url, opts||{});
  if(!r.ok){ let m=r.statusText; try{m=(await r.json()).error||m;}catch(_){} throw new Error(m); }
  return r.json();
}
function $(id){ return document.getElementById(id); }
function fmtMoney(n){ return '$' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function initials(s){ return (s||'?').slice(0,2).toUpperCase(); }

let DEAL = null;
let CONTACTS = [];

function ICON(kind){
  return {call:'CALL', email:'MAIL', meeting:'MEET', note:'NOTE', sms:'SMS'}[kind] || '•';
}

function paintHeader(){
  const h = $('header'); clear(h);
  const title = el('div', 'title');
  title.appendChild(el('h1', null, (DEAL.prospect_slug || DEAL.id).toUpperCase()));
  title.appendChild(el('div', 'amt', fmtMoney(DEAL.amount)));
  h.appendChild(title);

  const row = el('div', 'row');
  const stage = el('span', 'stage', DEAL.stage);
  row.appendChild(stage);
  row.appendChild(document.createTextNode('Owner '));
  row.appendChild(el('span', 'k', DEAL.owner_rep || '—'));
  row.appendChild(document.createTextNode('  ·  Opened '));
  row.appendChild(el('span', 'k', (DEAL.opened_at||'').slice(0,10)));
  if(DEAL.closed_at){
    row.appendChild(document.createTextNode('  ·  Closed '));
    row.appendChild(el('span', 'k', DEAL.closed_at.slice(0,10)));
  }
  h.appendChild(row);

  const actions = el('div', 'actions');
  const logCall = el('button', null, 'Log call');
  logCall.onclick = () => openLogModal('call');
  actions.appendChild(logCall);

  const logEmail = el('button', null, 'Log email');
  logEmail.onclick = () => openLogModal('email');
  actions.appendChild(logEmail);

  const logMeet = el('button', 'gold', 'Log meeting');
  logMeet.onclick = () => openLogModal('meeting');
  actions.appendChild(logMeet);

  const note = el('button', 'purple', 'Add note');
  note.onclick = () => openLogModal('note');
  actions.appendChild(note);

  // Close actions — only show while the deal isn't already in a terminal stage
  const terminal = (DEAL.stage === 'won' || DEAL.stage === 'lost');
  if(!terminal){
    const closeWon = el('button', 'gold', 'Close WON');
    closeWon.onclick = () => closeDealWon();
    actions.appendChild(closeWon);

    const markLost = el('button', 'danger', '✕ Mark lost');
    markLost.onclick = () => openLossModal();
    actions.appendChild(markLost);
  }

  h.appendChild(actions);
}

// ── Close WON ──
async function closeDealWon(){
  try {
    await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/deals/${encodeURIComponent(DEAL.id)}/stage`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({stage:'won', rep: REP}),
    });
    try{ window.bpSfx && window.bpSfx.bell && window.bpSfx.bell(); }catch(_){}
    toast('Closed WON — ' + fmtMoney(DEAL.amount));
    setTimeout(() => location.reload(), 600);
  } catch(e){ toast(e.message, true); }
}

// ── Mark lost (reason picker → note → stage) ──
function openLossModal(){
  if(!window.bpLossModal){ toast('Loss modal not loaded', true); return; }
  window.bpLossModal.open(async ({reason, note}) => {
    try {
      const summary = 'Lost: ' + reason + (note ? ' — ' + note : '');
      await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/activity`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          rep: REP, kind: 'note',
          target_type: 'deal', target_id: DEAL.id,
          summary,
          notes: note || '',
          deal_id: DEAL.id,
          org_slug: DEAL.prospect_slug,
        }),
      });
      await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/deals/${encodeURIComponent(DEAL.id)}/stage`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({stage:'lost', rep: REP}),
      });
      toast('Marked lost — ' + reason);
      setTimeout(() => location.reload(), 600);
    } catch(e){ toast(e.message, true); }
  });
}

function paintTimeline(events){
  const t = $('timeline'); clear(t);
  if(!events.length){
    t.appendChild(el('div', 'empty', 'No activity yet — log your first call above'));
    return;
  }
  for(const e of events){
    const row = el('div', 'ev ' + e.kind);
    row.appendChild(el('div', 'ico', ICON(e.kind)));
    const body = el('div', 'body');
    body.appendChild(el('div', 'summary', e.summary || '(' + e.kind + ')'));
    if(e.notes) body.appendChild(el('div', 'notes', e.notes));
    const meta = el('div', 'meta');
    if(e.outcome) meta.appendChild(el('span', 'o ' + e.outcome, e.outcome));
    meta.appendChild(document.createTextNode((e.actor || 'self') + (e.direction ? ' · ' + e.direction : '')));
    if(e.duration_sec) meta.appendChild(document.createTextNode(' · ' + e.duration_sec + 's'));
    if(e.contact_slug) meta.appendChild(document.createTextNode(' · ' + e.contact_slug));
    body.appendChild(meta);
    row.appendChild(body);
    row.appendChild(el('div', 'ts', (e.ts||'').replace('T', ' ').slice(0,16)));
    t.appendChild(row);
  }
}

function paintStageHistory(){
  const h = $('stage-hist'); clear(h);
  const hist = DEAL.stage_history || [];
  if(!hist.length){
    h.appendChild(el('div', 'empty', 'No moves yet')); return;
  }
  for(const s of hist.slice().reverse()){
    const r = el('div', 'row');
    r.appendChild(el('span', 'stage', s.stage));
    r.appendChild(el('span', 'by', s.by));
    r.appendChild(el('span', 'at', (s.at||'').replace('T',' ').slice(0,16)));
    h.appendChild(r);
  }
}

function paintContacts(){
  const list = $('contacts'); clear(list);
  if(!CONTACTS.length){
    list.appendChild(el('div', 'empty', 'No contacts on this account yet'));
    return;
  }
  for(const c of CONTACTS){
    const a = document.createElement('a');
    a.href = `/app/contact.html?b=${encodeURIComponent(BULLPEN)}&rep=${encodeURIComponent(REP)}&org=${encodeURIComponent(c.org_slug)}&slug=${encodeURIComponent(c.slug)}`;
    const av = el('div', 'av', initials(c.personName));
    a.appendChild(av);
    const info = el('div', 'info');
    info.appendChild(el('div', 'name', c.personName));
    info.appendChild(el('div', 'role', c.role || c.relationship || 'contact'));
    a.appendChild(info);
    list.appendChild(a);
  }
}

function paintFollowups(fus){
  const list = $('fu-list'); clear(list);
  $('fu-ct').textContent = fus.length ? String(fus.length) : '';
  if(!fus.length){
    list.appendChild(el('div', 'empty', 'None')); return;
  }
  const now = new Date();
  for(const f of fus){
    const overdue = new Date(f.due_at) < now;
    const t = el('div', 'fu-tile' + (overdue ? ' overdue' : ''));
    const left = el('div');
    left.appendChild(el('div', 't', f.title));
    left.appendChild(el('div', 'meta', (f.due_at||'').replace('T',' ').slice(0,16) + ' · ' + (f.owner_rep || '?')));
    t.appendChild(left);
    const dn = el('button', null, '✓ Done');
    dn.onclick = async () => {
      try {
        await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/followups/${encodeURIComponent(f.owner_rep)}/${encodeURIComponent(f.id)}/complete`, {method:'POST'});
        toast('+8 XP'); load();
      } catch(e){ toast(e.message, true); }
    };
    t.appendChild(dn);
    list.appendChild(t);
  }
}

// ── Log activity modal ──
function openLogModal(kind){
  const c = $('modal-card'); clear(c);
  c.appendChild(el('h2', null,
    kind === 'call' ? 'Log call' :
    kind === 'email' ? 'Log email' :
    kind === 'meeting' ? 'Log meeting' :
    'Add note'));

  c.appendChild(el('label', null, 'Summary (one line)'));
  const sum = document.createElement('input'); sum.id='log-summary';
  sum.placeholder = kind === 'call' ? 'Hit gatekeeper, left voicemail mentioning audit-trail' :
                    kind === 'email' ? 'Sent v1 of the audit-trail one-pager' :
                    kind === 'meeting' ? 'Demo with Marcus + 2 engineers, walked the kanban' :
                    'Marcus is back from sabbatical next month';
  c.appendChild(sum);

  c.appendChild(el('label', null, 'Notes (markdown, optional)'));
  const notes = document.createElement('textarea'); notes.id='log-notes';
  c.appendChild(notes);

  if(kind === 'call'){
    c.appendChild(el('label', null, 'Outcome'));
    const sel = document.createElement('select'); sel.id='log-outcome';
    for(const o of ['booked','voicemail','no_answer','gatekeeper','not_interested','bad_number','callback','other']){
      const op = el('option', null, o.replace(/_/g,' ')); op.value = o; sel.appendChild(op);
    }
    c.appendChild(sel);

    c.appendChild(el('label', null, 'Duration (seconds)'));
    const dur = document.createElement('input'); dur.id='log-dur'; dur.type='number'; dur.placeholder='e.g. 180';
    c.appendChild(dur);
  }

  if(CONTACTS.length){
    c.appendChild(el('label', null, 'Contact (optional)'));
    const csel = document.createElement('select'); csel.id='log-contact';
    csel.appendChild(el('option', null, '— none —'));
    for(const co of CONTACTS){
      const op = el('option', null, co.personName + (co.role ? ' — ' + co.role : ''));
      op.value = co.slug; csel.appendChild(op);
    }
    c.appendChild(csel);
  }

  const actions = el('div', 'modal-actions');
  const cancel = el('button', 'cancel', 'Cancel');
  cancel.onclick = () => $('modal').classList.remove('open');
  actions.appendChild(cancel);
  const ok = el('button', 'confirm', 'Log it');
  ok.onclick = async () => {
    try {
      const body = {
        rep: REP, kind,
        target_type: 'deal', target_id: DEAL.id,
        summary: $('log-summary').value,
        notes: $('log-notes').value,
        deal_id: DEAL.id,
        org_slug: DEAL.prospect_slug,
      };
      if(kind === 'call'){
        body.outcome = $('log-outcome').value;
        const d = parseInt($('log-dur').value || '0', 10);
        if(d) body.duration_sec = d;
      }
      const cs = $('log-contact');
      if(cs && cs.value !== '— none —') body.contact_slug = cs.value;
      await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/activity`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
      $('modal').classList.remove('open');
      toast('Logged');
      load();
    } catch(e){ toast(e.message, true); }
  };
  actions.appendChild(ok);
  c.appendChild(actions);

  $('modal').classList.add('open');
  setTimeout(() => sum.focus(), 50);
}

// ── Follow-up modal ──
$('add-fu').onclick = () => {
  const c = $('modal-card'); clear(c);
  c.appendChild(el('h2', null, 'Schedule a follow-up'));
  c.appendChild(el('label', null, 'What do you need to do?'));
  const t = document.createElement('input'); t.id = 'fu-title';
  t.placeholder = "e.g. 'Call Marcus back at 2'";
  c.appendChild(t);
  c.appendChild(el('label', null, 'When?'));
  const due = document.createElement('select'); due.id = 'fu-due';
  for(const [v, l] of [['+1h','In 1 hour'],['+4h','In 4 hours'],['today','Today end of day'],['tomorrow','Tomorrow 9am'],['+3d','In 3 days'],['+7d','In 7 days']]){
    const op = el('option', null, l); op.value = v;
    if(v === 'tomorrow') op.selected = true;
    due.appendChild(op);
  }
  c.appendChild(due);
  const actions = el('div', 'modal-actions');
  const cancel = el('button', 'cancel', 'Cancel');
  cancel.onclick = () => $('modal').classList.remove('open');
  actions.appendChild(cancel);
  const ok = el('button', 'confirm', 'Schedule');
  ok.onclick = async () => {
    try {
      await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/followups`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rep: REP, title: t.value, due_at: due.value,
                              target_type: 'deal', target_id: DEAL.id})
      });
      $('modal').classList.remove('open');
      toast('Scheduled');
      load();
    } catch(e){ toast(e.message, true); }
  };
  actions.appendChild(ok);
  c.appendChild(actions);
  $('modal').classList.add('open');
  setTimeout(() => t.focus(), 50);
};

// ── Contact modal ──
$('add-contact').onclick = () => {
  const c = $('modal-card'); clear(c);
  c.appendChild(el('h2', null, 'Add a contact'));
  const fields = [
    ['c-name', 'Name', 'text', 'e.g. Marcus Chen'],
    ['c-role', 'Role', 'text', 'e.g. MD Mainframe Modernization'],
    ['c-email','Email','email','marcus.chen@accenture.com'],
    ['c-phone','Phone','tel','212-555-0100'],
    ['c-li',   'LinkedIn','text','linkedin.com/in/...'],
  ];
  for(const [id, lbl, type, ph] of fields){
    c.appendChild(el('label', null, lbl));
    const inp = document.createElement('input'); inp.id = id; inp.type = type; inp.placeholder = ph;
    c.appendChild(inp);
  }
  const actions = el('div', 'modal-actions');
  const cancel = el('button', 'cancel', 'Cancel');
  cancel.onclick = () => $('modal').classList.remove('open');
  actions.appendChild(cancel);
  const ok = el('button', 'confirm', 'Add');
  ok.onclick = async () => {
    try {
      await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/orgs/${encodeURIComponent(DEAL.prospect_slug)}/contacts`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          rep: REP,
          person_name: $('c-name').value,
          role: $('c-role').value,
          email: $('c-email').value,
          phone: $('c-phone').value,
          linkedin: $('c-li').value,
        })
      });
      $('modal').classList.remove('open');
      toast('+10 XP — contact added');
      load();
    } catch(e){ toast(e.message, true); }
  };
  actions.appendChild(ok);
  c.appendChild(actions);
  $('modal').classList.add('open');
  setTimeout(() => $('c-name').focus(), 50);
};

$('modal').onclick = (e) => { if(e.target.id === 'modal') $('modal').classList.remove('open'); };

async function load(){
  try {
    DEAL = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/deals/${encodeURIComponent(DEAL_ID)}`);
    document.title = (DEAL.prospect_slug || DEAL.id) + ' · BullpenLM';
    $('deal-title').textContent = DEAL.prospect_slug || DEAL.id;
    $('kanban-back').href = `/app/deals.html?b=${encodeURIComponent(BULLPEN)}`;
    paintHeader();
    paintStageHistory();

    const [tl, contacts, fus] = await Promise.all([
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/timeline/deal/${encodeURIComponent(DEAL_ID)}`),
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/orgs/${encodeURIComponent(DEAL.prospect_slug)}/contacts`),
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/followups-for/deal/${encodeURIComponent(DEAL_ID)}`),
    ]);
    paintTimeline(tl.activity || []);
    CONTACTS = contacts.contacts || [];
    paintContacts();
    paintFollowups(fus.followups || []);
  } catch(e){
    toast('Failed: ' + e.message, true);
  }
}

// Heartbeat
(function(){
  function beat(){
    fetch(`/api/b/${encodeURIComponent(BULLPEN)}/presence/beat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, page: 'deal', status: 'working ' + DEAL_ID}),
    }).catch(()=>{});
  }
  beat(); setInterval(beat, 20000);
})();

// SSE-driven refresh on relevant events
let sse = null;
function connectSSE(){
  try {
    sse = new EventSource(`/api/b/${encodeURIComponent(BULLPEN)}/stream`);
    sse.onmessage = (msg) => {
      try {
        const e = JSON.parse(msg.data);
        if((e.target_id === DEAL_ID) || ((e.payload||{}).deal_id === DEAL_ID)) load();
      } catch(_){}
    };
    sse.onerror = () => { try{sse.close()}catch(_){} setTimeout(connectSSE, 3000); };
  } catch(_){ setTimeout(connectSSE, 3000); }
}

if(!DEAL_ID){
  $('deal-title').textContent = 'No deal id';
  toast('Missing deal id — open this from the kanban', true);
} else {
  load();
  connectSSE();
}
</script>
