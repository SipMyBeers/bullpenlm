<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=tanker@400&f%5B%5D=bespoke-serif@400,500,600,700&f%5B%5D=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#1a1208;--bg-1:#2a1d10;--bg-2:#3d2c1a;--text:#f5e8d8;--muted:#a89a87;--dim:#806a4f;
  --accent:#34d399;--accent-2:#6ee7b7;--accent-dim:#064e3b;--gold:#fbbf24;--danger:#f87171;--purple:#a78bfa;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Tanker",serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
.top{position:sticky;top:0;z-index:30;padding:14px 28px;display:flex;align-items:center;gap:20px;background:rgba(26,18,8,0.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(245,232,216,0.08)}
.brand{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}.crumb .sep{margin:0 8px;color:var(--dim)}.crumb .here{color:var(--accent)}

.wrap{max-width:1100px;margin:0 auto;padding:24px 28px;display:grid;grid-template-columns:340px 1fr;gap:24px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}

.pcard{padding:24px 26px;background:linear-gradient(135deg,rgba(110,231,183,0.06),rgba(42,29,16,0.55));border:1px solid rgba(245,232,216,0.10);border-radius:12px}
.pcard .av{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent-2),var(--accent-dim));display:grid;place-items:center;font-family:var(--display);font-size:36px;color:#0a1a14;letter-spacing:-.02em;margin-bottom:14px}
.pcard h1{font-family:var(--display);font-size:30px;color:var(--text);text-transform:uppercase;letter-spacing:-.01em;margin:0 0 4px;line-height:1.05}
.pcard .role{font-family:var(--mono);font-size:11px;color:var(--accent-2);letter-spacing:.05em;margin-bottom:14px}
.pcard .field{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;border-top:1px solid rgba(245,232,216,0.06);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.pcard .field .l{color:var(--muted);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;align-self:center}
.pcard .field .v{color:var(--text);word-break:break-all}
.pcard .field a{color:var(--accent-2);text-decoration:none}
.pcard .field a:hover{color:var(--accent)}
.pcard .bio{font-family:var(--serif);font-size:13.5px;color:var(--muted);font-style:italic;margin-top:14px;padding-top:14px;border-top:1px solid rgba(245,232,216,0.08);line-height:1.55}

.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.actions button{padding:8px 12px;background:rgba(52,211,153,0.10);color:var(--accent-2);border:1px solid rgba(52,211,153,0.30);border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer}
.actions button:hover{background:rgba(52,211,153,0.20)}
.actions button.gold{background:rgba(251,191,36,0.10);color:var(--gold);border-color:rgba(251,191,36,0.30)}

.section{background:rgba(26,18,8,0.55);border:1px solid rgba(245,232,216,0.08);border-radius:12px;padding:22px;margin-bottom:16px}
.section h2{font-family:var(--mono);font-size:11px;letter-spacing:.20em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(245,232,216,0.08)}

/* Timeline (reuse styles inline) */
.tl{display:flex;flex-direction:column;gap:10px}
.tl .ev{display:grid;grid-template-columns:42px 1fr auto;gap:12px;padding:11px 12px;background:rgba(42,29,16,0.55);border:1px solid rgba(245,232,216,0.06);border-radius:8px}
.tl .ev .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(52,211,153,0.10);border:1px solid rgba(52,211,153,0.20)}
.tl .ev.email .ico{background:rgba(110,231,183,0.12);border-color:rgba(110,231,183,0.25)}
.tl .ev.meeting .ico{background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.30);color:var(--gold)}
.tl .ev.note .ico{background:rgba(167,139,250,0.10);border-color:rgba(167,139,250,0.25);color:#c4b5fd}
.tl .ev .summary{font-family:var(--serif);font-size:14px;color:var(--text);font-weight:500;line-height:1.4}
.tl .ev .notes{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:4px;font-size:13px;white-space:pre-wrap}
.tl .ev .meta{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.tl .ev .ts{font-family:var(--mono);font-size:10px;color:var(--dim);align-self:start;text-align:right;min-width:80px}
.tl .ev .o{padding:2px 7px;border-radius:3px;background:rgba(245,232,216,0.06);margin-right:6px}
.tl .ev .o.booked{background:var(--accent);color:#0a1a14;font-weight:700}
.tl .ev .o.voicemail{background:rgba(251,191,36,0.18);color:var(--gold)}

.fu-tile{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.25);border-radius:8px;margin-bottom:6px}
.fu-tile.overdue{background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.30)}
.fu-tile .t{font-family:var(--serif);font-size:14px;font-weight:500}
.fu-tile .meta{font-family:var(--mono);font-size:10px;color:var(--gold);margin-top:2px;letter-spacing:.05em}

.empty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:14px;letter-spacing:.06em}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:none;align-items:center;justify-content:center;z-index:100}
.modal.open{display:flex}
.modal-card{background:var(--bg-1);border:1px solid rgba(245,232,216,0.20);border-radius:12px;padding:26px;max-width:560px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.7)}
.modal-card h2{font-family:var(--display);font-size:26px;color:var(--accent-2);margin:0 0 14px;text-transform:uppercase;letter-spacing:-.01em}
.modal-card label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.modal-card input,.modal-card select,.modal-card textarea{width:100%;padding:10px 12px;background:rgba(0,0,0,0.30);border:1px solid rgba(245,232,216,0.15);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px}
.modal-card textarea{font-family:var(--serif);font-size:14px;min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.modal-actions button{padding:10px 20px;border-radius:5px;border:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
.modal-actions .cancel{background:transparent;color:var(--muted);border:1px solid rgba(245,232,216,0.15)}
.modal-actions .confirm{background:var(--accent);color:#0a1a14}

.toast{position:fixed;bottom:24px;right:24px;padding:14px 18px;background:rgba(52,211,153,0.95);color:#0a1a14;border-radius:8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;box-shadow:0 4px 20px rgba(0,0,0,0.40);transform:translateY(100px);opacity:0;transition:all .25s;z-index:50}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:rgba(248,113,113,0.95)}
</style>
<script src="/app/embed-mode.js"></script>
<script src="/app/gate-banner.js" defer></script>
<script src="/app/dnc-check.js" defer></script>
<script src="/app/challenge-notif.js" defer></script>
</head>
<body>

<header class="top">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>
  <nav class="crumb">
    <a href="/">Floor</a><span class="sep">/</span>
    <a id="org-back" href="#">Org</a><span class="sep">/</span>
    <span class="here" id="c-title">Loading…</span>
  </nav>
</header>

<main class="wrap">
  <aside id="card-host"><div class="pcard"><div class="empty">Loading…</div></div></aside>

  <section>
    <div class="section">
      <h2>Open follow-ups <span id="fu-ct" style="color:var(--gold);font-family:var(--display);font-size:18px"></span></h2>
      <div id="fu-list"><div class="empty">No follow-ups</div></div>
      <button id="add-fu" style="margin-top:8px;width:100%;padding:9px;background:rgba(251,191,36,0.10);color:var(--gold);border:1px dashed rgba(251,191,36,0.30);border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer">+ Schedule a follow-up</button>
    </div>

    <div class="section">
      <h2>Activity with this person</h2>
      <div class="tl" id="timeline"><div class="empty">No activity yet</div></div>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-card" id="modal-card"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const params  = new URLSearchParams(location.search);
const BULLPEN = params.get('b')    || 'killsesh';
const REP     = params.get('rep')  || localStorage.getItem('bullpen-rep') || 'beers';
const ORG     = params.get('org')  || '';
const SLUG    = params.get('slug') || '';

document.getElementById('org-back').href = '/?b=' + encodeURIComponent(BULLPEN);

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast'+(err?' error':''),2400); }
async function fetchJSON(url, opts){
  const r = await fetch(url, opts||{});
  if(!r.ok){ let m=r.statusText; try{m=(await r.json()).error||m;}catch(_){} throw new Error(m); }
  return r.json();
}
function $(id){ return document.getElementById(id); }
function initials(s){ return (s||'?').slice(0,2).toUpperCase(); }
function ICON(kind){ return {call:'📞', email:'✉', meeting:'📅', note:'📝', sms:'💬'}[kind] || '•'; }

let CONTACT = null;

function paintCard(){
  const host = $('card-host'); clear(host);
  const c = el('div', 'pcard');
  c.appendChild(el('div', 'av', initials(CONTACT.personName)));
  c.appendChild(el('h1', null, CONTACT.personName));
  c.appendChild(el('div', 'role', (CONTACT.role || 'contact') + ' · ' + ORG));

  const fields = [
    ['Email',    CONTACT.email,    CONTACT.email ? ('mailto:' + CONTACT.email) : null],
    ['Phone',    CONTACT.phone,    CONTACT.phone ? ('tel:' + CONTACT.phone.replace(/[^0-9+]/g,'')) : null],
    ['LinkedIn', CONTACT.linkedin, CONTACT.linkedin ? (CONTACT.linkedin.startsWith('http') ? CONTACT.linkedin : 'https://' + CONTACT.linkedin) : null],
    ['Relationship', CONTACT.relationship || 'contact', null],
  ];
  for(const [l, v, href] of fields){
    if(!v) continue;
    const f = el('div', 'field');
    f.appendChild(el('div', 'l', l));
    if(href){
      const a = document.createElement('a'); a.href = href; a.textContent = v;
      if(href.startsWith('http')) a.target = '_blank';
      const vd = el('div', 'v'); vd.appendChild(a); f.appendChild(vd);
    } else {
      f.appendChild(el('div', 'v', v));
    }
    c.appendChild(f);
  }
  if(CONTACT.bio) c.appendChild(el('div', 'bio', CONTACT.bio));

  const actions = el('div', 'actions');
  const logCall = el('button', null, '📞 Log call');
  logCall.onclick = () => openLogModal('call');
  actions.appendChild(logCall);
  const logEmail = el('button', null, '✉ Log email');
  logEmail.onclick = () => openLogModal('email');
  actions.appendChild(logEmail);
  const logMeet = el('button', 'gold', '📅 Log meeting');
  logMeet.onclick = () => openLogModal('meeting');
  actions.appendChild(logMeet);
  c.appendChild(actions);

  host.appendChild(c);
}

function paintTimeline(events){
  const t = $('timeline'); clear(t);
  if(!events.length){
    t.appendChild(el('div', 'empty', 'No activity with this person yet'));
    return;
  }
  for(const e of events){
    const row = el('div', 'ev ' + e.kind);
    row.appendChild(el('div', 'ico', ICON(e.kind)));
    const body = el('div');
    body.appendChild(el('div', 'summary', e.summary || '(' + e.kind + ')'));
    if(e.notes) body.appendChild(el('div', 'notes', e.notes));
    const meta = el('div', 'meta');
    if(e.outcome) meta.appendChild(el('span', 'o ' + e.outcome, e.outcome));
    meta.appendChild(document.createTextNode((e.actor || 'self') + (e.direction ? ' · ' + e.direction : '')));
    if(e.duration_sec) meta.appendChild(document.createTextNode(' · ' + e.duration_sec + 's'));
    body.appendChild(meta);
    row.appendChild(body);
    row.appendChild(el('div', 'ts', (e.ts||'').replace('T',' ').slice(0,16)));
    t.appendChild(row);
  }
}

function paintFollowups(fus){
  const list = $('fu-list'); clear(list);
  $('fu-ct').textContent = fus.length ? String(fus.length) : '';
  if(!fus.length){ list.appendChild(el('div', 'empty', 'None')); return; }
  const now = new Date();
  for(const f of fus){
    const overdue = new Date(f.due_at) < now;
    const t = el('div', 'fu-tile' + (overdue ? ' overdue' : ''));
    const left = el('div');
    left.appendChild(el('div', 't', f.title));
    left.appendChild(el('div', 'meta', (f.due_at||'').replace('T',' ').slice(0,16) + ' · ' + f.owner_rep));
    t.appendChild(left);
    const dn = el('button', null, '✓ Done');
    dn.style.cssText = 'padding:5px 10px;background:var(--accent);color:#0a1a14;border:none;border-radius:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;cursor:pointer;font-weight:700;align-self:center';
    dn.onclick = async () => {
      try {
        await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/followups/${encodeURIComponent(f.owner_rep)}/${encodeURIComponent(f.id)}/complete`, {method:'POST'});
        toast('+8 XP'); load();
      } catch(e){ toast(e.message, true); }
    };
    t.appendChild(dn);
    list.appendChild(t);
  }
}

function openLogModal(kind){
  const c = $('modal-card'); clear(c);
  c.appendChild(el('h2', null,
    kind === 'call' ? '📞 Log call' :
    kind === 'email' ? '✉ Log email' :
    kind === 'meeting' ? '📅 Log meeting' :
    '📝 Add note'));
  c.appendChild(el('label', null, 'Summary'));
  const sum = document.createElement('input'); sum.id='log-summary'; c.appendChild(sum);
  c.appendChild(el('label', null, 'Notes'));
  const notes = document.createElement('textarea'); notes.id='log-notes'; c.appendChild(notes);
  if(kind === 'call'){
    c.appendChild(el('label', null, 'Outcome'));
    const sel = document.createElement('select'); sel.id='log-outcome';
    for(const o of ['booked','voicemail','no_answer','gatekeeper','not_interested','bad_number','callback','other']){
      const op = el('option', null, o.replace(/_/g,' ')); op.value = o; sel.appendChild(op);
    }
    c.appendChild(sel);
    c.appendChild(el('label', null, 'Duration (seconds)'));
    const dur = document.createElement('input'); dur.id='log-dur'; dur.type='number'; c.appendChild(dur);
  }
  const actions = el('div', 'modal-actions');
  const cancel = el('button', 'cancel', 'Cancel');
  cancel.onclick = () => $('modal').classList.remove('open');
  actions.appendChild(cancel);
  const ok = el('button', 'confirm', 'Log it');
  ok.onclick = async () => {
    try {
      const body = {
        rep: REP, kind,
        target_type: 'contact', target_id: ORG + '/' + SLUG,
        summary: $('log-summary').value,
        notes: $('log-notes').value,
        contact_slug: SLUG,
        org_slug: ORG,
      };
      if(kind === 'call'){
        body.outcome = $('log-outcome').value;
        const d = parseInt($('log-dur').value || '0', 10);
        if(d) body.duration_sec = d;
      }
      await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/activity`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
      $('modal').classList.remove('open');
      toast('Logged'); load();
    } catch(e){ toast(e.message, true); }
  };
  actions.appendChild(ok);
  c.appendChild(actions);
  $('modal').classList.add('open');
  setTimeout(() => sum.focus(), 50);
}

$('add-fu').onclick = () => {
  const c = $('modal-card'); clear(c);
  c.appendChild(el('h2', null, 'Schedule a follow-up'));
  c.appendChild(el('label', null, 'What do you need to do?'));
  const t = document.createElement('input'); t.id = 'fu-title';
  t.placeholder = "e.g. 'Call " + (CONTACT?.personName || 'them') + " back'";
  c.appendChild(t);
  c.appendChild(el('label', null, 'When?'));
  const due = document.createElement('select'); due.id = 'fu-due';
  for(const [v, l] of [['+1h','In 1 hour'],['+4h','In 4 hours'],['today','Today'],['tomorrow','Tomorrow 9am'],['+3d','+3 days'],['+7d','+7 days']]){
    const op = el('option', null, l); op.value = v;
    if(v === 'tomorrow') op.selected = true;
    due.appendChild(op);
  }
  c.appendChild(due);
  const actions = el('div', 'modal-actions');
  const cancel = el('button', 'cancel', 'Cancel');
  cancel.onclick = () => $('modal').classList.remove('open');
  actions.appendChild(cancel);
  const ok = el('button', 'confirm', 'Schedule');
  ok.onclick = async () => {
    try {
      await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/followups`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rep: REP, title: t.value, due_at: due.value,
                              target_type: 'contact', target_id: ORG + '/' + SLUG})
      });
      $('modal').classList.remove('open');
      toast('Scheduled'); load();
    } catch(e){ toast(e.message, true); }
  };
  actions.appendChild(ok);
  c.appendChild(actions);
  $('modal').classList.add('open');
  setTimeout(() => t.focus(), 50);
};

$('modal').onclick = (e) => { if(e.target.id === 'modal') $('modal').classList.remove('open'); };

async function load(){
  try {
    CONTACT = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/orgs/${encodeURIComponent(ORG)}/contacts/${encodeURIComponent(SLUG)}`);
    document.title = CONTACT.personName + ' · BullpenLM';
    $('c-title').textContent = CONTACT.personName;
    paintCard();
    const [tl, fus] = await Promise.all([
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/timeline/contact/${encodeURIComponent(ORG)}/${encodeURIComponent(SLUG)}`),
      fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/followups-for/contact/${encodeURIComponent(ORG + '/' + SLUG)}`),
    ]);
    paintTimeline(tl.activity || []);
    paintFollowups(fus.followups || []);
  } catch(e){
    toast('Failed: ' + e.message, true);
  }
}

(function(){
  function beat(){
    fetch(`/api/b/${encodeURIComponent(BULLPEN)}/presence/beat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, page: 'contact', status: 'on ' + (CONTACT?.personName || SLUG)}),
    }).catch(()=>{});
  }
  beat(); setInterval(beat, 20000);
})();

if(!ORG || !SLUG){
  $('c-title').textContent = 'Missing params';
  toast('Need ?org=… &slug=…', true);
} else {
  load();
}
</script>

</body>
</html>
