<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Arena · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=sentient@400,500,700&f%5B%5D=switzer@400,500,600,700&f%5B%5D=bespoke-serif@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#100f0d;--bg-1:#1b1916;--bg-2:#262219;--text:#efe9dd;--muted:#a59c8c;--dim:#6b6357;
  --accent:#6fb38a;--accent-2:#8fcfae;--accent-dim:#244034;--gold:#d8a13a;--danger:#e06a5a;--purple:#d8a13a;
  --mono:"Switzer",-apple-system,sans-serif;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Sentient",serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
.top{position:sticky;top:0;z-index:30;padding:14px 28px;display:flex;align-items:center;gap:20px;background:rgba(27,25,22,0.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(239,233,221,0.08)}
.brand{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;display:inline-flex;align-items:baseline}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}.crumb .sep{margin:0 8px;color:var(--dim)}.crumb .here{color:var(--accent)}
.live-pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;background:rgba(111,179,138,0.12);border:1px solid rgba(111,179,138,0.30);border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-2)}
.live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.5s infinite}
.live-pill.dead{background:rgba(165,156,140,0.10);border-color:rgba(165,156,140,0.20);color:var(--muted)}
.live-pill.dead .dot{background:var(--muted);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.wrap{max-width:1500px;margin:0 auto;padding:22px 28px;display:grid;grid-template-columns:280px 1fr 320px;gap:22px}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}

/* ── Online roster (LEFT) ── */
.col{display:flex;flex-direction:column;gap:14px}
.panel{background:rgba(27,25,22,0.55);border:1px solid rgba(239,233,221,0.08);border-radius:10px;padding:18px}
.panel h3{font-family:var(--mono);font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid rgba(239,233,221,0.08);display:flex;justify-content:space-between;align-items:center}
.panel h3 .ct{font-family:var(--display);color:var(--gold);font-size:18px}

.roster{display:flex;flex-direction:column;gap:8px}
.roster .row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:8px 10px;background:rgba(38,34,25,0.55);border:1px solid rgba(239,233,221,0.06);border-radius:8px;align-items:center;transition:border-color .12s}
.roster .row:hover{border-color:var(--accent-dim)}
.roster .av{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent-2),var(--accent-dim));display:grid;place-items:center;font-family:var(--display);font-size:16px;color:#100f0d;letter-spacing:-.02em;position:relative}
.roster .av .green{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-1);box-shadow:0 0 8px var(--accent)}
.roster .name{font-family:var(--serif);font-size:14px;color:var(--text);font-weight:600;line-height:1.1}
.roster .where{font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.roster .status{font-family:var(--mono);font-size:9.5px;color:var(--accent-2);margin-top:2px;font-style:italic}
.roster .last{font-family:var(--mono);font-size:9px;color:var(--dim)}

/* ── Live ticker (CENTER) ── */
.ticker{height:calc(100vh - 130px);overflow-y:auto;padding-right:6px}
.ticker .ev{padding:11px 14px;background:rgba(27,25,22,0.55);border:1px solid rgba(239,233,221,0.06);border-radius:8px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:10px;animation:slideIn .35s ease-out}
@keyframes slideIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.ticker .ev.flash{border-color:var(--gold);box-shadow:0 0 22px rgba(216,161,58,0.30)}
.ticker .ev .hdr{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:10.5px}
.ticker .ev .ts{color:var(--dim);font-size:9.5px}
.ticker .ev .who{color:var(--accent);font-weight:600}
.ticker .ev .chip{padding:2px 8px;border-radius:3px;background:rgba(239,233,221,0.08);color:var(--muted);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase}
.ticker .ev .chip.deal_closed_won{background:var(--accent);color:#100f0d;font-weight:700}
.ticker .ev .chip.deal_closed_lost{background:rgba(224,106,90,0.20);color:#e9a59b}
.ticker .ev .chip.deal_stage_moved,.ticker .ev .chip.deal_created{background:rgba(111,179,138,0.15);color:var(--accent-2)}
.ticker .ev .chip.achievement_unlocked{background:var(--purple);color:#100f0d;font-weight:700}
.ticker .ev .chip.trophy_awarded{background:var(--gold);color:#100f0d;font-weight:700}
.ticker .ev .chip.doc_signed{background:rgba(143,207,174,0.20);color:var(--accent-2)}
.ticker .ev .chip.class_picked,.ticker .ev .chip.squad_formed,.ticker .ev .chip.squad_joined{background:var(--gold);color:#100f0d;font-weight:700}
.ticker .ev .chip.quest_completed,.ticker .ev .chip.raid_authored,.ticker .ev .chip.raid_joined{background:rgba(216,161,58,0.25);color:#e9c885}
.ticker .ev .chip.reaction{background:transparent;color:var(--gold)}
.ticker .ev .desc{font-family:var(--serif);font-size:14px;color:var(--text);margin-top:6px;line-height:1.4}
.ticker .ev .reacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.ticker .ev .reacts .r{padding:3px 8px;background:rgba(239,233,221,0.06);border:1px solid rgba(239,233,221,0.10);border-radius:999px;font-size:13px;cursor:pointer;font-family:var(--mono);font-size:11px;transition:background .12s,transform .12s;user-select:none}
.ticker .ev .reacts .r:hover{background:rgba(216,161,58,0.18);transform:translateY(-1px)}
.ticker .ev .reacts .r.mine{background:rgba(216,161,58,0.25);border-color:rgba(216,161,58,0.40)}
.ticker .ev .reacts .r .ct{color:var(--gold);margin-left:5px;font-weight:600}
.ticker .ev .react-pick{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .12s}
.ticker .ev:hover .react-pick{opacity:1}
.ticker .ev .react-pick .p{padding:3px 7px;background:rgba(0,0,0,0.20);border:1px solid rgba(239,233,221,0.06);border-radius:5px;cursor:pointer;font-size:14px;line-height:1}
.ticker .ev .react-pick .p:hover{background:rgba(216,161,58,0.20)}

/* ── Raid party (RIGHT) ── */
.raid{padding:14px;background:linear-gradient(135deg,rgba(216,161,58,0.10),rgba(38,34,25,0.55));border:1px solid rgba(216,161,58,0.30);border-radius:10px;margin-bottom:10px}
.raid h4{font-family:var(--display);font-size:16px;color:#e9c885;margin:0 0 5px;letter-spacing:-.01em;text-transform:uppercase}
.raid .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.raid .bar{height:8px;background:rgba(0,0,0,0.40);border-radius:5px;overflow:hidden;margin-bottom:8px}
.raid .bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),#e9c885);transition:width .6s ease-out;border-radius:5px}
.raid .stats{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:8px}
.raid .party{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.raid .party .pm{width:24px;height:24px;border-radius:50%;background:var(--accent-dim);display:grid;place-items:center;font-size:9px;font-family:var(--display);color:#100f0d;border:1px solid rgba(239,233,221,0.15)}
.raid .party .pm.done{background:var(--gold);box-shadow:0 0 10px rgba(216,161,58,0.50)}
.raid .actions{display:flex;gap:6px}
.raid .actions button{flex:1;padding:7px 10px;background:var(--purple);color:#100f0d;border:none;border-radius:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
.raid .actions button.leave{background:transparent;color:var(--muted);border:1px solid rgba(239,233,221,0.15);font-weight:500}
.raid .actions button.claim{background:var(--gold);color:#100f0d}
.raid .actions button:disabled{opacity:.5;cursor:default}

/* ── Squads ── */
.squad-card{padding:12px 14px;background:rgba(38,34,25,0.55);border:1px solid;border-radius:8px;margin-bottom:8px}
.squad-card .nm{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.squad-card .members{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);margin-top:5px}
.squad-card .bonus{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:4px}

.empty{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:center;padding:18px;letter-spacing:.08em}

/* ── BELL — full-screen flash for close-won ── */
.bell{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(216,161,58,0.35),rgba(0,0,0,0.85));animation:bellFlash 4s ease-out forwards;pointer-events:none}
.bell.show{display:flex}
@keyframes bellFlash{
  0%{opacity:0;backdrop-filter:blur(0)}
  10%{opacity:1;backdrop-filter:blur(8px)}
  30%{opacity:1;backdrop-filter:blur(8px)}
  100%{opacity:0;backdrop-filter:blur(0)}
}
.bell .card{padding:50px 70px;background:linear-gradient(135deg,#d8a13a,#d8a13a);border-radius:20px;border:4px solid #100f0d;box-shadow:0 20px 80px rgba(0,0,0,0.6);text-align:center;animation:bellSlam .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bellSlam{0%{transform:scale(.3) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.bell .card .emoji{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#100f0d;line-height:1;margin-bottom:8px}
.bell .card .who{font-family:var(--display);font-size:64px;color:#100f0d;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.bell .card .what{font-family:var(--display);font-size:44px;color:#100f0d;margin-top:6px;letter-spacing:-.01em;text-transform:uppercase}
.bell .card .amt{font-family:var(--display);font-size:90px;color:#100f0d;margin-top:14px;letter-spacing:-.03em;line-height:1}

/* ── Toast (corner notifications) ── */
.toast{position:fixed;bottom:24px;right:24px;padding:14px 18px;background:rgba(111,179,138,0.95);color:#100f0d;border-radius:8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;box-shadow:0 4px 20px rgba(0,0,0,0.40);transform:translateY(100px);opacity:0;transition:all .25s;z-index:50}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:rgba(224,106,90,0.95)}

.squad-form{display:flex;gap:6px;margin-top:10px}
.squad-form input{flex:1;padding:7px 10px;background:rgba(0,0,0,0.25);border:1px solid rgba(239,233,221,0.10);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:11px}
.squad-form button{padding:7px 12px;background:var(--accent);color:#100f0d;border:none;border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
</style>
<script src="/app/gate-banner.js" defer></script>
<script src="/app/embed-mode.js"></script>
<script src="/app/challenge-notif.js" defer></script>
<script src="/app/tutorial.js" defer></script>
</head>
<body>

<header class="top">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>
  <nav class="crumb">
    <a href="/">Floor</a><span class="sep">/</span>
    <span class="here">The Arena</span>
  </nav>
  <div class="live-pill" id="live-pill"><span class="dot"></span>LIVE</div>
</header>

<main class="wrap">

  <!-- LEFT: Online roster + squads -->
  <aside class="col">
    <div class="panel">
      <h3>Online now <span class="ct" id="online-ct">0</span></h3>
      <div class="roster" id="roster"></div>
    </div>

    <div class="panel">
      <h3>Squads</h3>
      <div id="squads"></div>
      <div class="squad-form" id="squad-form">
        <input id="squad-name" placeholder="Squad name" />
        <button id="squad-create">Form</button>
      </div>
    </div>
  </aside>

  <!-- CENTER: Live ticker -->
  <section class="col">
    <div class="panel" style="padding-bottom:8px">
      <h3>Live activity <span class="ct" style="font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.10em" id="reps-online-ct">— online</span></h3>
      <div class="ticker" id="ticker"></div>
    </div>
  </section>

  <!-- RIGHT: Raid parties -->
  <aside class="col">
    <div class="panel">
      <h3>Active raids</h3>
      <div id="raids"></div>
    </div>
  </aside>

</main>

<div class="bell" id="bell">
  <div class="card">
    <div class="emoji">RING THE BELL</div>
    <div class="who" id="bell-who">—</div>
    <div class="what">CLOSED</div>
    <div class="amt" id="bell-amt">$0</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const params  = new URLSearchParams(location.search);
const BULLPEN = params.get('b')   || 'killsesh';
const REP     = params.get('rep') || localStorage.getItem('bullpen-rep') || 'beers';

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast'+(err?' error':''),2400); }
async function fetchJSON(url, opts){
  const r = await fetch(url, opts||{});
  if(!r.ok){ let m=r.statusText; try{m=(await r.json()).error||m;}catch(_){} throw new Error(m); }
  return r.json();
}
function $(id){ return document.getElementById(id); }
function fmtMoney(n){ return '$' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function initials(s){ return (s||'?').slice(0,2).toUpperCase(); }
function relTime(iso){
  if(!iso) return '';
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso))/1000));
  if(s < 60) return s + 's';
  if(s < 3600) return Math.floor(s/60) + 'm';
  if(s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

let EVENTS = [];      // newest-first cache (capped 80)
let REACTIONS = {};   // event_id → {emoji: [reps...]}
let SQUAD_BY_REP = {};
let SQUADS = [];
let MY_SQUAD = null;

// ── Heartbeat ──
async function heartbeat(){
  try {
    await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/presence/beat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, page: 'arena', status: 'in the arena'}),
    });
  } catch(_){}
}
heartbeat(); setInterval(heartbeat, 20000);

// ── Roster ──
async function loadRoster(){
  try {
    const r = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/presence`);
    const online = r.online || [];
    $('online-ct').textContent = String(online.length);
    $('reps-online-ct').textContent = online.length + ' online';
    const root = $('roster'); clear(root);
    if(!online.length){
      root.appendChild(el('div', 'empty', 'No one here yet'));
      return;
    }
    for(const o of online){
      const row = el('div', 'row');
      const av = el('div', 'av', initials(o.rep));
      av.appendChild(el('div', 'green'));
      row.appendChild(av);
      const mid = el('div');
      mid.appendChild(el('div', 'name', o.rep));
      mid.appendChild(el('div', 'where', '▸ ' + (o.page || 'floor')));
      if(o.status) mid.appendChild(el('div', 'status', o.status));
      row.appendChild(mid);
      row.appendChild(el('div', 'last', relTime(o.ts)));
      root.appendChild(row);
    }
  } catch(_){}
}
loadRoster(); setInterval(loadRoster, 8000);

// ── Squads ──
async function loadSquads(){
  try {
    const r = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/squads`);
    SQUADS = r.squads || [];
    SQUAD_BY_REP = {};
    MY_SQUAD = null;
    for(const s of SQUADS){
      for(const m of s.members) SQUAD_BY_REP[m] = s;
      if(s.members.includes(REP)) MY_SQUAD = s;
    }
    const root = $('squads'); clear(root);
    if(!SQUADS.length){
      root.appendChild(el('div', 'empty', 'No squads — form one'));
      return;
    }
    for(const s of SQUADS){
      const c = el('div', 'squad-card');
      c.style.borderColor = s.color + '60';
      c.style.background = 'linear-gradient(135deg, ' + s.color + '14, rgba(38,34,25,0.55))';
      const nm = el('div', 'nm', s.name); nm.style.color = s.color;
      c.appendChild(nm);
      c.appendChild(el('div', 'members', (s.members || []).join(' · ')));
      const bonus = 5 * Math.max(0, (s.members || []).length - 1);
      if(bonus > 0) c.appendChild(el('div', 'bonus', '+' + Math.min(20, bonus) + '% xp per teammate'));
      root.appendChild(c);
    }
  } catch(_){}
}
$('squad-create').onclick = async () => {
  const name = $('squad-name').value.trim();
  if(!name){ toast('Pick a squad name first', true); return; }
  try {
    await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/squads`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, name}),
    });
    $('squad-name').value = '';
    toast('Squad formed');
    loadSquads();
  } catch(e){ toast(e.message, true); }
};
loadSquads(); setInterval(loadSquads, 30000);

// ── Raids ──
async function loadRaids(){
  try {
    const q = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/quests`);
    const raids = q.raids || [];
    const root = $('raids'); clear(root);
    if(!raids.length){
      root.appendChild(el('div', 'empty', 'No active raids'));
      return;
    }
    for(const r of raids){
      try {
        const detail = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/raids/${encodeURIComponent(r.id)}`);
        renderRaid(detail.raid, detail.progress, root);
      } catch(_){}
    }
  } catch(_){}
}
function renderRaid(raid, prog, host){
  const c = el('div', 'raid');
  c.appendChild(el('h4', null, raid.name || raid.id));
  c.appendChild(el('div', 'meta',
    prog.party_size + ' / 5 in party · ' + (raid.xp_reward||0) + ' xp pool · share ' + prog.xp_per_member + ' xp'));
  const bar = el('div', 'bar');
  const fill = el('div', 'bar-fill');
  fill.style.width = (prog.pct * 100) + '%';
  bar.appendChild(fill);
  c.appendChild(bar);
  const stats = el('div', 'stats');
  stats.appendChild(el('span', null, prog.count + ' / ' + prog.target));
  stats.appendChild(el('span', null, Math.round(prog.pct*100) + '%'));
  c.appendChild(stats);
  const party = el('div', 'party');
  for(const m of (prog.members || [])){
    const pm = el('div', 'pm' + ((prog.completed_members||[]).includes(m) ? ' done' : ''), initials(m));
    pm.title = m + ((prog.completed_members||[]).includes(m) ? ' (claimed)' : '');
    party.appendChild(pm);
  }
  c.appendChild(party);
  const actions = el('div', 'actions');
  const inParty = (prog.members || []).includes(REP);
  if(!inParty){
    const btn = el('button', null, 'Join raid');
    btn.onclick = async () => {
      try { await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/raids/${encodeURIComponent(raid.id)}/join`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rep: REP}),
      }); toast('Joined raid'); loadRaids(); }
      catch(e){ toast(e.message, true); }
    };
    actions.appendChild(btn);
  } else {
    if(prog.completed && !(prog.completed_members||[]).includes(REP)){
      const btn = el('button', 'claim', 'Claim ' + prog.xp_per_member + ' xp');
      btn.onclick = async () => {
        try { await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/raids/${encodeURIComponent(raid.id)}/claim`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({rep: REP}),
        }); toast('+' + prog.xp_per_member + ' XP earned'); loadRaids(); }
        catch(e){ toast(e.message, true); }
      };
      actions.appendChild(btn);
    }
    const leave = el('button', 'leave', 'Leave');
    leave.onclick = async () => {
      try { await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/raids/${encodeURIComponent(raid.id)}/leave`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rep: REP}),
      }); loadRaids(); }
      catch(e){ toast(e.message, true); }
    };
    actions.appendChild(leave);
  }
  c.appendChild(actions);
  host.appendChild(c);
}
loadRaids(); setInterval(loadRaids, 25000);

// ── Bell (full-screen flash + sound on close-won) ──
function bellSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.4, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
    o.start(); o.stop(ctx.currentTime + 0.9);
    setTimeout(() => {
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type = 'sine'; o2.frequency.value = 1320;
      g2.gain.setValueAtTime(0.35, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      o2.start(); o2.stop(ctx.currentTime + 0.8);
    }, 220);
  } catch(_){}
}
function ringBell(actor, amount){
  $('bell-who').textContent = (actor || '?').toUpperCase();
  $('bell-amt').textContent = fmtMoney(amount);
  const b = $('bell'); b.classList.remove('show');
  void b.offsetWidth; b.classList.add('show');
  bellSound();
  setTimeout(() => b.classList.remove('show'), 4200);
}

// ── Ticker rendering ──
const VISIBLE_KINDS = new Set([
  'deal_closed_won','deal_closed_lost','deal_stage_moved','deal_created',
  'achievement_unlocked','trophy_awarded','doc_signed','class_picked',
  'squad_formed','squad_joined','squad_left','quest_completed',
  'raid_authored','raid_joined','raid_left','sprint_started','duel_challenged',
  'duel_accepted','call','claim','reaction',
]);
const REACTION_EMOJIS = ['FIRE','CLAP','CASH','WIN','NICE'];

function describe(e){
  const p = e.payload || {};
  switch(e.kind){
    case 'deal_closed_won':  return `closed ${p.prospect || e.target_id} for ${fmtMoney(p.amount)}`;
    case 'deal_closed_lost': return `lost ${p.prospect || e.target_id}`;
    case 'deal_stage_moved': return `moved ${p.prospect || e.target_id} → ${p.to}`;
    case 'deal_created':     return `opened ${p.prospect || e.target_id}`;
    case 'achievement_unlocked':
      return `earned ${p.name || e.target_id}` + (p.rarity === 'legendary' ? ' (LEGENDARY)' : '');
    case 'trophy_awarded':   return `looted ${p.icon||''} ${p.name||e.target_id}`;
    case 'doc_signed':       return `signed ${p.doc_title || e.target_id}`;
    case 'class_picked':     return `picked ${p.class}`;
    case 'squad_formed':     return `formed squad "${p.name}"`;
    case 'squad_joined':     return `joined "${p.name}"`;
    case 'squad_left':       return `left "${p.name}"`;
    case 'quest_completed':  return `finished ${p.quest_name || e.target_id} (+${p.xp_reward||0} XP)`;
    case 'raid_authored':    return `called raid: ${p.name || e.target_id}`;
    case 'raid_joined':      return `joined a raid party (${p.party_size||'?'} now)`;
    case 'raid_left':        return `left a raid`;
    case 'sprint_started':   return `kicked off a ${p.score_kind} sprint`;
    case 'duel_challenged':  return `challenged ${p.opponent} to a duel`;
    case 'duel_accepted':    return `accepted ${p.challenger}'s duel`;
    case 'call':             return `${p.call_kind === 'real' ? 'logged a call with' : 'practiced'} ${p.prospect || ''}`;
    case 'claim':            return `claimed ${p.prospect || e.target_id}`;
    case 'reaction':         return `reacted ${p.emoji}`;
    default:                 return e.target_id || '';
  }
}

function renderEvent(e){
  const card = el('div', 'ev' + (e.kind === 'deal_closed_won' ? ' flash' : ''));
  const left = el('div');
  const hdr = el('div', 'hdr');
  hdr.appendChild(el('span', 'ts', (e.ts||'').slice(11,19)));
  hdr.appendChild(el('span', 'chip ' + e.kind, e.kind.replace(/_/g,' ')));
  hdr.appendChild(el('span', 'who', e.actor || '?'));
  left.appendChild(hdr);
  left.appendChild(el('div', 'desc', describe(e)));

  // Existing reactions
  const reacts = el('div', 'reacts');
  const rmap = REACTIONS[e.id] || {};
  for(const [emoji, reps] of Object.entries(rmap)){
    const mine = reps.includes(REP);
    const r = el('div', 'r' + (mine ? ' mine' : ''));
    r.appendChild(document.createTextNode(emoji));
    r.appendChild(el('span', 'ct', String(reps.length)));
    r.title = reps.join(', ');
    r.onclick = () => react(e.id, emoji);
    reacts.appendChild(r);
  }
  left.appendChild(reacts);

  // Pick from allow-list (visible on hover)
  if(e.kind !== 'reaction'){
    const picker = el('div', 'react-pick');
    for(const em of REACTION_EMOJIS){
      const p = el('div', 'p', em);
      p.onclick = () => react(e.id, em);
      picker.appendChild(p);
    }
    left.appendChild(picker);
  }

  card.appendChild(left);
  return card;
}

async function react(event_id, emoji){
  try {
    await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/react`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, event_id, emoji}),
    });
    // Optimistic update
    REACTIONS[event_id] = REACTIONS[event_id] || {};
    REACTIONS[event_id][emoji] = REACTIONS[event_id][emoji] || [];
    if(!REACTIONS[event_id][emoji].includes(REP)) REACTIONS[event_id][emoji].push(REP);
    repaint();
  } catch(e){ toast(e.message, true); }
}

function repaint(){
  const root = $('ticker'); clear(root);
  const shown = EVENTS.filter(e => VISIBLE_KINDS.has(e.kind)).slice(0, 80);
  if(!shown.length){
    root.appendChild(el('div', 'empty', 'Quiet on the floor. Take a call.'));
    return;
  }
  for(const e of shown) root.appendChild(renderEvent(e));
}

async function refreshReactions(){
  try {
    const ids = EVENTS.slice(0, 60).map(e => e.id).join(',');
    if(!ids) return;
    const r = await fetchJSON(`/api/b/${encodeURIComponent(BULLPEN)}/reactions?ids=${ids}`);
    REACTIONS = r.counts || {};
    repaint();
  } catch(_){}
}

// ── SSE stream ──
let sse = null;
function connectSSE(){
  try {
    sse = new EventSource(`/api/b/${encodeURIComponent(BULLPEN)}/stream`);
    sse.onmessage = (msg) => {
      try {
        const e = JSON.parse(msg.data);
        // Insert at top (dedupe by id)
        if(!EVENTS.find(x => x.id === e.id)){
          EVENTS.unshift(e);
          EVENTS = EVENTS.slice(0, 200);
        }
        repaint();
        if(e.kind === 'deal_closed_won' && e.actor !== REP){
          ringBell(e.actor, (e.payload||{}).amount);
        } else if(e.kind === 'deal_closed_won'){
          // Self-close still rings (you earned it)
          ringBell(e.actor, (e.payload||{}).amount);
        }
        $('live-pill').classList.remove('dead');
      } catch(_){}
    };
    sse.onerror = () => {
      $('live-pill').classList.add('dead');
      sse.close();
      setTimeout(connectSSE, 3000);
    };
  } catch(_){
    $('live-pill').classList.add('dead');
    setTimeout(connectSSE, 3000);
  }
}
connectSSE();

// Poll reactions every 8s — SSE delivers the events themselves, but
// reactions aggregate per-event and benefit from a periodic sync.
setInterval(refreshReactions, 8000);
setTimeout(refreshReactions, 1500);
</script>
