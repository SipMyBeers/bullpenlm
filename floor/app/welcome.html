<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100f0d">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=sentient@400,500,700&f%5B%5D=switzer@400,500,600,700&f%5B%5D=bespoke-serif@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#1b1916;--bg-1:#262219;--bg-2:#262219;--text:#efe9dd;--muted:#a59c8c;--dim:#6b6357;
  --accent:#6fb38a;--accent-2:#8fcfae;--accent-dim:#2d4a3a;--gold:#d8a13a;--danger:#e06a5a;--purple:#a78bfa;
  --mono:"Switzer",-apple-system,sans-serif;--sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;--display:"Sentient",serif;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-2) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh}

.wrap{max-width:780px;margin:0 auto;padding:40px 28px}

.brand{font-family:var(--display);font-size:28px;text-transform:uppercase;letter-spacing:-.02em;display:inline-flex;align-items:baseline;text-decoration:none;margin-bottom:18px}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}

/* Progress bar */
.progress{display:flex;gap:10px;margin-bottom:30px}
.progress .seg{flex:1;height:6px;background:rgba(245,232,216,0.08);border-radius:3px;overflow:hidden;position:relative}
.progress .seg .fill{height:100%;background:var(--accent);width:0%;transition:width .4s}
.progress .seg.done .fill{width:100%}
.progress .seg.active .fill{width:50%}
.progress .seg .label{position:absolute;top:14px;left:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.progress .seg.done .label{color:var(--accent-2)}
.progress .seg.active .label{color:var(--gold)}

.step{background:rgba(26,18,8,0.55);border:1px solid rgba(245,232,216,0.10);border-radius:14px;padding:34px 38px;margin-top:36px}
.step h1{font-family:var(--display);font-size:38px;color:var(--text);margin:0 0 6px;text-transform:uppercase;letter-spacing:-.02em;line-height:1.05}
.step .sub{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin:0 0 26px;line-height:1.5}

.field{margin-bottom:20px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px 16px;background:rgba(0,0,0,0.30);border:1px solid rgba(245,232,216,0.15);border-radius:7px;color:var(--text);font-family:var(--serif);font-size:18px;outline:none;transition:border-color .12s}
.field input:focus{border-color:var(--accent)}
.field .hint{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.04em}

/* Avatar picker */
.avatar-grid{display:grid;grid-template-columns:repeat(8, 1fr);gap:8px;margin-top:6px}
@media(max-width:560px){.avatar-grid{grid-template-columns:repeat(6, 1fr)}}
.av-tile{aspect-ratio:1;display:grid;place-items:center;font-family:var(--display);font-size:22px;text-transform:uppercase;color:var(--text);background:rgba(42,29,16,0.55);border:1px solid rgba(245,232,216,0.10);border-radius:8px;cursor:pointer;transition:border-color .12s,transform .12s,background .12s}
.av-tile:hover{border-color:var(--accent-dim);transform:translateY(-1px)}
.av-tile.active{background:rgba(111,179,138,0.18);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(111,179,138,0.20)}

/* Preview card */
.preview{margin-top:20px;padding:18px;background:linear-gradient(135deg,rgba(111,179,138,0.06),rgba(42,29,16,0.55));border:1px solid rgba(245,232,216,0.10);border-radius:10px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.preview .pv-av{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent-2),var(--accent-dim));display:grid;place-items:center;font-family:var(--display);font-size:30px;text-transform:uppercase;color:#0a1a14}
.preview .pv-name{font-family:var(--display);font-size:24px;color:var(--text);text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
.preview .pv-title{font-family:var(--mono);font-size:11px;color:var(--accent-2);letter-spacing:.04em;margin-top:4px}
.preview .pv-rep{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}

/* Briefing snippet */
.b-hero{padding:22px 24px;background:linear-gradient(135deg,rgba(216,161,58,0.12),rgba(111,179,138,0.05));border:1px solid rgba(216,161,58,0.30);border-radius:10px;margin-bottom:18px}
.b-hero .product{font-family:var(--display);font-size:32px;color:var(--gold);text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.b-hero .why{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-top:6px}

.opener{padding:20px 22px;background:rgba(0,0,0,0.30);border:1px solid rgba(111,179,138,0.30);border-radius:10px;font-family:var(--serif);font-size:15px;line-height:1.75;color:var(--text);white-space:pre-wrap;position:relative;margin-bottom:20px}
.opener::before{content:"OPENER";position:absolute;top:-10px;left:18px;padding:3px 10px;background:var(--accent);color:#0a1a14;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;font-weight:700;border-radius:4px}

/* Rates — make them BIG */
.rates-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin:18px 0}
@media(max-width:560px){.rates-grid{grid-template-columns:1fr}}
.rate-card{padding:18px;background:rgba(216,161,58,0.06);border:1px solid rgba(216,161,58,0.30);border-radius:10px;text-align:center}
.rate-card .pct{font-family:var(--display);font-size:54px;color:var(--gold);line-height:1;letter-spacing:-.02em}
.rate-card .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.rate-card .sub{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--accent-2);margin-top:4px}

.window-card{padding:14px 18px;background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.30);border-radius:8px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:#c4b5fd;margin-bottom:20px;line-height:1.55}
.window-card strong{color:#fff}

.verticals-row{display:flex;flex-wrap:wrap;gap:6px}
.vert-chip{padding:5px 11px;background:rgba(111,179,138,0.08);border:1px solid rgba(111,179,138,0.25);border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--accent-2)}

/* Sign step */
.sig-form{margin-top:20px}
.sig-form input{font-family:var(--display);font-size:26px;padding:14px 18px;letter-spacing:.02em}
.sig-form .legal-line{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.7;letter-spacing:.04em}

.collapsible{margin-top:14px;padding:14px 16px;background:rgba(0,0,0,0.20);border:1px solid rgba(245,232,216,0.10);border-radius:8px}
.collapsible summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.10em;color:var(--accent-2);text-transform:uppercase;list-style:none}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible .body{margin-top:14px;font-family:var(--serif);font-size:14px;line-height:1.7;color:#efe9dd;white-space:pre-wrap;max-height:380px;overflow-y:auto}

/* Footer / actions */
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:24px;border-top:1px solid rgba(245,232,216,0.08)}
.actions .back{padding:10px 18px;background:transparent;color:var(--muted);border:1px solid rgba(245,232,216,0.15);border-radius:6px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.actions .back:hover{color:var(--text)}
.actions .next{padding:13px 28px;background:var(--accent);color:#0a1a14;border:none;border-radius:7px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;cursor:pointer;transition:transform .12s}
.actions .next:hover{transform:translateY(-1px)}
.actions .next:disabled{background:rgba(168,154,135,0.20);color:var(--muted);cursor:not-allowed;transform:none}
.actions .next.gold{background:var(--gold)}

/* Final step */
.final{text-align:center;padding:50px 30px}
.final .check{font-size:72px;line-height:1;margin-bottom:14px}
.final h1{font-family:var(--display);font-size:54px;color:var(--accent);text-transform:uppercase;letter-spacing:-.02em;margin:0 0 12px;line-height:1}
.final .you{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:0 auto 32px;max-width:46ch;line-height:1.55}
.final .go{padding:16px 36px;background:var(--gold);color:#0a1a14;border:none;border-radius:8px;font-family:var(--mono);font-size:13px;letter-spacing:.20em;text-transform:uppercase;font-weight:700;cursor:pointer}

.empty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:30px;letter-spacing:.06em}

.toast{position:fixed;bottom:24px;right:24px;padding:14px 18px;background:rgba(111,179,138,0.95);color:#0a1a14;border-radius:8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;box-shadow:0 4px 20px rgba(0,0,0,0.40);transform:translateY(100px);opacity:0;transition:all .25s;z-index:200}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:rgba(224,106,90,0.95)}
</style>
</head>
<body>

<main class="wrap">
  <a href="/" class="brand"><span class="b">BULLPEN</span><span class="lm">LM</span></a>

  <div class="progress" id="progress">
    <div class="seg" data-step="identity"><div class="fill"></div><div class="label">1 · Identity</div></div>
    <div class="seg" data-step="briefing"><div class="fill"></div><div class="label">2 · Briefing</div></div>
    <div class="seg" data-step="agreement"><div class="fill"></div><div class="label">3 · Agreement</div></div>
  </div>

  <div id="step"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const params  = new URLSearchParams(location.search);
const BULLPEN = params.get('b')   || 'killsesh';
const REP     = params.get('rep') || localStorage.getItem('bullpen-rep') || '';

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast'+(err?' error':''),2600); }
async function fetchJSON(url, opts){
  const r = await fetch(url, opts||{});
  if(!r.ok){ let m=r.statusText; try{m=(await r.json()).error||m;}catch(_){} throw new Error(m); }
  return r.json();
}
function $(id){ return document.getElementById(id); }
function bp(path){ return '/api/b/' + encodeURIComponent(BULLPEN) + path; }

const AVATARS = ["A","B","C","D","E","F","G","H","J","K","M","N","P","R","S","T"];

let STATE = null;
let MEMBER = null;
let BRIEFING = null;
let AGREEMENT = null;
let PICK_AVATAR = "A";
let PICK_NAME = REP || "";
let PICK_TITLE = "";

function paintProgress(){
  const segs = document.querySelectorAll('.progress .seg');
  const steps = ['identity', 'briefing', 'agreement'];
  const done = new Set(STATE?.steps_done || []);
  const nextIdx = steps.indexOf(STATE?.next_step);
  segs.forEach((seg, i) => {
    seg.classList.toggle('done', done.has(steps[i]));
    seg.classList.toggle('active', i === nextIdx);
  });
}

async function load(){
  if(!REP){
    clear($('step'));
    const c = el('div', 'step');
    c.appendChild(el('h1', null, 'Wait — who are you?'));
    c.appendChild(el('p', 'sub', 'No rep found in the URL or localStorage. Re-open the invite link your founder sent you.'));
    $('step').appendChild(c);
    return;
  }
  try {
    [STATE, MEMBER, BRIEFING, AGREEMENT] = await Promise.all([
      fetchJSON(bp('/onboarding/' + encodeURIComponent(REP))),
      fetchJSON(bp('/members/' + encodeURIComponent(REP))).catch(() => ({member: null})),
      fetchJSON(bp('/briefing')),
      fetchJSON(bp('/legal/referral-agreement')).catch(() => null),
    ]);
    if(MEMBER && MEMBER.member){
      MEMBER = MEMBER.member;
      PICK_NAME = MEMBER.display_name || REP;
      PICK_AVATAR = MEMBER.avatar || "A";
      PICK_TITLE = MEMBER.title || "";
    }
    paintProgress();
    if(STATE.is_complete){ paintFinal(); return; }
    if(STATE.next_step === 'identity')   return paintIdentity();
    if(STATE.next_step === 'briefing')   return paintBriefing();
    if(STATE.next_step === 'agreement')  return paintAgreement();
    paintFinal();
  } catch(e){
    $('step').textContent = 'Failed: ' + e.message;
  }
}

// ── STEP 1 · Identity ──
function paintIdentity(){
  const host = $('step'); clear(host);
  const s = el('div', 'step');
  s.appendChild(el('h1', null, 'Welcome to the bullpen'));
  s.appendChild(el('p', 'sub', 'Three quick steps. First — how should the team see you on the floor.'));

  const f1 = el('div', 'field');
  f1.appendChild(el('label', null, 'Display name'));
  const nameIn = document.createElement('input');
  nameIn.value = PICK_NAME;
  nameIn.placeholder = 'e.g. Mike, Brad, J-Money';
  nameIn.maxLength = 48;
  nameIn.oninput = () => { PICK_NAME = nameIn.value; updatePreview(); };
  f1.appendChild(nameIn);
  f1.appendChild(el('div', 'hint', 'What teammates see in the leaderboard, the wallboard, the floor.'));
  s.appendChild(f1);

  const f2 = el('div', 'field');
  f2.appendChild(el('label', null, 'Pick an avatar'));
  const grid = el('div', 'avatar-grid');
  for(const em of AVATARS){
    const t = el('div', 'av-tile' + (em === PICK_AVATAR ? ' active' : ''), em);
    t.onclick = () => {
      PICK_AVATAR = em;
      for(const x of grid.querySelectorAll('.av-tile')) x.classList.remove('active');
      t.classList.add('active');
      updatePreview();
    };
    grid.appendChild(t);
  }
  f2.appendChild(grid);
  s.appendChild(f2);

  const f3 = el('div', 'field');
  f3.appendChild(el('label', null, 'Public ship / title (optional)'));
  const titleIn = document.createElement('input');
  titleIn.value = PICK_TITLE;
  titleIn.placeholder = 'e.g. Cold caller · Founding sales · BFSI specialist';
  titleIn.maxLength = 48;
  titleIn.oninput = () => { PICK_TITLE = titleIn.value; updatePreview(); };
  f3.appendChild(titleIn);
  f3.appendChild(el('div', 'hint', 'Optional. Sits under your name on your rep card.'));
  s.appendChild(f3);

  const preview = el('div', 'preview');
  preview.id = 'preview';
  const av = el('div', 'pv-av'); av.textContent = PICK_AVATAR;
  preview.appendChild(av);
  const right = el('div');
  right.appendChild(el('div', 'pv-name', PICK_NAME || REP));
  right.appendChild(el('div', 'pv-title', PICK_TITLE || 'Add a title above'));
  right.appendChild(el('div', 'pv-rep', '@' + REP + ' · ' + BULLPEN));
  preview.appendChild(right);
  s.appendChild(preview);

  const actions = el('div', 'actions');
  actions.appendChild(el('div'));
  const next = el('button', 'next', 'Save + continue →');
  next.onclick = async () => {
    if(!PICK_NAME.trim()){ toast('Pick a display name', true); return; }
    next.disabled = true;
    try {
      await fetchJSON(bp('/members/' + encodeURIComponent(REP) + '/profile'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({display_name: PICK_NAME, avatar: PICK_AVATAR, title: PICK_TITLE})
      });
      await fetchJSON(bp('/onboarding/' + encodeURIComponent(REP) + '/step'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({step: 'identity'})
      });
      load();
    } catch(e){ toast(e.message, true); next.disabled = false; }
  };
  actions.appendChild(next);
  s.appendChild(actions);

  host.appendChild(s);
  nameIn.focus();
}

function updatePreview(){
  const p = $('preview');
  if(!p) return;
  const av = p.querySelector('.pv-av');
  if(av) av.textContent = PICK_AVATAR;
  const n  = p.querySelector('.pv-name');
  if(n) n.textContent = PICK_NAME || REP;
  const t  = p.querySelector('.pv-title');
  if(t) t.textContent = PICK_TITLE || 'Add a title above';
}

// ── STEP 2 · Briefing ──
function paintBriefing(){
  const host = $('step'); clear(host);
  const s = el('div', 'step');
  s.appendChild(el('h1', null, "What you're selling"));
  s.appendChild(el('p', 'sub', "30 seconds. Memorize the opener — you'll be saying it on the phone tomorrow."));

  const hero = el('div', 'b-hero');
  hero.appendChild(el('div', 'product', (BRIEFING?.product || 'Product')));
  hero.appendChild(el('div', 'why',
    'Built by ' + (BRIEFING?.founder || 'your founder') + '. '
    + (BRIEFING?.verticals_total_orgs || 0) + ' target accounts pre-loaded across '
    + (BRIEFING?.verticals_top?.length || 0) + ' verticals.'));
  s.appendChild(hero);

  if(BRIEFING?.opener){
    s.appendChild(el('div', 'opener', BRIEFING.opener));
  }

  if(BRIEFING?.verticals_top?.length){
    const v = el('div', 'field');
    v.appendChild(el('label', null, 'Who buys it'));
    const row = el('div', 'verticals-row');
    for(const vt of (BRIEFING.verticals_top.slice(0, 6))){
      const c = el('span', 'vert-chip', vt.name + ' (' + vt.count + ')');
      row.appendChild(c);
    }
    v.appendChild(row);
    s.appendChild(v);
  }

  if((BRIEFING?.house_accounts || []).length){
    const w = el('div', 'window-card');
    w.style.background = 'rgba(224,106,90,0.06)';
    w.style.borderColor = 'rgba(224,106,90,0.30)';
    w.style.color = '#f0a89d';
    w.appendChild(document.createTextNode('OFF-LIMITS — '));
    const strong = document.createElement('strong');
    strong.textContent = BRIEFING.house_accounts.length + ' house accounts';
    strong.style.color = '#fff';
    w.appendChild(strong);
    w.appendChild(document.createTextNode(' are off-limits. You can read the full list in the Briefing later.'));
    s.appendChild(w);
  }

  const actions = el('div', 'actions');
  const back = el('button', 'back', '← Back');
  back.onclick = () => paintIdentity();
  actions.appendChild(back);
  const next = el('button', 'next', "Got it — next →");
  next.onclick = async () => {
    next.disabled = true;
    try {
      await fetchJSON(bp('/onboarding/' + encodeURIComponent(REP) + '/step'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({step: 'briefing'})
      });
      load();
    } catch(e){ toast(e.message, true); next.disabled = false; }
  };
  actions.appendChild(next);
  s.appendChild(actions);

  host.appendChild(s);
}

// ── STEP 3 · Agreement ──
function paintAgreement(){
  const host = $('step'); clear(host);
  const s = el('div', 'step');
  s.appendChild(el('h1', null, 'Your commission'));
  s.appendChild(el('p', 'sub', "Here's the math on what you earn. Sign to confirm you've read it."));

  const rates = BRIEFING?.commission_rates || [];
  if(rates.length){
    const grid = el('div', 'rates-grid');
    const subMap = {
      'pilot':     "First pilot you originate",
      'expansion': "Add-on modules + scope",
      'renewal':   "Year 2 and beyond",
    };
    for(const r of rates){
      const card = el('div', 'rate-card');
      card.appendChild(el('div', 'pct', r.percent + '%'));
      const lbl = (r.label || '').toLowerCase();
      let pretty = lbl.includes('pilot') ? 'Pilot revenue'
                 : lbl.includes('expansion') ? 'Expansion revenue'
                 : lbl.includes('renewal') ? 'Renewal revenue'
                 : (r.label || 'Commission');
      card.appendChild(el('div', 'lbl', pretty));
      const subTxt = Object.entries(subMap).find(([k,_]) => lbl.includes(k))?.[1];
      if(subTxt) card.appendChild(el('div', 'sub', subTxt));
      grid.appendChild(card);
    }
    s.appendChild(grid);

    const win = el('div', 'window-card');
    win.appendChild(document.createTextNode('Commission window: '));
    const strong = document.createElement('strong');
    strong.textContent = '24 months per account';
    win.appendChild(strong);
    win.appendChild(document.createTextNode(
      ' from the first signed pilot. Paid monthly on collected revenue. '
      + 'Full terms below — read carefully.'));
    s.appendChild(win);
  } else {
    s.appendChild(el('div', 'empty',
      'No rate table parsed. Ask the founder to check legal/referral-agreement.md before you sign.'));
  }

  if(AGREEMENT?.body_md){
    const details = document.createElement('details');
    details.className = 'collapsible';
    const summary = document.createElement('summary');
    summary.textContent = '▸ Read the full agreement (' + AGREEMENT.body_md.length + ' chars)';
    details.appendChild(summary);
    const body = el('div', 'body', AGREEMENT.body_md);
    details.appendChild(body);
    s.appendChild(details);
  }

  const form = el('div', 'sig-form');
  form.appendChild(el('label', null, 'Type your full legal name to sign'));
  const sig = document.createElement('input');
  sig.placeholder = 'Type your full legal name';
  form.appendChild(sig);
  const legal = el('div', 'legal-line',
    "By typing your name above and clicking Sign, you agree that this constitutes your "
    + "binding electronic signature on the SALES COMMISSION AGREEMENT as of today's date. "
    + "Your signature is cryptographically bound to the document's content hash; if the "
    + "agreement changes, you'll be asked to re-sign.");
  form.appendChild(legal);
  s.appendChild(form);

  const actions = el('div', 'actions');
  const back = el('button', 'back', '← Back');
  back.onclick = () => paintBriefing();
  actions.appendChild(back);
  const sign = el('button', 'next gold', 'Sign + finish →');
  sign.onclick = async () => {
    const name = sig.value.trim();
    if(!name){ toast('Type your name to sign', true); return; }
    sign.disabled = true;
    try {
      await fetchJSON(bp('/legal/referral-agreement/sign'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rep: REP, typed_name: name})
      });
      await fetchJSON(bp('/onboarding/' + encodeURIComponent(REP) + '/step'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({step: 'agreement'})
      });
      load();
    } catch(e){ toast(e.message, true); sign.disabled = false; }
  };
  actions.appendChild(sign);
  s.appendChild(actions);

  host.appendChild(s);
  setTimeout(() => sig.focus(), 50);
}

// ── Final ──
function paintFinal(){
  const host = $('step'); clear(host);
  const s = el('div', 'step final');
  s.appendChild(el('div', 'check', '✓'));
  s.appendChild(el('h1', null, "You're in"));
  s.appendChild(el('p', 'you',
    "Display name set. Briefing read. Agreement signed. Your Top Pack is empty — drill the "
    + "Plays library when you've got 5 minutes. Otherwise, open Today and start working "
    + "your follow-ups."));
  const go = el('button', 'go', 'Open Today →');
  go.onclick = () => {
    location.href = '/app/today.html?b=' + encodeURIComponent(BULLPEN) + '&rep=' + encodeURIComponent(REP);
  };
  s.appendChild(go);
  host.appendChild(s);
}

// Heartbeat
(function(){
  function beat(){
    if(!REP) return;
    fetch(bp('/presence/beat'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rep: REP, page: 'welcome', status: 'in onboarding'}),
    }).catch(()=>{});
  }
  beat(); setInterval(beat, 20000);
})();

load();
</script>
