<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My identity · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=tanker@400&f%5B%5D=bespoke-serif@400,500,600,700&f%5B%5D=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/app/gate-banner.js" defer></script>
<style>
:root{--bg-0:#0a0703;--bg-1:#1a1208;--bg-2:#2a1d10;--bg-3:#3d2c1a;
  --text:#f5e8d8;--muted:#a89a87;--dim:#806a4f;
  --accent:#34d399;--accent-2:#6ee7b7;--accent-dim:#064e3b;
  --gold:#fbbf24;--gold-dim:#92400e;--danger:#f87171;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;
  --display:"Tanker",serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg-3) 0%,var(--bg-2) 35%,var(--bg-1) 70%,var(--bg-0) 100%);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
header{position:sticky;top:0;z-index:30;padding:14px 22px;display:flex;align-items:center;gap:18px;background:rgba(10,7,3,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(245,232,216,0.08)}
.brand{font-family:var(--display);font-size:22px;text-transform:uppercase;text-decoration:none;color:var(--text);letter-spacing:-.02em}
.brand .b{color:var(--gold)}.brand .lm{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}
.crumb .here{color:var(--accent-2)}
.wrap{max-width:900px;margin:0 auto;padding:30px 22px 80px}
h1{font-family:var(--display);font-size:48px;letter-spacing:-.02em;text-transform:uppercase;margin:0 0 8px;line-height:1}
.sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px;margin:0 0 30px;line-height:1.5;max-width:780px}
.panel{background:rgba(26,18,8,0.65);border:1px solid rgba(245,232,216,0.10);border-radius:12px;padding:20px 24px;margin-bottom:14px}
.panel h2{font-family:var(--display);font-size:22px;letter-spacing:-.01em;text-transform:uppercase;margin:0 0 14px;color:var(--text)}
.cert-row{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(245,232,216,0.06)}
.cert-row:last-child{border-bottom:none}
.cert-row .icon{font-size:18px;color:var(--accent)}
.cert-row .body{display:flex;flex-direction:column;gap:2px;min-width:0}
.cert-row .lbl{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:-.005em}
.cert-row .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cert-row .badge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:4px;background:rgba(52,211,153,0.10);color:var(--accent-2);border:1px solid rgba(52,211,153,0.30)}
.cert-row .badge.imported{background:rgba(251,191,36,0.08);color:var(--gold);border-color:rgba(251,191,36,0.30)}
.empty-cert{color:var(--muted);font-family:var(--serif);font-style:italic;padding:14px 0;text-align:center}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:10px 18px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block;border:1px solid var(--accent);background:rgba(52,211,153,0.10);color:var(--accent-2);transition:all .12s}
.btn:hover{background:var(--accent);color:#0a1a14}
.btn.gold{border-color:var(--gold);color:var(--gold);background:rgba(251,191,36,0.06)}
.btn.gold:hover{background:var(--gold);color:#0a1a14}
.btn.ghost{border-color:rgba(245,232,216,0.20);background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:11px 14px;background:rgba(0,0,0,0.30);border:1px solid rgba(245,232,216,0.15);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:14px}
.field input:focus{outline:none;border-color:var(--accent)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5}
.empty strong{font-family:var(--display);font-style:normal;font-size:22px;display:block;color:var(--text);text-transform:uppercase;margin-bottom:8px;letter-spacing:-.01em}
.status-msg{font-family:var(--mono);font-size:11px;color:var(--accent-2);margin-top:10px}
.status-msg.err{color:var(--danger)}
@media(max-width:540px){h1{font-size:36px}}
</style>
</head>
<body>
<header>
  <a href="/" class="brand"><span class="b">Bullpen</span><span class="lm">LM</span></a>
  <div class="crumb">
    <a href="/app/spawn.html">Floor</a> /
    <span class="here">My identity</span>
  </div>
</header>
<div class="wrap">
  <h1 id="hero-name">Identity</h1>
  <p class="sub">Your clearance certs live here. Submit them once in any bullpen on this host and they carry over to every bullpen you join. Export as a portable file to bring them to a friend's host.</p>

  <div id="profile-area"></div>
</div>

<script>
const URLP = new URL(window.location.href);
const BULLPEN = URLP.searchParams.get('b') || localStorage.getItem('bullpen-slug') || '';
let REP = URLP.searchParams.get('rep');
if(!REP){ try { REP = localStorage.getItem('bullpen-rep'); } catch(e){} }
REP = REP || 'self';

function el(t,p,...c){const n=document.createElement(t);if(p){for(const k in p){if(k==='class')n.className=p[k];else if(k==='onClick')n.addEventListener('click',p[k]);else if(k==='text')n.textContent=p[k];else if(k==='style')n.setAttribute('style',p[k]);else if(k==='href')n.setAttribute('href',p[k]);else n.setAttribute(k,p[k])}}for(const x of c){if(x==null)continue;n.appendChild(typeof x==='string'?document.createTextNode(x):x)}return n}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}

const CERT_LABELS = {
  disclosure:        ['Closer Disclosure', 'Plain-English summary of what BullpenLM is + isn\'t.'],
  closer_agreement:  ['Closer Agreement', 'Per-bullpen contract with commission terms.'],
  w9:                ['W-9', 'Tax form for the operator\'s 1099-NEC filing.'],
  dnc_ack:           ['DNC Acknowledgment', 'Telemarketing compliance.'],
  drill_cert_tier3:  ['Drill Cert (Tier 3+)', 'Passed a cert-tier drill — proves you can sell.'],
};

async function load(){
  const root = document.getElementById('profile-area');
  let email = null;
  try { email = localStorage.getItem('bullpen-email'); } catch(e){}

  // Resolve via the bullpen-scoped rep index if we don't have an email
  // stored locally
  let r;
  if(email){
    r = await fetch(`/api/closer/profile?email=${encodeURIComponent(email)}`);
  } else {
    r = await fetch(`/api/closer/profile?bullpen=${encodeURIComponent(BULLPEN)}&rep=${encodeURIComponent(REP)}`);
  }
  if(r.status === 404){
    renderEmpty(root);
    return;
  }
  if(!r.ok){
    renderError(root, 'Profile lookup failed.');
    return;
  }
  const d = await r.json();
  renderProfile(root, d, email);
}

function renderEmpty(root){
  clear(root);
  const stage = el('div', {class:'panel'});
  const e = el('div', {class:'empty'});
  e.appendChild(el('strong', {text:'No portable identity yet'}));
  e.appendChild(document.createTextNode('Add your email below to anchor a portable identity. Once you complete any clearance step (disclosure, W-9, drill cert), it\'ll show up here and carry to every other bullpen you join on this host.'));
  stage.appendChild(e);

  // Quick form to link email to current (bullpen, rep)
  const f = el('div', {style:'max-width:420px;margin:18px auto 0'});
  f.appendChild(el('div', {class:'field'},
    el('label', {text:'Your email'}),
    el('input', {id:'link-email', type:'email', placeholder:'you@example.com',
                  autocomplete:'email', inputmode:'email'}),
  ));
  const btn = el('button', {class:'btn', text:'Link email →', onClick: () => linkEmail()});
  f.appendChild(btn);
  f.appendChild(el('div', {class:'status-msg', id:'link-status'}));
  stage.appendChild(f);
  root.appendChild(stage);
}

function renderError(root, msg){
  clear(root);
  root.appendChild(el('div', {class:'panel', text: msg}));
}

function renderProfile(root, d, email){
  clear(root);
  document.getElementById('hero-name').textContent = (d.display_name || REP).toUpperCase();

  // ── Certs panel ───────────────────────────────────────────────
  const certs = el('div', {class:'panel'});
  certs.appendChild(el('h2', {text:'Your clearances'}));
  const certKeys = ['disclosure', 'closer_agreement', 'w9', 'dnc_ack', 'drill_cert_tier3'];
  const present = d.certs || {};
  let any = false;
  for(const k of certKeys){
    if(!present[k]) continue;
    any = true;
    const c = present[k];
    const [label, blurb] = CERT_LABELS[k] || [k, ''];
    const row = el('div', {class:'cert-row'});
    row.appendChild(el('div', {class:'icon', text:'✓'}));
    const body = el('div', {class:'body'});
    body.appendChild(el('div', {class:'lbl', text: label}));
    body.appendChild(el('div', {class:'meta', text:
      `${c.at ? c.at.replace('T',' ').slice(0,16) : 'unknown'} · in ${c.bullpen || '?'}`
      + (c.carried_from ? ` · imported from ${c.carried_from}` : '')}));
    row.appendChild(body);
    const badge = c.carried_from ? 'imported' : 'cleared';
    row.appendChild(el('div', {class: 'badge' + (c.carried_from ? ' imported' : ''), text: badge}));
    certs.appendChild(row);
  }
  if(!any){
    certs.appendChild(el('div', {class:'empty-cert', text:'No clearances yet. Finish disclosure, agreement, W-9 or pass a Tier-3 drill in any bullpen to start populating this.'}));
  }
  root.appendChild(certs);

  // ── Aliases panel ─────────────────────────────────────────────
  if((d.rep_slugs || []).length){
    const aliases = el('div', {class:'panel'});
    aliases.appendChild(el('h2', {text:'You go by'}));
    const list = el('div', {style:'font-family:var(--mono);font-size:12px;color:var(--accent-2);letter-spacing:.04em'});
    list.textContent = d.rep_slugs.join('  ·  ');
    aliases.appendChild(list);
    root.appendChild(aliases);
  }

  // ── Portability panel ─────────────────────────────────────────
  const port = el('div', {class:'panel'});
  port.appendChild(el('h2', {text:'Portability'}));
  const blurb = el('p', {style:'font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 14px'});
  blurb.textContent = 'Download your clearance bundle to bring it to a friend\'s host. The receiving operator decides whether to trust the bundle as-is or ask for fresh signatures.';
  port.appendChild(blurb);
  const actions = el('div', {class:'action-row'});
  if(email){
    actions.appendChild(el('a', {class:'btn gold', href:`/api/closer/profile/export?email=${encodeURIComponent(email)}`, text:'⬇ Download bundle', download:''}));
  }
  actions.appendChild(el('button', {class:'btn ghost', text:'⬆ Import bundle…', onClick: importBundle}));
  port.appendChild(actions);
  port.appendChild(el('div', {class:'status-msg', id:'port-status'}));
  root.appendChild(port);
}

async function linkEmail(){
  const email = (document.getElementById('link-email').value || '').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    document.getElementById('link-status').className = 'status-msg err';
    document.getElementById('link-status').textContent = 'That email doesn\'t look right';
    return;
  }
  try {
    const r = await fetch('/api/closer/link-email', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({bullpen: BULLPEN, rep: REP, email, display_name: REP}),
    });
    const d = await r.json();
    if(!r.ok){ throw new Error(d.error || 'failed'); }
    try { localStorage.setItem('bullpen-email', email); } catch(e){}
    document.getElementById('link-status').textContent = `✓ Linked. ${d.carried_certs.length ? d.carried_certs.length + ' clearances carried over' : 'Profile created.'}`;
    setTimeout(() => load(), 600);
  } catch(e){
    document.getElementById('link-status').className = 'status-msg err';
    document.getElementById('link-status').textContent = `Failed: ${e.message}`;
  }
}

async function importBundle(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    if(!file) return;
    const text = await file.text();
    let bundle;
    try { bundle = JSON.parse(text); }
    catch(e){
      document.getElementById('port-status').className = 'status-msg err';
      document.getElementById('port-status').textContent = 'Not valid JSON.';
      return;
    }
    let email = '';
    try { email = localStorage.getItem('bullpen-email') || ''; } catch(e){}
    if(!email){
      email = (prompt('Enter the email this bundle belongs to:') || '').trim().toLowerCase();
      if(!email) return;
    }
    try {
      const r = await fetch('/api/closer/import-bundle', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email, bundle}),
      });
      const d = await r.json();
      if(!r.ok){ throw new Error(d.error || 'import failed'); }
      try { localStorage.setItem('bullpen-email', email); } catch(e){}
      document.getElementById('port-status').textContent = `✓ Imported. ${d.carried_certs.length} clearance${d.carried_certs.length===1?'':'s'} now carry over.`;
      setTimeout(() => load(), 800);
    } catch(e){
      document.getElementById('port-status').className = 'status-msg err';
      document.getElementById('port-status').textContent = `Import failed: ${e.message}`;
    }
  };
  inp.click();
}

load();
</script>
</body>
</html>
