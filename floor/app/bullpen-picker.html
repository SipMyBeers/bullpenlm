<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a bullpen · BullpenLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=tanker@400&f%5B%5D=bespoke-serif@400,500,600,700&f%5B%5D=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/app/embed-mode.js"></script>
<style>
:root{
  --bg-0:#0a0703; --bg-1:#1a1208; --bg-2:#2a1d10; --bg-3:#3d2c1a;
  --text:#f5e8d8; --muted:#a89a87; --dim:#806a4f;
  --accent:#34d399; --gold:#fbbf24; --gold-dim:#92400e;
  --purple:#a78bfa;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Switzer",-apple-system,sans-serif;
  --serif:"Bespoke Serif",Georgia,serif;
  --display:"Tanker",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:var(--bg-0);color:var(--text);font-family:var(--sans);font-size:14px}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg-3) 0%,var(--bg-2) 35%,var(--bg-1) 70%,var(--bg-0) 100%)}
.wrap{max-width:920px;margin:0 auto;padding:64px 24px}
.brand{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:-.02em;text-decoration:none;color:var(--text);display:inline-flex;align-items:baseline;margin-bottom:34px}
.brand .b{color:var(--gold)} .brand .lm{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
h1{font-family:var(--display);font-size:52px;letter-spacing:-.02em;text-transform:uppercase;margin:0 0 12px;line-height:.96}
.lede{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:18px;line-height:1.5;margin:0 0 36px;max-width:600px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{position:relative;display:block;padding:22px 22px 18px;background:rgba(245,232,216,0.04);border:1.5px solid rgba(245,232,216,0.10);border-radius:11px;text-decoration:none;color:var(--text);cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
.card:hover{transform:translateY(-2px);border-color:var(--gold);background:rgba(251,191,36,0.06)}
.card .slug{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card .name{font-family:var(--display);font-size:22px;letter-spacing:-.01em;text-transform:uppercase;margin:0 0 6px;color:var(--text)}
.card .mode{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13px}
.card .enter{position:absolute;top:18px;right:20px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);opacity:0;transition:opacity .14s}
.card:hover .enter{opacity:1}
.card.new{background:rgba(167,139,250,0.05);border-color:rgba(167,139,250,0.25);border-style:dashed}
.card.new:hover{background:rgba(167,139,250,0.10);border-color:var(--purple)}
.card.new .name{color:var(--purple)}
.empty{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;padding:30px 0}
.hint{margin-top:34px;font-family:var(--mono);font-size:11px;letter-spacing:.10em;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="brand"><span class="b">Bullpen</span><span class="lm">LM</span></a>
  <div class="eyebrow">OPERATOR · PICK A FLOOR</div>
  <h1>Which bullpen?</h1>
  <p class="lede">You've got more than one floor up. Pick the one to walk into — or start a fresh bullpen for a new product line.</p>

  <div class="grid" id="grid">
    <div class="empty">Loading…</div>
  </div>

  <div class="hint">Each bullpen has its own roster, CRM, deal pipeline, and RAG corpus. They're sandboxed on disk under <code>bullpens/&lt;slug&gt;/</code>.</div>
</div>

<script>
async function load() {
  const grid = document.getElementById('grid');
  let bps = [];
  try {
    const r = await fetch('/api/bullpens');
    if (r.ok) {
      const d = await r.json();
      bps = d.bullpens || d || [];
    }
  } catch(e) {}

  while (grid.firstChild) grid.removeChild(grid.firstChild);

  if (!bps.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'No bullpens yet. Start one to begin.';
    grid.appendChild(e);
  } else {
    for (const bp of bps) {
      const slug = (typeof bp === 'string') ? bp : bp.slug;
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `/app/office.html?b=${encodeURIComponent(slug)}&rep=self`;
      card.addEventListener('click', () => {
        try { localStorage.setItem('bullpen-slug', slug); } catch(_) {}
      });
      const s = document.createElement('div'); s.className = 'slug'; s.textContent = '◆ ' + slug;
      const n = document.createElement('div'); n.className = 'name';
      n.textContent = (bp.display_name) || slug.replace(/-/g, ' ');
      const m = document.createElement('div'); m.className = 'mode';
      const mode = (bp.profile && bp.profile.mode) || (bp.config && bp.config.profile && bp.config.profile.mode) || 'unset';
      const industry = (bp.profile && (bp.profile.industry || bp.profile.custom_industry)) || (bp.config && bp.config.profile && (bp.config.profile.industry || bp.config.profile.custom_industry)) || '';
      m.textContent = industry ? `${mode} · ${industry}` : mode;
      const e = document.createElement('div'); e.className = 'enter'; e.textContent = 'ENTER →';
      card.appendChild(s); card.appendChild(n); card.appendChild(m); card.appendChild(e);
      grid.appendChild(card);
    }
  }

  // Start-a-new-bullpen card always at the end
  const fresh = document.createElement('a');
  fresh.className = 'card new';
  fresh.href = '/app/setup/start/';
  const fs = document.createElement('div'); fs.className = 'slug'; fs.textContent = '◆ NEW FLOOR';
  const fn = document.createElement('div'); fn.className = 'name'; fn.textContent = '+ Start a bullpen';
  const fm = document.createElement('div'); fm.className = 'mode'; fm.textContent = 'For a new product, vertical, or team';
  fresh.appendChild(fs); fresh.appendChild(fn); fresh.appendChild(fm);
  grid.appendChild(fresh);
}
load();
</script>
</body>
</html>
