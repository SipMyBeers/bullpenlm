<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KillSesh · Sales Floor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ─── Crowds-system palette: warm earth-tones, plaza stone ─── */
  :root {
    --bg-0:#1a1208; --bg-1:#2a1d10; --bg-2:#3d2c1a;
    --plaza:#5a4630; --plaza-2:#6a5640; --plaza-3:#4a3622; --plaza-4:#7a6a50;
    --ink:#1a0f06;
    --text:#f5e8d8; --muted:#a89a87;
    --end:#fbbf24; --channel:#22d3ee; --tool:#a78bfa; --boutique:#34d399;
    --accent:#34d399; --accent-2:#6ee7b7; --accent-dim:#064e3b;
    --danger:#f87171; --warn:#fbbf24;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    --serif:"Fraunces",ui-serif,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, var(--bg-2) 0%, var(--bg-1) 50%, var(--bg-0) 100%);
    color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:10px 20px; border-bottom:1px solid rgba(245,232,216,0.08);
    display:flex; align-items:baseline; justify-content:space-between; gap:18px;
    background:rgba(26,18,8,0.85); backdrop-filter:blur(8px); position:relative; z-index:10;
  }
  header .brand{font-family:var(--serif); font-weight:600; font-size:17px; letter-spacing:-.005em; color:var(--text)}
  header .brand .accent{color:var(--accent)}
  header .meta{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; display:flex; gap:18px; align-items:baseline}
  header .meta .legend{display:inline-flex; align-items:center; gap:6px}
  header .meta .legend .dot{width:8px; height:8px; border-radius:50%; display:inline-block}
  .legend.end .dot{background:var(--end)}
  .legend.channel .dot{background:var(--channel)}
  .legend.tool .dot{background:var(--tool)}
  .legend.boutique .dot{background:var(--boutique)}
  .stage{position:fixed; inset:48px 0 0 0; width:100vw; cursor:crosshair}
  canvas{display:block; width:100%; height:100%; cursor:crosshair}

  .tooltip{
    position:fixed; pointer-events:none; z-index:5; display:none;
    background:rgba(26,18,8,0.96); border:1px solid rgba(245,232,216,0.12); border-left-width:3px;
    border-radius:4px; padding:8px 11px; font-family:var(--mono); font-size:11px; color:var(--text);
    white-space:nowrap; box-shadow:0 10px 30px -6px rgba(0,0,0,0.9);
  }
  .tooltip .co{font-family:var(--sans); font-weight:600; font-size:13px; display:block; margin-bottom:2px; color:#fff}
  .tooltip .ro{color:var(--muted); font-size:10px; display:block; margin-bottom:4px}
  .tooltip .stat{color:var(--accent); font-size:10px; letter-spacing:.12em}
  .tooltip.end{border-left-color:var(--end)}
  .tooltip.channel{border-left-color:var(--channel)}
  .tooltip.tool{border-left-color:var(--tool)}
  .tooltip.boutique{border-left-color:var(--boutique)}

  .hud{
    position:fixed; left:16px; bottom:16px; z-index:5;
    font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase;
    background:rgba(26,18,8,0.85); padding:8px 12px; border:1px solid rgba(245,232,216,0.10); border-radius:3px;
    backdrop-filter:blur(8px);
  }
  .hud kbd{display:inline-block; font-family:var(--mono); background:rgba(245,232,216,0.10); padding:1px 6px; border-radius:2px; font-size:9.5px; color:var(--text); margin:0 3px}

  /* ─── Dossier modal (unchanged business logic, restyled to plaza palette) ─── */
  .focus{position:fixed; inset:0; z-index:1000; background:rgba(10,7,3,0.96); backdrop-filter:blur(14px); display:none; overflow-y:auto; padding:24px; animation:fadeIn .18s ease}
  .focus.open{display:block}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .focus-bar{position:sticky; top:-24px; margin:-24px -24px 16px; padding:10px 24px; background:rgba(26,18,8,0.97); border-bottom:1px solid rgba(245,232,216,0.10); display:flex; justify-content:space-between; align-items:center; z-index:10}
  .focus-bar .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; color:var(--accent); text-transform:uppercase}
  .focus-bar .crumb::before{content:"● "; color:var(--accent)}
  .focus-close{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding:6px 12px; background:rgba(248,113,113,0.10); border:1px solid #4a1818; color:#fca5a5; border-radius:3px; cursor:pointer}
  .focus-close:hover{background:var(--danger); color:#fff}
  .focus-close .kbd{display:inline-block; margin-left:6px; padding:1px 5px; background:rgba(255,255,255,0.08); border-radius:2px; font-size:9.5px; color:var(--muted)}
  .focus-grid{max-width:1240px; margin:0 auto; display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start}
  @media(max-width:960px){.focus-grid{grid-template-columns:1fr}}
  .card{background:rgba(42,29,16,0.92); border:1px solid rgba(245,232,216,0.10); border-radius:8px; padding:22px 24px}
  .card.identity{border-top:3px solid var(--accent)}
  .card.identity.end{border-top-color:var(--end)}
  .card.identity.channel{border-top-color:var(--channel)}
  .card.identity.tool{border-top-color:var(--tool)}
  .card.identity.boutique{border-top-color:var(--boutique)}
  .ident-head{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
  .ident-name{font-family:var(--serif); font-size:30px; font-weight:600; color:#fff; letter-spacing:-.01em; line-height:1.15}
  .ident-role{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:14px}
  /* ─── BIO CARD ─── person-first layout ─── */
  .bio-hero{display:grid; grid-template-columns:88px 1fr; gap:18px; align-items:start; margin-bottom:18px}
  .bio-avatar{width:88px; height:104px; background:rgba(26,18,8,0.7); border:1px solid rgba(245,232,216,0.12); border-radius:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative}
  .bio-avatar canvas{display:block}
  .bio-avatar.no-name::after{content:"role"; position:absolute; bottom:4px; right:6px; font-family:var(--mono); font-size:8.5px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase}
  .bio-meta{min-width:0}
  .bio-name{font-family:var(--serif); font-size:28px; font-weight:600; color:#fff; letter-spacing:-.01em; line-height:1.1; margin:0 0 4px}
  .bio-name.role-only{font-size:22px; color:var(--text); font-weight:500; font-style:italic}
  .bio-role{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:6px}
  .bio-at{font-size:13px; color:#dcdcdc; margin-bottom:6px}
  .bio-at .at{color:var(--muted); margin:0 4px}
  .bio-at .co{color:#fff; font-weight:500}
  .bio-where{font-family:var(--mono); font-size:10.5px; letter-spacing:.10em; color:var(--muted); text-transform:uppercase}
  .bio-body{margin:14px 0 18px; padding:14px 16px; background:rgba(26,18,8,0.50); border-left:3px solid rgba(245,232,216,0.10); border-radius:0 4px 4px 0}
  .bio-body.end{border-left-color:var(--end)}
  .bio-body.channel{border-left-color:var(--channel)}
  .bio-body.tool{border-left-color:var(--tool)}
  .bio-body.boutique{border-left-color:var(--boutique)}
  .bio-body p{margin:0; font-family:var(--serif); font-size:14.5px; line-height:1.65; color:#e6dccc; font-style:italic}
  .bio-section-h{font-family:var(--mono); font-size:10px; letter-spacing:.20em; color:var(--muted); text-transform:uppercase; margin:18px 0 8px}
  /* ─── Status panel (editable, inside dossier) ─── */
  .status-panel{margin:14px 0 0; padding:14px 16px; background:rgba(26,18,8,0.65); border:1px solid rgba(245,232,216,0.10); border-radius:6px}
  .status-panel h4{font-family:var(--mono); font-size:10px; letter-spacing:.20em; color:var(--accent); text-transform:uppercase; margin:0 0 10px}
  .status-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; margin-bottom:10px}
  .status-opt{display:flex; align-items:center; gap:8px; padding:7px 10px; background:#0d0d0d; border:1px solid var(--border, rgba(245,232,216,0.10)); border-radius:4px; cursor:pointer; transition:all .12s; font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--text); text-align:left}
  .status-opt:hover{border-color:rgba(245,232,216,0.30); background:rgba(26,18,8,0.85)}
  .status-opt.active{border-color:currentColor; background:rgba(255,255,255,0.05); box-shadow:inset 0 0 0 1px currentColor}
  .status-opt .badge-dot{width:10px; height:10px; border-radius:50%; background:currentColor; flex-shrink:0; box-shadow:0 0 8px currentColor}
  .status-opt .badge-label{flex:1}
  .status-opt[data-s="cold"]{color:#9ca3af}
  .status-opt[data-s="sent"]{color:#60a5fa}
  .status-opt[data-s="voicemail"]{color:#fbbf24}
  .status-opt[data-s="gatekeeper"]{color:#f59e0b}
  .status-opt[data-s="connected"]{color:#22d3ee}
  .status-opt[data-s="qualified"]{color:#34d399}
  .status-opt[data-s="discovery"]{color:#6ee7b7}
  .status-opt[data-s="proposal"]{color:#10b981}
  .status-opt[data-s="signed"]{color:#fde047}
  .status-opt[data-s="disqualified"]{color:#f87171}
  .meeting-input{display:flex; gap:6px; margin-top:8px}
  .meeting-input input{flex:1; background:#0d0d0d; color:#fff; border:1px solid rgba(245,232,216,0.15); border-radius:3px; padding:7px 10px; font-family:var(--mono); font-size:12px; color-scheme:dark}
  .meeting-input input:focus{outline:none; border-color:var(--accent)}
  .note-input{margin-top:8px}
  .note-input textarea{width:100%; resize:vertical; min-height:48px; background:#0d0d0d; color:#fff; border:1px solid rgba(245,232,216,0.15); border-radius:3px; padding:7px 10px; font-family:var(--serif); font-size:13px; line-height:1.5}
  .note-input textarea:focus{outline:none; border-color:var(--accent)}
  .save-row{display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px}
  .save-row .hint{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
  .save-btn{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; padding:7px 14px; background:rgba(52,211,153,0.15); color:var(--accent); border:1px solid var(--accent-dim); border-radius:3px; cursor:pointer}
  .save-btn:hover{background:rgba(52,211,153,0.25)}
  .save-btn.saved{background:var(--accent); color:#0d0d0d}
  /* ─── HUD legend strip ─── */
  .hud-legend{position:fixed; right:16px; bottom:16px; z-index:5; background:rgba(26,18,8,0.85); backdrop-filter:blur(8px); border:1px solid rgba(245,232,216,0.10); border-radius:3px; padding:8px 12px; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; display:flex; gap:14px; align-items:center; flex-wrap:wrap; max-width:calc(100vw - 380px)}
  .hud-legend .li{display:inline-flex; align-items:center; gap:5px}
  .hud-legend .li .d{width:7px; height:7px; border-radius:50%; box-shadow:0 0 4px currentColor}
  .hud-legend .li[data-s="cold"]{color:#9ca3af}
  .hud-legend .li[data-s="sent"]{color:#60a5fa}
  .hud-legend .li[data-s="voicemail"],.hud-legend .li[data-s="gatekeeper"]{color:#fbbf24}
  .hud-legend .li[data-s="qualified"]{color:#34d399}
  .hud-legend .li[data-s="discovery"]{color:#6ee7b7}
  .hud-legend .li[data-s="signed"]{color:#fde047}
  .hud-legend .li[data-s="disqualified"]{color:#f87171}
  .hud-legend .li .d{background:currentColor}
  .ident-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .pill{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; border-radius:2px; border:1px solid currentColor; background:rgba(255,255,255,0.03)}
  .pill.end{color:var(--end)} .pill.channel{color:var(--channel)} .pill.tool{color:var(--tool)} .pill.boutique{color:var(--boutique)}
  .pill.status{color:var(--muted)}
  .phone-btn{display:block; text-align:center; font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:.02em; color:var(--accent); background:rgba(52,211,153,0.10); border:1px solid var(--accent-dim); padding:14px 18px; border-radius:5px; text-decoration:none; margin:8px 0 14px; transition:all .12s}
  .phone-btn:hover{background:rgba(52,211,153,0.20); color:var(--accent-2)}
  .row{display:flex; gap:14px; padding:8px 0; border-bottom:1px dashed rgba(245,232,216,0.08); font-size:13.5px; line-height:1.55}
  .row:last-child{border-bottom:0}
  .row .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; flex-shrink:0; width:96px; padding-top:2px}
  .row .v{flex:1; color:#dcdcdc}
  .row .v a{color:var(--accent); text-decoration:none}
  .row .v a:hover{text-decoration:underline}
  .row .v code{background:rgba(255,255,255,0.04); padding:1px 5px; border-radius:2px; font-size:12px; color:var(--accent)}
  .row .v ul{margin:0; padding-left:18px}
  .row .v ul li{margin:2px 0; font-size:13px}
  .meta-side h3{font-family:var(--serif); font-size:18px; font-weight:600; color:#fff; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid rgba(245,232,216,0.10)}
  .meta-side h4{font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--accent); text-transform:uppercase; margin:18px 0 8px}
  .abc-block{background:rgba(26,18,8,0.75); border:1px solid rgba(245,232,216,0.08); border-left:3px solid var(--accent); border-radius:4px; padding:10px 14px; margin-bottom:8px}
  .abc-block .label{font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--accent); text-transform:uppercase; margin-bottom:4px; display:block}
  .abc-block .text{font-family:var(--serif); font-size:14.5px; color:#dcdcdc; line-height:1.55; margin:0}
  .abc-block.b{border-left-color:var(--channel)}
  .abc-block.b .label{color:var(--channel)}
  .abc-block.c{border-left-color:var(--warn)}
  .abc-block.c .label{color:var(--warn)}
  .practice-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; padding:13px 18px; background:linear-gradient(180deg,rgba(52,211,153,0.20) 0%,rgba(52,211,153,0.10) 100%); border:1px solid var(--accent); color:var(--accent); border-radius:5px; text-decoration:none; cursor:pointer; margin-top:14px; transition:all .15s}
  .practice-btn:hover{background:rgba(52,211,153,0.30); color:#fff; border-color:var(--accent-2)}
  .focus-actions{display:grid; grid-template-columns:1fr; gap:8px; margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="brand">KillSesh <span class="accent">·</span> Sales Floor</div>
  <div class="meta">
    <span>2026-05-22 · 24 prospects</span>
    <span class="legend end"><span class="dot"></span>End Customer</span>
    <span class="legend channel"><span class="dot"></span>Channel</span>
    <span class="legend tool"><span class="dot"></span>Tool</span>
    <span class="legend boutique"><span class="dot"></span>Boutique</span>
  </div>
</header>

<div class="stage">
  <canvas id="floor"></canvas>
  <div class="tooltip" id="tt"></div>
  <div class="hud">
    Hover to inspect · Click to open dossier · <kbd>Esc</kbd> close · <kbd>1</kbd>-<kbd>4</kbd> filter zone
  </div>
  <div class="hud-legend" id="hud-legend">
    <span class="li" data-s="cold"><span class="d"></span>Cold</span>
    <span class="li" data-s="sent"><span class="d"></span>Sent</span>
    <span class="li" data-s="voicemail"><span class="d"></span>VM</span>
    <span class="li" data-s="gatekeeper"><span class="d"></span>Gatekeeper</span>
    <span class="li" data-s="qualified"><span class="d"></span>Qualified</span>
    <span class="li" data-s="discovery"><span class="d"></span>Briefing booked</span>
    <span class="li" data-s="signed"><span class="d"></span>Signed</span>
    <span class="li" data-s="disqualified"><span class="d"></span>Disqualified</span>
  </div>
</div>

<!-- ─── Dossier modal ─── -->
<div class="focus" id="focus" role="dialog" aria-modal="true">
  <div class="focus-bar">
    <span class="crumb" id="crumb">Prospect</span>
    <button class="focus-close" data-close>✕ Close <span class="kbd">Esc</span></button>
  </div>
  <div class="focus-grid">
    <div class="card identity" id="ident"></div>
    <aside class="card meta-side" id="meta"></aside>
  </div>
</div>

<script>

const ZONE_NAME  = { end:"End Customer", channel:"Channel Partner", tool:"Tool Partner", boutique:"Boutique / Staffing" };
const ZONE_SHIRT = { end:"#fbbf24", channel:"#22d3ee", tool:"#a78bfa", boutique:"#34d399" };
const ZONE_TINT  = { end:"#fbbf24", channel:"#22d3ee", tool:"#a78bfa", boutique:"#34d399" };

/* ────────────────────────────────────────────────────────────────────────
   PIPELINE STATUS — head-badge + behavior + persistence
   ─────────────────────────────────────────────────────────────────────── */
const STATUSES = {
  cold:         { color:"#9ca3af", label:"Cold",          glyph:"·" },
  sent:         { color:"#60a5fa", label:"Sent",          glyph:"✉" },
  voicemail:    { color:"#fbbf24", label:"Voicemail",     glyph:"VM" },
  gatekeeper:   { color:"#f59e0b", label:"Gatekeeper",    glyph:"GK" },
  connected:    { color:"#22d3ee", label:"Connected",     glyph:"✓" },
  qualified:    { color:"#34d399", label:"Qualified",     glyph:"Q" },
  discovery:    { color:"#6ee7b7", label:"Briefing booked", glyph:"📅" },
  proposal:     { color:"#10b981", label:"SOW sent",      glyph:"$" },
  signed:       { color:"#fde047", label:"Signed",        glyph:"★" },
  disqualified: { color:"#f87171", label:"Disqualified",  glyph:"✕" },
};
const STATUS_ORDER = ["cold","sent","voicemail","gatekeeper","connected","qualified","discovery","proposal","signed","disqualified"];
const STORAGE_KEY = "killsesh-floor-state-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn("localStorage save failed:", e); }
}
let pipelineState = loadState();

function getProspectState(slug) {
  if (!pipelineState[slug]) {
    pipelineState[slug] = { status:"cold", meeting:"", note:"", updated:null };
  }
  return pipelineState[slug];
}
function setProspectState(slug, patch) {
  const cur = getProspectState(slug);
  Object.assign(cur, patch, { updated: new Date().toISOString() });
  saveState(pipelineState);
  // Refresh the agent's state so the floor reflects it instantly
  const a = agents.find(x => x.slug === slug);
  if (a) a.state = cur;
}

function fmtMeeting(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const hr = d.getHours(), min = d.getMinutes();
  const h12 = ((hr + 11) % 12) + 1;
  const ampm = hr >= 12 ? "p" : "a";
  const mm = min === 0 ? "" : ":" + String(min).padStart(2,"0");
  return `${days[d.getDay()]} ${h12}${mm}${ampm}`;
}

/* ────────────────────────────────────────────────────────────────────────
   CROWDS-STYLE RENDERER — warm plaza, walking characters, drop shadows,
   sliced-sprite gait. Matches boona13/crowds-system-js aesthetic.
   ─────────────────────────────────────────────────────────────────────── */
const canvas = document.getElementById("floor");
const ctx = canvas.getContext("2d");
const tt = document.getElementById("tt");

let plazaTile = null;          // offscreen canvas with the procedural plaza texture
let zoneFilter = null;
let hover = null;
let lastT = performance.now();

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(r.width * dpr);
  canvas.height = Math.floor(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildPlazaTile();
  layoutAgents();
}
window.addEventListener("resize", resize);

/* ─── Plaza floor: procedural 256×256 tile, base #5a4630 + warm flecks ─── */
function buildPlazaTile() {
  plazaTile = document.createElement("canvas");
  plazaTile.width = 256; plazaTile.height = 256;
  const c = plazaTile.getContext("2d");
  c.fillStyle = "#5a4630"; c.fillRect(0, 0, 256, 256);

  // Scatter warm accent flecks — recreates the crowds-js plaza look.
  const accents = ["#6a5640", "#4a3622", "#7a6a50", "#3a2818", "#806848", "#473123"];
  for (let i = 0; i < 1800; i++) {
    c.fillStyle = accents[Math.floor(Math.random() * accents.length)];
    const x = Math.floor(Math.random() * 256);
    const y = Math.floor(Math.random() * 256);
    const w = 1 + Math.floor(Math.random() * 3);
    const h = 1 + Math.floor(Math.random() * 3);
    c.fillRect(x, y, w, h);
  }
  // A few darker stones for variation
  c.globalAlpha = 0.4;
  for (let i = 0; i < 60; i++) {
    c.fillStyle = "#2a1d10";
    const x = Math.floor(Math.random() * 256);
    const y = Math.floor(Math.random() * 256);
    c.fillRect(x, y, 2 + Math.floor(Math.random() * 4), 1 + Math.floor(Math.random() * 3));
  }
  c.globalAlpha = 1;
}

/* ─── Zone quadrants ─── */
function zoneBounds(zone) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const padX = 70, padY = 80;
  const mw = (w - padX * 3) / 2, mh = (h - padY * 3) / 2;
  const cells = {
    end:      { x: padX,            y: padY,            w: mw, h: mh },
    channel:  { x: padX*2 + mw,     y: padY,            w: mw, h: mh },
    tool:     { x: padX,            y: padY*2 + mh,     w: mw, h: mh },
    boutique: { x: padX*2 + mw,     y: padY*2 + mh,     w: mw, h: mh },
  };
  return cells[zone];
}

/* ─── Agents: walking pedestrians, one per prospect ─── */
const agents = [];

function rand(min, max) { return min + Math.random() * (max - min); }

function newTargetIn(b, padding = 30) {
  return {
    x: b.x + padding + Math.random() * (b.w - padding * 2),
    y: b.y + padding + Math.random() * (b.h - padding * 2),
  };
}

function layoutAgents() {
  agents.length = 0;
  const skinTones = ["#f5d7a8", "#e8c089", "#d4a574", "#b88e5a", "#8b6f47", "#6e553a"];
  const hairTones = ["#1a0e08", "#2a1810", "#4a3022", "#6e5234", "#8a7050", "#a89878"];

  const byZone = {};
  for (const p of PROSPECTS) { byZone[p.zone] = byZone[p.zone] || []; byZone[p.zone].push(p); }

  for (const [zone, list] of Object.entries(byZone)) {
    const b = zoneBounds(zone);
    if (!b) continue;
    for (const p of list) {
      const start = newTargetIn(b);
      agents.push({
        slug: p.slug, prospect: p, zone,
        x: start.x, y: start.y,
        target: newTargetIn(b),
        speed: rand(22, 38),          // px/sec
        phase: Math.random() * Math.PI * 2,
        facing: "down",               // up/down/left/right — drives draw orientation
        idleTimer: 0,
        zoneBounds: b,
        skin: skinTones[Math.floor(Math.random() * skinTones.length)],
        hair: hairTones[Math.floor(Math.random() * hairTones.length)],
        shirt: ZONE_SHIRT[zone],
        scale: rand(0.95, 1.08),
        strideSpeed: rand(8.5, 11),
        state: getProspectState(p.slug),
      });
    }
  }
}

/* ─── Walking behavior — wander, with status-driven flavor ─── */
function stepAgent(a, dt) {
  const status = a.state?.status || "cold";
  // Disqualified prospects stand still (slumped). Signed ones idle longer (taking it easy).
  if (status === "disqualified") {
    a.idleTimer = 5;  // perpetually idle
    return;
  }
  if (a.idleTimer > 0) {
    a.idleTimer -= dt;
    return;
  }
  const dx = a.target.x - a.x;
  const dy = a.target.y - a.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 2) {
    // Status flavors the idle pause: hot prospects pace, cold ones linger.
    let idle;
    if (status === "discovery" || status === "proposal") idle = rand(0.1, 0.6);  // pacing
    else if (status === "signed") idle = rand(1.5, 3.5);  // relaxed
    else idle = rand(0.4, 1.8);
    a.idleTimer = idle;
    a.target = newTargetIn(a.zoneBounds);
    return;
  }
  // Hot prospects walk a touch faster
  const speedMul = (status === "discovery" || status === "proposal") ? 1.25
                 : (status === "qualified") ? 1.10
                 : 1.0;
  const step = a.speed * speedMul * dt;
  a.x += (dx / dist) * step;
  a.y += (dy / dist) * step;
  if (Math.abs(dx) > Math.abs(dy)) a.facing = dx > 0 ? "right" : "left";
  else                              a.facing = dy > 0 ? "down" : "up";
}

/* ─── Draw a single character — procedural sprite in crowds-js style ─── */
function drawAgent(a, t) {
  const s = a.scale;
  const status = a.state?.status || "cold";
  const statusCfg = STATUSES[status] || STATUSES.cold;
  const disqualified = status === "disqualified";
  const slumped = disqualified;
  const moving = a.idleTimer <= 0 && !slumped;
  const gait = moving ? Math.sin(t * a.strideSpeed * 0.001 + a.phase) : 0;
  const bob = moving ? Math.abs(gait) * 1.2 : 0;

  ctx.save();
  ctx.translate(a.x, a.y - bob);
  if (slumped) ctx.globalAlpha = 0.55;  // disqualified prospects look gray/withdrawn

  // Halo for signed prospects — gold glow ring
  if (status === "signed") {
    const pulse = 0.85 + Math.sin(t * 0.003) * 0.15;
    const grad = ctx.createRadialGradient(0, 0, 4 * s, 0, 0, 28 * s);
    grad.addColorStop(0, "rgba(253,224,71,0)");
    grad.addColorStop(0.6, "rgba(253,224,71,0.35)");
    grad.addColorStop(1, "rgba(253,224,71,0)");
    ctx.globalAlpha = pulse;
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, 28 * s, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Drop shadow
  ctx.fillStyle = "rgba(0,0,0,0.42)";
  ctx.beginPath();
  ctx.ellipse(0, 17 * s, 11 * s, 3.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Compute lean — torso sways slightly opposite to gait
  const lean = gait * 0.6;

  // ── Legs ────────────────────────────────────────────────────────────
  ctx.fillStyle = "#3a2a1f";  // dark trousers
  // Front leg
  ctx.save();
  ctx.translate(-2.5 * s, 8 * s);
  ctx.rotate(gait * 0.18);
  ctx.fillRect(-1.6 * s, 0, 3.2 * s, 9 * s);
  // tiny shoe
  ctx.fillStyle = "#1a0f08";
  ctx.fillRect(-2.2 * s, 8 * s, 4.4 * s, 1.8 * s);
  ctx.restore();
  // Back leg
  ctx.fillStyle = "#3a2a1f";
  ctx.save();
  ctx.translate(2.5 * s, 8 * s);
  ctx.rotate(-gait * 0.18);
  ctx.fillRect(-1.6 * s, 0, 3.2 * s, 9 * s);
  ctx.fillStyle = "#1a0f08";
  ctx.fillRect(-2.2 * s, 8 * s, 4.4 * s, 1.8 * s);
  ctx.restore();

  // ── Torso ───────────────────────────────────────────────────────────
  ctx.save();
  ctx.rotate(lean * 0.04);  // very subtle sway
  // shirt
  ctx.fillStyle = a.shirt;
  ctx.beginPath();
  roundRect(ctx, -6.5 * s, -2 * s, 13 * s, 11 * s, 2 * s);
  ctx.fill();
  // shirt highlight (subtle vertical gradient feel)
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.beginPath();
  roundRect(ctx, -6 * s, -1.5 * s, 4 * s, 9 * s, 1 * s);
  ctx.fill();

  // ── Arms ────────────────────────────────────────────────────────────
  const armSwing = gait * 1.6;
  ctx.strokeStyle = a.shirt;
  ctx.lineWidth = 3.2 * s;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-6.5 * s, 0);
  ctx.lineTo(-8.5 * s, 7 * s + armSwing);
  ctx.moveTo(6.5 * s, 0);
  ctx.lineTo(8.5 * s, 7 * s - armSwing);
  ctx.stroke();
  // hands
  ctx.fillStyle = a.skin;
  ctx.beginPath();
  ctx.arc(-8.5 * s, 7.5 * s + armSwing, 1.5 * s, 0, Math.PI * 2);
  ctx.arc(8.5 * s, 7.5 * s - armSwing, 1.5 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // ── Head ────────────────────────────────────────────────────────────
  ctx.save();
  ctx.translate(0, -8 * s);
  // head counter-sway (very small, opposite to torso lean)
  ctx.rotate(-lean * 0.02);
  // skin
  ctx.fillStyle = a.skin;
  ctx.beginPath();
  ctx.arc(0, 0, 5 * s, 0, Math.PI * 2);
  ctx.fill();
  // subtle face shadow on the back side
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.arc(a.facing === "left" ? -1.5 * s : 1.5 * s, 0.5 * s, 4 * s, 0, Math.PI * 2);
  ctx.fill();

  // hair — depends on facing
  ctx.fillStyle = a.hair;
  ctx.beginPath();
  if (a.facing === "up") {
    // back of head — full coverage
    ctx.arc(0, -0.5 * s, 5.2 * s, 0, Math.PI * 2);
  } else if (a.facing === "down") {
    // front — just the top
    ctx.arc(0, -2 * s, 5.2 * s, Math.PI, 2 * Math.PI);
  } else {
    // side profile — cap-like
    ctx.arc(0, -1 * s, 5.2 * s, Math.PI, 2 * Math.PI);
  }
  ctx.fill();
  // small ear indicator for facing
  if (a.facing === "left" || a.facing === "right") {
    ctx.fillStyle = a.skin;
    ctx.beginPath();
    ctx.arc(a.facing === "left" ? -4.5 * s : 4.5 * s, 0.5 * s, 1 * s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ── Status badge above head ────────────────────────────────────────
  // Always render unless cold (we keep cold "invisible" so the floor isn't
  // visually polluted with gray dots when nothing's happened yet).
  if (status !== "cold") {
    const badgeY = -18 * s;
    const r = 6.5;
    // Pulse for hot statuses
    let pulse = 1;
    if (status === "discovery" || status === "proposal") pulse = 0.85 + Math.sin(t * 0.006 + a.phase) * 0.15;
    ctx.globalAlpha = pulse;
    // Soft glow
    ctx.fillStyle = statusCfg.color;
    ctx.shadowColor = statusCfg.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0, badgeY, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Inner ring (slight depth)
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, badgeY, r, 0, Math.PI * 2); ctx.stroke();
    // Glyph inside
    const glyph = statusCfg.glyph;
    if (glyph && glyph.length <= 2) {
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.font = "700 8px JetBrains Mono, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(glyph, 0, badgeY + 0.5);
    } else if (glyph) {
      // Emoji glyph
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(glyph, 0, badgeY);
    }
    ctx.globalAlpha = 1;
  }

  // ── Hover ring ─────────────────────────────────────────────────────
  if (hover === a) {
    ctx.strokeStyle = a.shirt;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(0, 14 * s, 18 * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ── Floating label ─────────────────────────────────────────────────
  const labelY = 28 * s;
  ctx.font = (hover === a ? "600 11px " : "500 10px ") + "Inter, sans-serif";
  ctx.textAlign = "center";
  const labelText = a.prospect.company;
  const tw = ctx.measureText(labelText).width;
  ctx.fillStyle = "rgba(26,18,8,0.7)";
  ctx.fillRect(-tw / 2 - 4, labelY - 2, tw + 8, 13);
  ctx.fillStyle = hover === a ? "#fff" : "rgba(245,232,216,0.85)";
  ctx.fillText(labelText, 0, labelY + 8);

  // ── Meeting time pill (shown when a meeting is scheduled) ──────────
  const meeting = a.state?.meeting;
  if (meeting) {
    const mtxt = "📅 " + fmtMeeting(meeting);
    ctx.font = "600 10px JetBrains Mono, monospace";
    const mw = ctx.measureText(mtxt).width;
    const my = labelY + 16;
    ctx.fillStyle = "rgba(110,231,183,0.18)";
    ctx.strokeStyle = "rgba(110,231,183,0.65)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const pillX = -mw / 2 - 6, pillY = my - 2, pillW = mw + 12, pillH = 14, pr = 7;
    ctx.moveTo(pillX + pr, pillY);
    ctx.lineTo(pillX + pillW - pr, pillY);
    ctx.quadraticCurveTo(pillX + pillW, pillY, pillX + pillW, pillY + pr);
    ctx.lineTo(pillX + pillW, pillY + pillH - pr);
    ctx.quadraticCurveTo(pillX + pillW, pillY + pillH, pillX + pillW - pr, pillY + pillH);
    ctx.lineTo(pillX + pr, pillY + pillH);
    ctx.quadraticCurveTo(pillX, pillY + pillH, pillX, pillY + pillH - pr);
    ctx.lineTo(pillX, pillY + pr);
    ctx.quadraticCurveTo(pillX, pillY, pillX + pr, pillY);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#a7f3d0";
    ctx.fillText(mtxt, 0, my + 9);
  }

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

/* ─── Main render loop ─── */
function draw(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000);
  lastT = t;
  const w = canvas.clientWidth, h = canvas.clientHeight;

  // Background — warm radial gradient (handled by CSS on body), but draw an
  // outer wash so the canvas blends correctly with the body bg.
  const bg = ctx.createRadialGradient(w * 0.5, h * 0.3, 0, w * 0.5, h * 0.5, Math.max(w, h));
  bg.addColorStop(0, "#3d2c1a");
  bg.addColorStop(0.5, "#2a1d10");
  bg.addColorStop(1, "#1a1208");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  // Plaza floors — one textured tile per zone, with a very subtle zone tint
  const tile = plazaTile && ctx.createPattern(plazaTile, "repeat");
  for (const zone of ["end", "channel", "tool", "boutique"]) {
    const b = zoneBounds(zone);
    if (!b) continue;
    const dim = zoneFilter && zoneFilter !== zone;

    // The plaza tile (textured stone)
    ctx.globalAlpha = dim ? 0.35 : 1;
    if (tile) {
      ctx.fillStyle = tile;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    } else {
      ctx.fillStyle = "#5a4630";
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    // Subtle zone tint overlay — keeps the plaza visible underneath
    ctx.globalAlpha = dim ? 0.05 : 0.12;
    ctx.fillStyle = ZONE_TINT[zone];
    ctx.fillRect(b.x, b.y, b.w, b.h);

    // Inset shadow (gives the plaza a sunken feel like a real courtyard)
    ctx.globalAlpha = dim ? 0.2 : 0.45;
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);

    // Inner highlight line
    ctx.globalAlpha = dim ? 0.05 : 0.18;
    ctx.strokeStyle = ZONE_TINT[zone];
    ctx.strokeRect(b.x + 2.5, b.y + 2.5, b.w - 5, b.h - 5);

    // Zone label — engraved on the floor
    ctx.globalAlpha = dim ? 0.35 : 1;
    ctx.font = '600 11px "JetBrains Mono", monospace';
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillText("▸ " + ZONE_NAME[zone].toUpperCase(), b.x + 14, b.y + 13);
    ctx.fillStyle = ZONE_TINT[zone];
    ctx.fillText("▸ " + ZONE_NAME[zone].toUpperCase(), b.x + 13, b.y + 12);
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = "rgba(245,232,216,0.55)";
    const count = PROSPECTS.filter(p => p.zone === zone).length;
    ctx.fillText(count + " prospects", b.x + 13, b.y + 28);
  }
  ctx.globalAlpha = 1;

  // Update + draw agents (sorted by y so closer ones overlap farther ones)
  agents.forEach(a => stepAgent(a, dt));
  const sorted = [...agents].sort((x, y) => x.y - y.y);
  for (const a of sorted) {
    const dim = zoneFilter && zoneFilter !== a.zone;
    ctx.globalAlpha = dim ? 0.3 : 1;
    drawAgent(a, t);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

/* ─── Hit-test, hover, click ─── */
function agentAt(x, y) {
  // Iterate back-to-front so frontmost wins
  const sorted = [...agents].sort((a, b) => b.y - a.y);
  for (const a of sorted) {
    const s = a.scale;
    const dx = x - a.x, dy = y - (a.y + 5 * s);
    if (dx * dx + dy * dy < (16 * s) * (16 * s)) return a;
  }
  return null;
}

canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const a = agentAt(x, y);
  if (a !== hover) hover = a;
  if (a) {
    canvas.style.cursor = "pointer";
    tt.style.display = "block";
    tt.style.left = (e.clientX + 14) + "px";
    tt.style.top = (e.clientY + 14) + "px";
    tt.className = "tooltip " + a.zone;
    tt.replaceChildren();
    const co = document.createElement("span"); co.className = "co"; co.textContent = a.prospect.company; tt.appendChild(co);
    const ro = document.createElement("span"); ro.className = "ro"; ro.textContent = a.prospect.role; tt.appendChild(ro);
    const stCfg = STATUSES[a.state?.status || "cold"];
    const stat = document.createElement("span"); stat.className = "stat";
    let statTxt = "● " + stCfg.label.toUpperCase();
    if (a.state?.meeting) statTxt += " · 📅 " + fmtMeeting(a.state.meeting);
    statTxt += " · click for dossier";
    stat.textContent = statTxt;
    stat.style.color = stCfg.color;
    tt.appendChild(stat);
  } else {
    canvas.style.cursor = "crosshair";
    tt.style.display = "none";
  }
});
canvas.addEventListener("mouseleave", () => { hover = null; tt.style.display = "none"; });
canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  const a = agentAt(e.clientX - r.left, e.clientY - r.top);
  if (a) openDossier(a.prospect);
});
document.addEventListener("keydown", e => {
  const zMap = { "1": "end", "2": "channel", "3": "tool", "4": "boutique" };
  if (zMap[e.key]) zoneFilter = zoneFilter === zMap[e.key] ? null : zMap[e.key];
  if (e.key === "0") zoneFilter = null;
  if (e.key === "Escape") {
    if (document.getElementById("focus").classList.contains("open")) closeDossier();
    else zoneFilter = null;
  }
});

/* ────────────────────────────────────────────────────────────────────────
   DOSSIER MODAL — unchanged business logic
   ─────────────────────────────────────────────────────────────────────── */
const focusEl = document.getElementById("focus");
const identEl = document.getElementById("ident");
const metaEl = document.getElementById("meta");
const crumbEl = document.getElementById("crumb");

function openDossier(p) {
  crumbEl.textContent = ZONE_NAME[p.zone] + " · " + p.company;
  identEl.className = "card identity " + p.zone;
  metaEl.className = "card meta-side";

  identEl.replaceChildren();

  // ── BIO HERO ──────────────────────────────────────────────────────
  const hero = document.createElement("div"); hero.className = "bio-hero";

  // Avatar — procedural sprite matching the walking floor character
  const avatarWrap = document.createElement("div");
  avatarWrap.className = "bio-avatar" + (p.personName ? "" : " no-name");
  const av = document.createElement("canvas");
  av.width = 88; av.height = 104;
  drawAvatar(av, p);
  avatarWrap.appendChild(av);
  hero.appendChild(avatarWrap);

  // Name + role + company line
  const meta = document.createElement("div"); meta.className = "bio-meta";
  const nm = document.createElement("h2");
  nm.className = "bio-name" + (p.personName ? "" : " role-only");
  nm.textContent = p.personName || p.role;
  meta.appendChild(nm);

  if (p.personName) {
    const r = document.createElement("div"); r.className = "bio-role"; r.textContent = p.role; meta.appendChild(r);
  }

  const at = document.createElement("div"); at.className = "bio-at";
  if (p.personName) {
    const atSpan = document.createElement("span"); atSpan.className = "at"; atSpan.textContent = "at"; at.appendChild(atSpan);
    const co = document.createElement("span"); co.className = "co"; co.textContent = p.company; at.appendChild(co);
  } else {
    const co = document.createElement("span"); co.className = "co"; co.textContent = p.company; at.appendChild(co);
  }
  meta.appendChild(at);

  const where = document.createElement("div"); where.className = "bio-where"; where.textContent = p.hq;
  meta.appendChild(where);

  const pills = document.createElement("div"); pills.className = "ident-pills"; pills.style.marginTop = "10px";
  const zp = document.createElement("span"); zp.className = "pill " + p.zone; zp.textContent = ZONE_NAME[p.zone]; pills.appendChild(zp);
  const curState = getProspectState(p.slug);
  const curStatusCfg = STATUSES[curState.status] || STATUSES.cold;
  const sp = document.createElement("span"); sp.className = "pill status"; sp.id = "current-status-pill";
  sp.style.color = curStatusCfg.color;
  sp.textContent = "● " + curStatusCfg.label.toUpperCase();
  pills.appendChild(sp);
  meta.appendChild(pills);

  hero.appendChild(meta);
  identEl.appendChild(hero);

  // ── BIO PARAGRAPH ─────────────────────────────────────────────────
  if (p.bio) {
    const body = document.createElement("div"); body.className = "bio-body " + p.zone;
    const pg = document.createElement("p"); pg.textContent = p.bio;
    body.appendChild(pg);
    identEl.appendChild(body);
  }

  // ── STATUS / MEETING / NOTE PANEL ────────────────────────────────
  identEl.appendChild(buildStatusPanel(p));

  // ── PHONE BUTTON ─────────────────────────────────────────────────
  const phone = document.createElement("a"); phone.className = "phone-btn";
  phone.href = "tel:+1" + p.phone.replace(/\D/g, "");
  phone.textContent = "📞 " + p.phone;
  identEl.appendChild(phone);

  // ── WHERE THEY WORK (company context, now secondary) ─────────────
  const sectionH = document.createElement("div"); sectionH.className = "bio-section-h"; sectionH.textContent = "▸ Where they work";
  identEl.appendChild(sectionH);

  const rows = [
    { k: "COMPANY", v: p.what },
    { k: "TECH STACK", v: p.techStack || "—" },
    { k: "DIGITAL", v: p.digital },
    { k: "DEALS IN FLIGHT", v: p.dealsInFlight || "—" },
    { k: "DECISION MAKERS", v: p.decisionMakers || "—" },
    { k: "ALREADY USING", v: p.alreadyUsing || "—" },
    { k: "COMPETING WITH", v: p.competition || "—" },
    { k: "LINKS", v: linksFor(p) },
  ];
  for (const r of rows) {
    const row = document.createElement("div"); row.className = "row";
    const k = document.createElement("div"); k.className = "k"; k.textContent = r.k; row.appendChild(k);
    const v = document.createElement("div"); v.className = "v";
    if (Array.isArray(r.v)) {
      const ul = document.createElement("ul");
      r.v.forEach(it => { const li = document.createElement("li"); li.textContent = it; ul.appendChild(li); });
      v.appendChild(ul);
    } else if (r.k === "LINKS" && typeof r.v === "object") {
      v.appendChild(r.v);
    } else {
      v.textContent = r.v;
    }
    row.appendChild(v);
    identEl.appendChild(row);
  }

  metaEl.replaceChildren();
  const h3 = document.createElement("h3"); h3.textContent = "The ABCs of this call"; metaEl.appendChild(h3);
  const a = document.createElement("div"); a.className = "abc-block";
  const aL = document.createElement("span"); aL.className = "label"; aL.textContent = "A · Attention hook"; a.appendChild(aL);
  const aT = document.createElement("p"); aT.className = "text"; aT.textContent = "“" + p.abc.a + "”"; a.appendChild(aT);
  metaEl.appendChild(a);
  const b = document.createElement("div"); b.className = "abc-block b";
  const bL = document.createElement("span"); bL.className = "label"; bL.textContent = "B · Buy-in trigger"; b.appendChild(bL);
  const bT = document.createElement("p"); bT.className = "text"; bT.textContent = p.abc.b; b.appendChild(bT);
  metaEl.appendChild(b);
  const c = document.createElement("div"); c.className = "abc-block c";
  const cL = document.createElement("span"); cL.className = "label"; cL.textContent = "C · Close (the exact ask)"; c.appendChild(cL);
  const cT = document.createElement("p"); cT.className = "text"; cT.textContent = p.abc.c; c.appendChild(cT);
  metaEl.appendChild(c);

  const h4 = document.createElement("h4"); h4.textContent = "Expect these pushbacks"; metaEl.appendChild(h4);
  const ul = document.createElement("ul"); ul.style.marginTop = "4px";
  p.pushbacks.forEach(q => { const li = document.createElement("li"); li.style.fontSize = "13px"; li.style.lineHeight = "1.55"; li.style.marginBottom = "4px"; li.textContent = "“" + q + "”"; ul.appendChild(li); });
  metaEl.appendChild(ul);

  const actions = document.createElement("div"); actions.className = "focus-actions";
  const practice = document.createElement("a"); practice.className = "practice-btn";
  practice.href = "http://localhost:7878/?persona=" + p.slug + "&autostart=1";
  practice.target = "_blank"; practice.rel = "noopener";
  practice.textContent = "▸ Practice the call (AI roleplay + voice)";
  actions.appendChild(practice);
  metaEl.appendChild(actions);

  focusEl.classList.add("open");
  document.body.style.overflow = "hidden";
}

/* ─── Status panel: editable pipeline state inside the dossier ─── */
function buildStatusPanel(p) {
  const cur = getProspectState(p.slug);
  const wrap = document.createElement("div"); wrap.className = "status-panel";
  const h = document.createElement("h4"); h.textContent = "▸ Pipeline state — save changes anytime"; wrap.appendChild(h);

  // Status grid
  const grid = document.createElement("div"); grid.className = "status-grid";
  for (const s of STATUS_ORDER) {
    const cfg = STATUSES[s];
    const btn = document.createElement("button"); btn.type = "button";
    btn.className = "status-opt" + (cur.status === s ? " active" : "");
    btn.dataset.s = s;
    const dot = document.createElement("span"); dot.className = "badge-dot"; btn.appendChild(dot);
    const lab = document.createElement("span"); lab.className = "badge-label"; lab.textContent = cfg.label; btn.appendChild(lab);
    btn.addEventListener("click", () => {
      grid.querySelectorAll(".status-opt").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      cur.status = s;
      markDirty();
    });
    grid.appendChild(btn);
  }
  wrap.appendChild(grid);

  // Meeting datetime — visible when status implies a scheduled meeting
  const mh = document.createElement("h4"); mh.textContent = "Meeting time (optional)";
  mh.style.marginTop = "14px"; wrap.appendChild(mh);
  const mRow = document.createElement("div"); mRow.className = "meeting-input";
  const mInput = document.createElement("input"); mInput.type = "datetime-local";
  // Convert any stored ISO to the local datetime-local format
  if (cur.meeting) {
    try {
      const d = new Date(cur.meeting);
      const off = d.getTimezoneOffset();
      const local = new Date(d.getTime() - off * 60000);
      mInput.value = local.toISOString().slice(0,16);
    } catch {}
  }
  mInput.addEventListener("input", () => {
    cur.meeting = mInput.value ? new Date(mInput.value).toISOString() : "";
    markDirty();
  });
  mRow.appendChild(mInput);
  const mClear = document.createElement("button"); mClear.type = "button"; mClear.className = "save-btn"; mClear.textContent = "Clear";
  mClear.style.padding = "7px 12px";
  mClear.addEventListener("click", () => { mInput.value = ""; cur.meeting = ""; markDirty(); });
  mRow.appendChild(mClear);
  wrap.appendChild(mRow);

  // Note
  const nh = document.createElement("h4"); nh.textContent = "Quick note"; nh.style.marginTop = "14px"; wrap.appendChild(nh);
  const nWrap = document.createElement("div"); nWrap.className = "note-input";
  const ta = document.createElement("textarea");
  ta.placeholder = "e.g. Reached the gatekeeper Tuesday — got Janet's name, calling back Friday";
  ta.value = cur.note || "";
  ta.addEventListener("input", () => { cur.note = ta.value; markDirty(); });
  nWrap.appendChild(ta);
  wrap.appendChild(nWrap);

  // Save row
  const sr = document.createElement("div"); sr.className = "save-row";
  const hint = document.createElement("span"); hint.className = "hint"; hint.id = "save-hint";
  hint.textContent = cur.updated ? "Last saved " + relTime(cur.updated) : "Not yet saved";
  sr.appendChild(hint);
  const save = document.createElement("button"); save.type = "button"; save.className = "save-btn"; save.textContent = "Save";
  save.addEventListener("click", () => {
    setProspectState(p.slug, { status: cur.status, meeting: cur.meeting, note: cur.note });
    // Update visible pill on the dossier
    const pill = document.getElementById("current-status-pill");
    if (pill) {
      const cfg = STATUSES[cur.status];
      pill.style.color = cfg.color;
      pill.textContent = "● " + cfg.label.toUpperCase();
    }
    hint.textContent = "Saved just now";
    save.classList.add("saved"); save.textContent = "✓ Saved";
    setTimeout(() => { save.classList.remove("saved"); save.textContent = "Save"; }, 1200);
    _dirty = false;
  });
  sr.appendChild(save);
  wrap.appendChild(sr);

  return wrap;
}

let _dirty = false;
function markDirty() {
  _dirty = true;
  const hint = document.getElementById("save-hint");
  if (hint) hint.textContent = "● unsaved changes";
}
function relTime(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}

/* ─── Avatar: same procedural sprite used on the floor, frozen, facing down ─── */
function drawAvatar(canvasEl, p) {
  const ctx = canvasEl.getContext("2d");
  const W = canvasEl.width, H = canvasEl.height;

  // Use the same agent the user has been watching walk, if loaded — keeps the
  // skin/hair/scale identity stable from floor → dossier. Otherwise synthesize.
  let agent = agents.find(a => a.slug === p.slug);
  const skin = agent ? agent.skin : "#e8c089";
  const hair = agent ? agent.hair : "#2a1810";
  const shirt = agent ? agent.shirt : (ZONE_SHIRT[p.zone] || "#34d399");

  // Warm-stone backdrop
  ctx.fillStyle = "#3d2c1a"; ctx.fillRect(0, 0, W, H);

  // Speckle the backdrop with plaza accents (~40 dots)
  const accents = ["#5a4630", "#4a3622", "#6a5640"];
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = accents[i % accents.length];
    ctx.fillRect(Math.random() * W | 0, Math.random() * H | 0, 1 + Math.random() * 2 | 0, 1);
  }

  // Center the character
  ctx.save();
  ctx.translate(W / 2, H * 0.78);
  const s = 2.4;  // big sprite scale for the avatar

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.42)";
  ctx.beginPath();
  ctx.ellipse(0, 14 * s, 11 * s, 3.2 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (static, slight stance)
  ctx.fillStyle = "#3a2a1f";
  ctx.fillRect(-4 * s - 1.4 * s, 8 * s, 3 * s, 9 * s);
  ctx.fillRect( 4 * s - 1.4 * s, 8 * s, 3 * s, 9 * s);
  ctx.fillStyle = "#1a0f08";
  ctx.fillRect(-4 * s - 2 * s, 16 * s, 4 * s, 1.6 * s);
  ctx.fillRect( 4 * s - 2 * s, 16 * s, 4 * s, 1.6 * s);

  // Torso (shirt)
  ctx.fillStyle = shirt;
  const tx = -6.5 * s, ty = -2 * s, tw = 13 * s, th = 11 * s, r = 2 * s;
  ctx.beginPath();
  ctx.moveTo(tx + r, ty);
  ctx.lineTo(tx + tw - r, ty);
  ctx.quadraticCurveTo(tx + tw, ty, tx + tw, ty + r);
  ctx.lineTo(tx + tw, ty + th - r);
  ctx.quadraticCurveTo(tx + tw, ty + th, tx + tw - r, ty + th);
  ctx.lineTo(tx + r, ty + th);
  ctx.quadraticCurveTo(tx, ty + th, tx, ty + th - r);
  ctx.lineTo(tx, ty + r);
  ctx.quadraticCurveTo(tx, ty, tx + r, ty);
  ctx.fill();
  // shirt highlight
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.fillRect(-6 * s, -1.5 * s, 4 * s, 9 * s);

  // Arms — at-rest, slight bend
  ctx.strokeStyle = shirt; ctx.lineWidth = 3.2 * s; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-6.5 * s, 0);
  ctx.lineTo(-9 * s, 8 * s);
  ctx.moveTo(6.5 * s, 0);
  ctx.lineTo(9 * s, 8 * s);
  ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(-9 * s, 8.5 * s, 1.6 * s, 0, Math.PI * 2);
  ctx.arc( 9 * s, 8.5 * s, 1.6 * s, 0, Math.PI * 2);
  ctx.fill();

  // Head — facing forward (down)
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, -8 * s, 5.2 * s, 0, Math.PI * 2);
  ctx.fill();
  // hair (top half cap)
  ctx.fillStyle = hair;
  ctx.beginPath();
  ctx.arc(0, -10 * s, 5.2 * s, Math.PI, 2 * Math.PI);
  ctx.fill();
  // tiny eyes
  ctx.fillStyle = "#1a0f08";
  ctx.fillRect(-2.4 * s, -8 * s, 1.2 * s, 1.4 * s);
  ctx.fillRect( 1.2 * s, -8 * s, 1.2 * s, 1.4 * s);

  ctx.restore();
}

function linksFor(p) {
  const wrap = document.createElement("div");
  wrap.style.display = "flex"; wrap.style.gap = "12px"; wrap.style.flexWrap = "wrap";
  if (p.web && !p.web.startsWith("(")) {
    const a = document.createElement("a");
    a.href = "https://" + p.web; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "🌐 " + p.web; wrap.appendChild(a);
  }
  if (p.linkedin) {
    const a = document.createElement("a");
    a.href = "https://" + p.linkedin; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "in/ company"; wrap.appendChild(a);
  }
  if (!wrap.children.length) { wrap.textContent = "— verify identity on call —"; wrap.style.color = "var(--muted)"; }
  return wrap;
}

function closeDossier() {
  focusEl.classList.remove("open");
  document.body.style.overflow = "";
}
focusEl.addEventListener("click", e => {
  if (e.target === focusEl || e.target.closest("[data-close]")) closeDossier();
});

/* ─── Boot ─── */
resize();
requestAnimationFrame(draw);
</script>
